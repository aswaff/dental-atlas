/* ================= Lesson ================= */
const OPS=(o)=>Object.assign({scene:'op',view:'room',hl:[],pins:[],cam:'room',chair:'supine',zones:false,patient:true,parts:false},o);
const LESSON_S2=[
  /* ---- The operatory ---- */
  {id:'op-intro',sec:'The operatory',title:'What is a dental operatory?',scene:OPS({pins:['chair','docunit','asstunit','light','sink'],cam:'room'}),controls:['opview','chair','zones','patient'],
   body:`<p>A ${T('dental operatory')} is a specialized room equipped with ${T('air')}, ${T('water')} and ${T('suction')} lines so the doctor can provide dental treatment. Those three utilities are what make it an operatory rather than an exam room.</p>
   <p>Every operatory has the same core pieces: the reclining patient chair, a dentist chair and an assistant chair, a doctor and an assistant delivery unit, an overhead light, an X-ray machine, a foot-operated sink, side and back consoles, a sharps container, regular and biohazard trash, and a computer. Some offices also pipe nitrous oxide to each room.</p>
   <p>Click anything in the room to name it, or drag to walk around it. Use the toolbar to switch to the mechanical room or the instruments.</p>`,
   remember:['Air, water and suction are what make an operatory. Know where each one shuts off.','Set up every room the same way so you can work without looking.'],
   check:{q:'What makes a room a dental operatory?',a:'Air, water and suction lines for treatment',d:['A window and a sink','A computer and an X-ray machine','Being next to the sterilization room'],why:'The slides define the operatory as a room equipped with air, water and suction lines that allow the doctor to treat patients.'}},
  {id:'op-chair',sec:'The operatory',title:'The patient chair',scene:OPS({hl:['chair'],pins:['chair','headrest','footctl'],cam:'chairSide',chair:'upright'}),controls:['opview','chair','patient'],
   body:`<p>The ${T('patient chair')} adjusts to the patient’s comfort and to the procedure. You will find adjustment controls on both the ${T('assistant side')} and the ${T('doctor side')}, a ${T('foot control')} on the floor, and an adjustable ${T('headrest')}.</p>
   <p>Try the chair positions in the toolbar. The chair raises and reclines together, and the leg rest lifts as the back goes down.</p>`,
   remember:['Seat and dismiss with the chair low, back upright and the arm out of the way.','Tell the patient before you move the chair, then move it slowly.','Use the foot control once you are gloved, so your hands stay clean.','Headrest: tip the head back for the upper arch; chin down for the lower arch.'],
   check:{q:'Where can the patient chair be adjusted from?',a:'Controls on both the doctor and assistant sides, plus a foot control',d:['Only from the doctor’s delivery unit','Only with the foot control','Only from the front desk computer'],why:'The chair has adjustment controls on both sides and a foot control so either person can move it.'}},
  {id:'op-pos',sec:'The operatory',title:'Supine and semi-upright positions',scene:OPS({hl:['chair'],pins:['patient'],cam:'chairSide',chair:'supine'}),controls:['opview','chair','patient'],
   body:`<p><b>Upright:</b> the back is straight up. Used to seat and dismiss the patient.</p>
   <p><b>${T('Semi-upright')}:</b> the back is reclined to about 45°. Used for patients who can’t lie back comfortably, such as some pregnant patients or patients with breathing problems, and for some procedures.</p>
   <p><b>${T('Supine')}:</b> the patient is lying back with the head, chest and knees at about the same level (nose and knees level). Most dental treatment is done in the supine position.</p>
   <p>Your competency asks you to place the chair in both the supine and the semi-upright position. Switch between them in the toolbar.</p>`,
   remember:['Supine = head, chest and knees about level. Most treatment happens here.','Semi-upright = about 45°, for comfort or breathing.','When treatment ends, bring the patient up slowly and let them sit a moment before standing, so they don’t get dizzy.','If a patient faints, lower the head below the feet and call the doctor.'],
   check:{q:'In the supine position…',a:'the patient’s head, chest and knees are at about the same level',d:['the chair back is at 45 degrees','the patient is sitting straight up','the patient’s feet are lower than the head'],why:'Supine means lying back with the head, chest and knees roughly level. It is the position for most treatment.'}},
  {id:'op-zones',sec:'The operatory',title:'The clock concept: operating zones',scene:OPS({zones:true,pins:['opstool','aststool'],cam:'top'}),controls:['opview','zones','patient'],
   body:`<p>Picture a clock face over the patient, with the top of the patient’s head at 12. For a right-handed operator:</p>
   <p><b>${T('Operator’s zone')}, 7 to 12:</b> where the dentist or hygienist sits.<br><b>${T('Transfer zone')}, 4 to 7:</b> over the patient’s chest, where instruments and materials are passed.<br><b>${T('Assistant’s zone')}, 2 to 4:</b> where you sit.<br><b>${T('Static zone')}, 12 to 2:</b> behind the head, for equipment that isn’t passed.</p>
   <p>For a left-handed operator the zones flip to the other side: operator 12 to 5, transfer 5 to 8, assistant 8 to 10, static 10 to 12.</p>`,
   remember:['Operator 7–12, transfer 4–7, assistant 2–4, static 12–2 (right-handed).','Pass instruments in the transfer zone, below the chin. Never over the patient’s face or eyes.','Your competency asks you to point out the assistant, transfer and operator zones in a real room.'],
   check:{q:'For a right-handed operator, where does the dental assistant sit?',a:'2 to 4 o’clock',d:['7 to 12 o’clock','4 to 7 o’clock','12 to 2 o’clock'],why:'The assistant’s zone is 2 to 4 o’clock. 7 to 12 belongs to the operator and 4 to 7 is the transfer zone.'}},
  {id:'op-stools',sec:'The operatory',title:'Doctor and assistant chairs',scene:OPS({hl:['aststool','opstool'],pins:['aststool','opstool'],cam:'stools'}),controls:['opview','chair','zones','patient'],
   body:`<p>The ${T('doctor chair')} (operator’s stool) is adjustable for the doctor’s comfort. It is on wheels for ease of movement, and both the height and the lumbar support can be adjusted.</p>
   <p>The ${T('assistant chair')} is always designed with an ${T('arm rest')} and a ${T('foot support ring')}. They let you lean in and transfer instruments and materials to the doctor steadily and securely.</p>`,
   remember:['Sit 4 to 6 inches (10 to 15 cm) higher than the operator so you can see into the mouth.','Feet on the ring, thighs parallel to the floor, sitting all the way back on the seat.','Hips level with the patient’s shoulder, knees facing the patient’s head.','Position the arm rest under your ribs for support when you lean in.'],
   check:{q:'Which feature is always on the assistant’s chair?',a:'An arm rest and a foot support ring',d:['A headrest','A rheostat','Adjustable lumbar support only'],why:'The assistant chair always has an arm rest and a foot support ring so you can transfer instruments steadily from a higher seat.'}},
  {id:'op-delivery',sec:'The operatory',title:'Delivery units',scene:OPS({hl:['docunit','asstunit'],pins:['docunit','asstunit','hve','aws'],cam:'units'}),controls:['opview','chair','patient'],
   body:`<p>The ${T('doctor delivery unit')} contains the treatment tray, the adjustment control for the patient chair, an air-water syringe, and multiple handpiece lines so the high-speed and slow-speed handpieces can be connected at the same time.</p>
   <p>The ${T('assistant delivery unit')} is on the assistant’s side on an adjustable arm. It has an ${T('air-water syringe')}, the ${T('saliva ejector')} (low-volume suction) and the ${T('high-speed suction')}, also called the high-volume evacuator or ${T('HVE')}.</p>`,
   remember:['Doctor unit: tray, chair controls, A/W syringe, handpiece lines.','Assistant unit: A/W syringe, saliva ejector, HVE, adjustable arm.','Flush every handpiece line and syringe for 20 to 30 seconds after each patient.','Barriers go on the touchpads, handles, syringes and hoses before the patient is seated.'],
   check:{q:'Which item is on the assistant delivery unit but not the doctor’s?',a:'High-speed suction (HVE)',d:['Air-water syringe','Treatment tray','High-speed handpiece line'],why:'Both units have an air-water syringe. The HVE and saliva ejector are on the assistant’s side.'}},
  {id:'op-light',sec:'The operatory',title:'Overhead light',scene:OPS({hl:['light'],pins:['light'],cam:'light'}),controls:['opview','chair','patient'],
   body:`<p>The ${T('overhead light')} can be mounted on a stationary pole, on a movable track, or attached to the dental unit. The light source is either ${T('halogen')} or ${T('LED')}, and the intensity can often be adjusted. The doctor may also wear a light on his or her head.</p>`,
   remember:['Patient eyewear on before the light comes on.','Turn it on aimed at the chest, then move it up to the mouth, so it never shines in the eyes.','Barrier the light handles; adjust it only by the handles.','Your competency asks you to show overhead light operation.'],
   check:{q:'What’s the safest way to bring the light to the mouth?',a:'Turn it on aimed at the chest, then move it up to the mouth',d:['Turn it on aimed at the eyes, then lower it','Leave it off until the doctor asks','Hold the lens to aim it'],why:'Starting at the chest and moving up keeps the beam out of the patient’s eyes. You adjust it by the handles, which have barriers.'}},
  {id:'op-xray',sec:'The operatory',title:'X-ray machine',scene:OPS({hl:['xray','xctl'],pins:['xray','xctl'],cam:'xray'}),controls:['opview','chair','patient'],
   body:`<p>The ${T('X-ray tube')} is on an adjustable arm so it is easier to position for an X-ray. The ${T('control panel')} is always located outside of the room. Look past the doorway on the left of the room to find it.</p>
   <p>Some offices share one X-ray unit between two operatories, and some have a handheld X-ray tube that can be moved between operatories.</p>`,
   remember:['Lead apron with thyroid collar on the patient for every exposure.','Expose from outside the room, never holding the sensor for the patient.','Fold the arm back after use so the tube head doesn’t drift or hit anyone.','Barrier the tube head and the exposure button.'],
   check:{q:'Where is the X-ray control panel located?',a:'Always outside of the operatory',d:['On the doctor delivery unit','On the tube head','Next to the patient’s headrest'],why:'The control panel is always outside the room, so the operator is away from the X-ray beam during exposure.'}},
  {id:'op-sink',sec:'The operatory',title:'Operatory sink',scene:OPS({hl:['sink','sinkpedal'],pins:['sink','sinkpedal'],cam:'sink'}),controls:['opview','patient'],
   body:`<p>Operatory sinks are always ${T('operated by foot')}. That prevents cross-contamination, because you never touch a faucet handle with dirty hands.</p>
   <p>Sinks will always have a ${T('metal mesh')} strainer to prevent dental instruments from accidentally falling down the pipe.</p>`,
   remember:['Wash hands before gloving and right after removing gloves.','Hands-free sink = no contaminated handles.','Check the mesh strainer for small instruments or burs that dropped in.'],
   check:{q:'Why are operatory sinks operated by foot?',a:'To prevent cross-contamination',d:['To save water','So the patient can use it','Because the faucet is too high to reach'],why:'Foot control means your hands never touch a handle, so bacteria aren’t passed from hands to faucet to the next person.'}},
  {id:'op-console',sec:'The operatory',title:'Consoles, computer and intraoral camera',scene:OPS({hl:['console','computer','ioc'],pins:['console','computer','ioc'],cam:'back'}),controls:['opview','patient'],
   body:`<p>The ${T('side and back consoles')} are used for storage and organization of dental materials.</p>
   <p>The ${T('computer')} holds the patient’s chart, radiographs and notes. The ${T('intraoral camera')} is a small camera wand that shows the inside of the mouth on the monitor, which helps the patient see what the doctor sees.</p>`,
   remember:['Barrier the keyboard and mouse; never type with contaminated gloves.','Lock the screen or turn it away from other patients when you step out.','New barrier sleeve on the intraoral camera for each patient.','Your competency asks you to locate the camera and review how it works.'],
   check:{q:'What do you do with the intraoral camera between patients?',a:'Remove the used barrier sleeve, disinfect as directed, and put on a new sleeve',d:['Nothing, it never enters the mouth','Rinse it in the sink','Heat-sterilize the whole camera'],why:'The wand goes in the mouth, so it gets a new barrier for every patient and is disinfected per the maker’s directions.'}},
  {id:'op-waste',sec:'The operatory',title:'Sharps, biohazard and regular trash',scene:OPS({hl:['sharps','biotrash','trash'],pins:['sharps','biotrash','trash'],cam:'waste'}),controls:['opview','patient'],
   body:`<p>Often there is a ${T('sharps container')} in each operatory, but sometimes it is only kept in a central location such as the sterilization room. All sharps must be placed inside the sharps container.</p>
   <p>${T('Biohazard trash')} is identified with a ${T('red bag')} and is reserved for trash contaminated with bloodborne pathogens. ${T('Regular trash')} is for non-contaminated items.</p>`,
   remember:['Sharps: needles, blades, burs, endo files, broken glass. Always in the sharps container.','Red bag: items soaked or caked with blood or saliva.','Regular trash: wrappers and non-contaminated items.','Never recap a needle with two hands; use the one-handed scoop or a recapping device.','Close and replace the sharps container at its fill line.'],
   check:{q:'Which goes in the red biohazard bag?',a:'Gauze soaked with blood',d:['A used anesthetic needle','A paper instrument wrapper','An empty glove box'],why:'Items saturated with blood go in the red bag. Needles go in the sharps container, and clean paper goes in regular trash.'}},
  {id:'op-n2o',sec:'The operatory',title:'Nitrous oxide delivery',scene:OPS({hl:['n2o'],pins:['n2o'],cam:'n2o'}),controls:['opview','patient'],
   body:`<p>Some offices have ${T('centralized N2O')}: nitrous oxide and oxygen are piped from tanks in the mechanical room to each operatory. A ${T('flowmeter')} mixes the two gases, which go through a reservoir bag and tubing to the patient’s nasal hood.</p>
   <p>Not all offices have it. Others use a portable unit with small tanks on a cart.</p>`,
   remember:['In the U.S., oxygen = green and nitrous oxide = blue.','Oxygen always flows with nitrous oxide.','At the end, the patient breathes 100% oxygen before sitting up.','Your competency asks you to locate the N2O delivery system, the O2 tanks and the N2 tanks.'],
   check:{q:'What color are oxygen tanks and lines in the U.S.?',a:'Green',d:['Blue','Black','Yellow'],why:'U.S. medical gas color code: oxygen green, nitrous oxide blue, nitrogen black.'}},
  {id:'op-jbox',sec:'The operatory',title:'J-box and chair suction trap',scene:OPS({hl:['jbox','trap'],pins:['jbox','trap'],cam:'jbox',patient:false}),controls:['opview','chair','patient'],
   body:`<p>The ${T('J-box')} (junction box) sits at the base of the chair. It is where the air, water, vacuum and electrical lines come up from the floor to feed the chair and delivery units.</p>
   <p>The ${T('chair suction trap')} catches solids from that chair’s suction lines before they reach the office vacuum. Where exactly it sits varies by chair: in or near the J-box, or in the assistant’s unit. Ask where yours is.</p>`,
   remember:['Cleaning the trap: utility gloves, mask, protective eyewear.','Amalgam scrap from traps is recycled as amalgam waste, never thrown in the trash or red bag.','If one room has weak suction, check that chair’s trap first.','Your competency asks you to locate the J-box, and to locate and clean the chair suction trap.'],
   check:{q:'What does the chair suction trap do?',a:'Catches solids before they reach the office vacuum',d:['Filters incoming water','Stores compressed air','Controls the light'],why:'The trap is a screen on the suction line that collects debris so it doesn’t clog the vacuum system.'}},
  {id:'mech-air',sec:'The mechanical room',title:'Compressor, vacuum and shut-offs',scene:OPS({view:'mech',pins:['compressor','vacuum','vactrap','shutoffs'],cam:'mech'}),controls:['opview'],
   body:`<p>The ${T('mechanical room')} holds the equipment that feeds every operatory.</p>
   <p>The ${T('compressor')} makes the compressed air that drives the handpieces and air-water syringes. The ${T('vacuum')} creates the suction for the HVE and saliva ejectors, and the ${T('vacuum suction trap')} collects solids from all rooms before they reach the pump.</p>
   <p>The ${T('shut-off switches')} turn the office air, vacuum and water (H2O) on and off.</p>`,
   remember:['Learn where the Air, Vac and H2O shut-offs are on your first day.','Opening and closing the office often means switching these on and off.','Weak suction in every room: check the vacuum trap. In one room: check that chair’s trap.','Your competency asks you to locate the compressor, the vacuum and its trap, and to change the trap if your system uses one.'],
   check:{q:'Which piece of equipment powers the air-driven handpieces?',a:'The compressor',d:['The vacuum','The J-box','The water filter'],why:'The compressor makes the compressed air for the handpieces and air-water syringes. The vacuum makes suction.'}},
  {id:'mech-gas',sec:'The mechanical room',title:'Gas tanks and water filtration',scene:OPS({view:'mech',pins:['o2','n2otank','n2','waterfilter'],hl:['o2','n2otank','n2'],cam:'tanks'}),controls:['opview'],
   body:`<p>${T('O2 tanks')} (oxygen) and ${T('N2O tanks')} (nitrous oxide) supply the centralized nitrous system and emergency oxygen. ${T('N2 tanks')} (nitrogen) are used in some offices to drive surgical handpieces or equipment. Cylinders are chained upright.</p>
   <p>The ${T('water line filtration')} filters the water going to the dental units. Each office has a ${T('filter replacement protocol')}: how often the filters are changed and how the change is recorded.</p>`,
   remember:['Oxygen green, nitrous oxide blue, nitrogen black (U.S.). Read the label, not just the color.','Keep a full spare tank; check pressure regularly.','Change water filters on schedule and write the date on the log.'],
   check:{q:'What should you do every time you replace a water line filter?',a:'Record the date following the office protocol',d:['Nothing else is needed','Turn off the vacuum for a day','Change the N2O tank too'],why:'The replacement protocol includes logging the change, so the next person knows when it is due.'}},
  /* ---- Instruments ---- */
  {id:'inst-parts',sec:'Instruments',title:'Parts of an instrument',scene:OPS({view:'inst',parts:true,pins:['ip_work','ip_shank','ip_shaft'],cam:'explorer'}),controls:['opview','parts'],
   body:`<p>Every hand instrument has three parts:</p>
   <p><b style="color:#F08A24">${T('Working end')}</b> accomplishes the instrument’s unique function. It can be a ${T('blade')} for cutting, a ${T('point')} for probing and exploring, or a ${T('nib')} for condensing restorative material.<br>
   <b style="color:#2F6BE0">${T('Shank')}</b> connects the working end to the handle.<br>
   <b style="color:#2FA36B">${T('Shaft')}</b> is the handle the user holds.</p>
   <p>The colors are on for every instrument on the tray. Turn them off in the toolbar and test yourself.</p>`,
   remember:['Working end does the work; shank connects; shaft is the handle.','Your competency asks you to point to the shank, working tip and shaft of any instrument.'],
   check:{q:'Which part connects the working end to the handle?',a:'The shank',d:['The shaft','The nib','The blade'],why:'The shank joins the working end to the shaft (handle). It is often angled so the working end can reach the tooth.'}},
  {id:'inst-exam',sec:'Instruments',title:'Basic examination instruments',scene:OPS({view:'inst',hl:['mirror','explorer','pliers','probe'],pins:['mirror','explorer','pliers','probe'],cam:'exam'}),controls:['opview','parts'],
   body:`<p>The ${T('basic setup')} is on almost every tray:</p>
   <p><b>${T('Mouth mirror')}:</b> indirect vision, retraction, light reflection and tissue protection.<br>
   <b>${T('Explorer')}:</b> a sharp point to feel for decay, calculus and rough margins.<br>
   <b>${T('Cotton pliers')}:</b> carry small items into and out of the mouth.<br>
   <b>${T('Periodontal probe')}:</b> blunt and marked in millimeters to measure pocket depth.</p>`,
   remember:['Tray order, left to right: mirror, explorer, cotton pliers, probe.','Mirror is passed first.','Probe = blunt, marked. Explorer = sharp point.','You record perio readings as they’re called out, usually six per tooth.'],
   check:{q:'Which basic instrument measures pocket depth?',a:'Periodontal probe',d:['Explorer','Mouth mirror','Cotton pliers'],why:'The probe is blunt with millimeter markings to measure the depth of the gingival sulcus or pocket.'}},
  {id:'inst-acc',sec:'Instruments',title:'Accessory instruments',scene:OPS({view:'inst',hl:['spatula','scissors','dappen','composite','brush','artic'],pins:['spatula','composite','scissors','artic','dappen','brush'],cam:'accessory'}),controls:['opview','parts'],
   body:`<p>${T('Accessory hand instruments')} support the procedure:</p>
   <p><b>Spatulas</b> mix cements and impression materials. <b>Scissors</b> trim bands, cord and temporaries. The <b>dappen dish</b> holds small amounts of material. <b>Composite placement instruments</b> place and shape tooth-colored fillings without sticking. <b>Applicators and brushes</b> apply etch, bond and varnish. The <b>articulation paper holder</b> checks the bite.</p>`,
   remember:['Set these out in the order of the procedure, after the basic setup.','Pass scissors and pliers closed, handle first.','Microbrushes and applicators are single use.'],
   check:{q:'Which instrument is used to check the patient’s bite?',a:'Articulation paper holder',d:['Dappen dish','Cotton pliers','Spatula'],why:'The holder grips articulating paper, which marks where the teeth contact when the patient bites.'}},
  {id:'inst-trays',sec:'Instruments',title:'Trays, tubs and cassettes',scene:OPS({view:'inst',hl:['tray','cassette'],pins:['tray','cassette'],cam:'instAll'}),controls:['opview','parts'],
   body:`<p>Trays and instruments are often ${T('color-coded')} by procedure, treatment room, operator or sequence. Instruments are positioned on the tray in ${T('order of use')} or by function.</p>
   <p>The ${T('cassette system')} uses preassembled trays that are wrapped in paper and color-coded. ${T('Tubs')} hold the supplies for a procedure so they can be grabbed in one trip.</p>`,
   remember:['Instruments in a cassette stay in it through cleaning and sterilization, so you handle dirty sharps less.','Match the color code to the procedure before you open the pack.','Count instruments before and after the procedure.'],
   check:{q:'How are instruments usually arranged on a tray?',a:'In order of use, or by function',d:['Alphabetically','By size, largest first','At random'],why:'The slides say instruments are positioned on trays in order of use or by function, so the next one is always where you expect it.'}},
  {id:'inst-hp',sec:'Instruments',title:'Handpieces',scene:OPS({view:'inst',hl:['hs','slowspeed','latch','straightnose','prophy'],pins:['hs','latch','straightnose','prophy'],cam:'handpieces'}),controls:['opview'],
   body:`<p><b>${T('High-speed handpiece')} (friction grip):</b> cuts enamel and removes decay. The bur is held by friction.<br>
   <b>${T('Slow-speed handpiece')}:</b> a motor with attachments, the ${T('latch-type')} contra-angle and the ${T('straight nose cone')} (twist lock).<br>
   <b>${T('Hygiene handpiece')} (no lock):</b> takes a disposable prophy angle to polish teeth.</p>
   <p>The slides also list electric, ultrasonic, laser and laboratory handpieces.</p>`,
   remember:['High speed = friction grip. Slow speed = latch type or straight nose (twist lock). Hygiene = no lock.','Heat-sterilize handpieces after every patient.','Flush each line 20 to 30 seconds; never run a handpiece without a bur.','Your competency asks you to identify high-speed, slow-speed, latch-type and straight cone handpieces.'],
   check:{q:'Which handpiece holds its bur by friction grip?',a:'High-speed handpiece',d:['Straight nose cone','Latch-type contra-angle','Hygiene prophy handpiece'],why:'High-speed handpieces use friction-grip (FG) burs. The contra-angle is latch type and the straight nose cone is twist lock.'}},
  {id:'inst-burs',sec:'Instruments',title:'Burs',scene:OPS({view:'inst',hl:['bur_fg','bur_ra','bur_hp','burblock'],pins:['bur_fg','bur_ra','bur_hp','burblock'],cam:'burs'}),controls:['opview'],
   body:`<p>${T('Dental burs')} come as cutting, finishing, diamond, surgical, laboratory and fissurotomy burs.</p>
   <p>The shank decides which handpiece a bur fits: a short smooth ${T('friction-grip (FG)')} shank for the high-speed, a notched ${T('latch-type (RA)')} shank for the contra-angle, and a long ${T('straight (HP)')} shank for the nose cone. The big burs on the mat are shown at three times life size.</p>`,
   remember:['Match the bur shank to the handpiece.','Burs are sharps: use a bur block and never pick them up loose with bare fingers.','Seat the bur fully and tug to check it is locked before you pass the handpiece.'],
   check:{q:'Which bur has a notch at the end of the shank?',a:'Latch-type (RA) bur',d:['Friction-grip (FG) bur','Straight (HP) bur','Diamond bur only'],why:'The notch and flat let the latch in the contra-angle lock the bur in place.'}},
  {id:'inst-transfer',sec:'Instruments',title:'Instrument transfer and grasps',scene:OPS({zones:true,hl:['z_trans'],pins:['z_trans','hve'],cam:'transfer'}),controls:['opview','zones','patient'],
   body:`<p>Goals for successful ${T('instrument transfer')}: let the dentist keep eyes on the mouth; give the right instrument at the right time; maintain the dentist’s ${T('fulcrum')} (finger rest); transfer with the proper hand while still doing other tasks; and hand it so the dentist can begin using it without repositioning.</p>
   <p>Grasps: ${T('pen')}, ${T('modified pen')}, ${T('palm')}, ${T('palm-thumb')} and ${T('modified palm')}. When you hold the ${T('evacuator')}, anterior teeth usually call for a pen or modified pen grasp, and posterior teeth for a modified palm (thumb-to-nose) grasp.</p>
   <p>Transfers can be one-handed (your left hand passes while your right holds the HVE or syringe) or two-handed.</p>`,
   remember:['Transfer in the transfer zone, below the chin.','Hand it working end toward the arch: up for maxillary, down for mandibular.','Pick up the used instrument with your little finger, then deliver the new one.','HVE: pen grasp for anterior teeth, thumb-to-nose for posterior teeth.'],
   check:{q:'What grasp is usually used to hold the evacuator for posterior teeth?',a:'Modified palm (thumb-to-nose) grasp',d:['Pen grasp','Palm-thumb grasp','Modified pen grasp'],why:'The slides say posterior teeth usually call for a modified palm grasp with the thumb toward the patient’s nose.'}},
  {id:'inst-hyg',sec:'Instruments',title:'Hygiene instruments',scene:OPS({view:'inst',hl:['sickle','curette','implantprobe','cavitron','prophy'],pins:['sickle','curette','implantprobe','cavitron','prophy'],cam:'hygiene'}),controls:['opview','parts'],
   body:`<p>The hygiene setup adds ${T('scalers')} (pointed tip, for calculus above the gumline) and ${T('curettes')} (rounded toe, can go below the gumline) to the mirror, explorer and probe. ${T('Cavitron')} (ultrasonic) tips and ${T('Prophy Jet')} (air polishing) tips clean with vibration or spray, and the ${T('prophy handpiece')} with a prophy angle and paste polishes.</p>
   <p>${T('Implant')} probes and scalers are plastic or titanium so they won’t scratch an implant.</p>`,
   remember:['At times you will set up for and support the hygienist.','Pointed tip = scaler; rounded toe = curette.','Never use steel instruments on implants.','Ultrasonic scaling makes heavy aerosol: HVE and full PPE.'],
   check:{q:'Why are implant scalers made of plastic or titanium?',a:'So they won’t scratch the implant surface',d:['They are cheaper','They are sharper than steel','They can’t be sterilized'],why:'Steel scratches titanium implants, and scratches collect plaque.'}},
  /* ---- The office and team ---- */
  {id:'off-sections',sec:'The office and team',title:'The dental office: two sections',scene:{scene:'svg',view:'office',layers:['clinical','business'],hl:['o_op1','o_xray','o_steri','o_lab','o_recep','o_wait','o_consult','o_bizoff']},controls:[],
   body:`<p>Office design should give the patient a positive experience (cleanliness and neatness, privacy and comfort, sound and smell control) and help the team work (efficient use of space and equipment, comfort and ease of movement).</p>
   <p>The office is made up of 2 sections. The ${T('clinical section')} has the patient treatment rooms, X-ray room, sterilization room and laboratory. The ${T('business section')} has the receptionist area, waiting room, consultation room and business office.</p>`,
   remember:['Patients notice smells and sounds first; keep the sterilization door closed.','Never walk gloves or contaminated items into the business section.','Consultation room = privacy for treatment and fee discussions.'],
   check:{q:'Which room is part of the business section?',a:'Consultation room',d:['Sterilization room','Laboratory','X-ray room'],why:'The business section is the receptionist area, waiting room, consultation room and business office.'}},
  {id:'off-business',sec:'The office and team',title:'A small-business model',scene:{scene:'svg',view:'office',layers:['clinical','business'],hl:['o_bizoff','o_recep']},controls:[],
   body:`<p>Most dental offices are owned by a dentist. Dentists are first health care providers, but also small business owners, and like any small business they need a good business model to succeed.</p>
   <p>Keys to a successful dental business: a great ${T('team leader')} (often the dentist or office manager), great team members, good-quality service, great communication with patients, standing behind your work, and understanding the ${T('practice numbers')}.</p>`,
   remember:['Running on time, not wasting supplies and explaining treatment clearly all help the practice succeed.','Patients are the practice’s customers; how you treat them matters.'],
   check:{q:'Which is a key to a successful dental business from the slides?',a:'Great communication with patients',d:['Keeping fees secret','Having the most operatories','Avoiding follow-up calls'],why:'The keys are a great leader and team, quality service, communication with patients, standing behind the work and knowing the numbers.'}},
  {id:'off-team',sec:'The office and team',title:'The dental team',scene:{scene:'svg',view:'office',layers:['clinical','business'],hl:['o_op1','o_bizoff']},controls:[],
   body:`<p>The team is divided into 2 departments.</p>
   <p><b>${T('Clinical department')}:</b> dentist, dental hygienist, dental assistant (${T('chairside assistant')} and ${T('circulating assistant')}) and dental lab technician.</p>
   <p><b>${T('Business department')}:</b> office manager, receptionist, treatment coordinator, insurance coordinator and appointment coordinator.</p>
   <p>At times the assistant may support the dental hygienist.</p>`,
   remember:['Chairside assistant works at the chair with the doctor; circulating assistant helps wherever needed.','Know who to route questions to: insurance to the insurance coordinator, treatment plans and fees to the treatment coordinator.'],
   check:{q:'Which team member is in the business department?',a:'Treatment coordinator',d:['Dental hygienist','Dental lab technician','Circulating assistant'],why:'The business department is the office manager, receptionist and the treatment, insurance and appointment coordinators.'}},
  {id:'off-da',sec:'The office and team',title:'The dental assistant',scene:OPS({pins:['aststool','asstunit'],hl:['aststool'],zones:true,cam:'stools'}),controls:['opview','zones','patient'],
   body:`<p>The dental assistant is the ${T('most versatile member')} of the dental team. You help the doctor during procedures, clean and set up the operatory, take X-rays, answer the phone, present treatment, review the medical history, educate the patient, and much more.</p>
   <p>What makes a dental assistant stand out: being at ease with patients, being a people person and good communicator, preparing efficiently and correctly for procedures, being aware of your surroundings, knowing what the doctor wants before he or she asks, and being organized.</p>`,
   remember:['Anticipate: have the next instrument ready before it’s asked for.','Review the medical history before every appointment, and flag changes to the doctor.','Watch the patient, not just the tooth.'],
   check:{q:'Which trait helps an assistant stand out, according to the slides?',a:'Knowing what the doctor wants before he or she asks',d:['Working quietly without talking to patients','Waiting for instructions at each step','Avoiding the front desk'],why:'Anticipating the doctor’s needs is on the list, along with ease with patients, communication, preparation, awareness and organization.'}},
  {id:'off-spec',sec:'The office and team',title:'Dental specialties',scene:{scene:'svg',view:'office',layers:['clinical','business'],hl:['o_op1']},controls:[],
   body:`<p>The slides list the practices you are most likely to work in:</p>
   <p><b>General dentist:</b> the family dentist; not a specialty, but most assistants start here.<br>
   <b>${T('Endodontist')}:</b> root canals and the pulp.<br>
   <b>${T('Oral and maxillofacial surgeon')}:</b> extractions, implants and jaw surgery.<br>
   <b>${T('Orthodontist')}:</b> braces and aligners to straighten teeth.<br>
   <b>${T('Periodontist')}:</b> gums and supporting bone.<br>
   <b>${T('Pediatric dentist')}:</b> children’s dentistry.<br>
   <b>${T('Prosthodontist')}:</b> replacing teeth with crowns, bridges, dentures and implant restorations.</p>
   <p>The ADA recognizes additional specialties beyond these, such as dental public health and oral and maxillofacial radiology.</p>`,
   remember:['Endo = inside the tooth. Perio = around the tooth. Prostho = replacing teeth. Ortho = straightening.','Each specialty has its own trays and instruments; ask for the setup list on day one.'],
   check:{q:'Which specialist treats the gums and supporting bone?',a:'Periodontist',d:['Endodontist','Prosthodontist','Orthodontist'],why:'Perio means around the tooth. Endodontists treat the pulp, prosthodontists replace teeth and orthodontists straighten them.'}},
  {id:'off-edu',sec:'The office and team',title:'Education and professional organizations',scene:{scene:'svg',view:'office',layers:['clinical','business'],hl:['o_lab']},controls:[],
   body:`<p><b>Dentists</b> must graduate from an accredited dental school, pass a national written exam, and pass written and clinical exams in the state where they plan to practice.</p>
   <p><b>Dental hygienists</b> must graduate from an accredited program and pass written and clinical exams.</p>
   <p><b>Dental laboratory technicians:</b> formal training varies greatly (community and junior colleges, vocational-technical institutes, armed forces). They must pass an exam to become ${T('certified dental technicians (CDTs)')}.</p>
   <p>Professional organizations: the ${T('ADA')} (American Dental Association), the ${T('ADAA')} (American Dental Assistants Association) and the ${T('ADHA')} (American Dental Hygienists’ Association). The ADAA provides continuing education and professional development, and promotes legislation to improve the delivery of quality dental care.</p>`,
   remember:['ADAA is your association as an assistant.','What assistants may legally do depends on your state; learn your state’s rules.'],
   check:{q:'Which organization represents dental assistants?',a:'ADAA',d:['ADA','ADHA','CDT'],why:'The American Dental Assistants Association (ADAA) offers continuing education and promotes legislation for assistants. The ADA is for dentists and the ADHA for hygienists.'}},
  /* ---- Professionalism, ethics and law ---- */
  {id:'pro-char',sec:'Professionalism, ethics and law',title:'Professionalism',scene:OPS({pins:['aststool','opstool'],cam:'stools'}),controls:['opview','chair','patient'],
   body:`<p>A ${T('profession')} is more than a job: it takes special education and skills, and it comes with a responsibility to the people you serve.</p>
   <p>Personal characteristics of a professional: dependability and punctuality, adaptability, maturity, accuracy, honesty, empathy, courtesy and patience, tactful communication, a positive attitude and initiative. Also: trustworthiness, a ${T('professional appearance')}, commitment, a sense of responsibility, a professional attitude, and skills and knowledge.</p>`,
   remember:['Be early, not on time. The room must be set before the patient arrives.','Professional appearance: clean scrubs, hair up and off the shoulders, short natural nails, minimal jewelry, no strong scents.','Phone away in clinical areas.','Tact: what you say at the chair, the patient hears.'],
   check:{q:'Which is a characteristic of a professional from the slides?',a:'Dependability and punctuality',d:['Working only assigned hours with no flexibility','Sharing opinions about patients','Keeping skills the same over time'],why:'Dependability and punctuality lead the list, followed by adaptability, maturity, accuracy and honesty.'}},
  {id:'pro-ethics',sec:'Professionalism, ethics and law',title:'Ethics',scene:{scene:'svg',view:'office',layers:['clinical','business'],hl:['o_consult']},controls:[],
   body:`<p>Basic ${T('ethical principles')}:</p>
   <p><b>${T('Nonmaleficence')}:</b> do no harm.<br><b>${T('Beneficence')}:</b> do good.<br><b>${T('Autonomy')}:</b> freedom of choice, and responsibility for actions.<br><b>${T('Confidentiality')}:</b> the right to privacy.</p>
   <p>A professional ${T('code of ethics')} is the voluntary principles of conduct governing an individual or group within a career field. Ethical dental business practices cover advertising, fees and patient treatment, including not providing unnecessary dental treatment.</p>`,
   remember:['Ethics are voluntary standards; laws are enforced.','Autonomy: the patient chooses, after being told the options.','Confidentiality: what happens in the office stays in the office.'],
   check:{q:'Which ethical principle means “do no harm”?',a:'Nonmaleficence',d:['Beneficence','Autonomy','Confidentiality'],why:'Nonmaleficence is do no harm; beneficence is do good.'}},
  {id:'pro-law',sec:'Professionalism, ethics and law',title:'Patient care laws',scene:{scene:'svg',view:'office',layers:['clinical','business'],hl:['o_consult','o_wait']},controls:[],
   body:`<p><b>${T('Americans with Disabilities Act')} (ADA):</b> the office must be accessible to people with disabilities. Don’t confuse this ADA with the American Dental Association.</p>
   <p><b>${T('Informed consent')}:</b> the patient agrees to treatment after it has been explained. A signed consent form is also called an informed consent or ${T('express contract')}.</p>
   <p><b>${T('Standard of care')}:</b> the level of care a reasonable, prudent practitioner would provide in the same situation.</p>
   <p><b>${T('Good Samaritan laws')}:</b> protect people who volunteer to help someone who is ill or injured.</p>`,
   remember:['Informed consent covers the diagnosis, the procedure, risks, benefits, alternatives and cost, and the patient can withdraw it.','Signed consent = express contract.','Chart everything in ink or the software; correct errors with one line, your initials and the date. Never erase.'],
   check:{q:'A signed consent form is also referred to as…',a:'an informed consent or express contract',d:['a standard of care','a HIPAA release','a Good Samaritan form'],why:'The slides say a signed consent form is also called an informed consent or express contract.'}},
  {id:'pro-hipaa',sec:'Professionalism, ethics and law',title:'HIPAA and patient records',scene:{scene:'svg',view:'office',layers:['clinical','business'],hl:['o_recep','o_bizoff']},controls:[],
   body:`<p>The ${T('Health Insurance Portability and Accountability Act (HIPAA)')} covers standardized code sets and claims procedures, ${T('privacy rules')}, confidentiality exceptions and ${T('dental charts')}.</p>
   <p>It also covers how the privacy rule affects dental office practices, enforcement and penalties, and training for everyone on the team.</p>`,
   remember:['Share only the minimum necessary about a patient, only with those who need it.','Don’t discuss patients at the front desk, in hallways or on social media.','Lock the screen and turn charts face down.','The patient chart is a legal document.'],
   check:{q:'Which of these follows HIPAA?',a:'Locking the computer screen when you leave the operatory',d:['Discussing a patient’s treatment in the waiting room','Posting a before-and-after photo without permission','Leaving the day sheet on the front counter'],why:'Protecting records from people who don’t need them is the core of the privacy rule.'}},
  /* ---- Wrap-up ---- */
  {id:'comp',sec:'Wrap-up',title:'Your Week 2 competency checklist',scene:OPS({pins:[],cam:'room',zones:false}),controls:['opview','chair','zones','patient'],comp:true,
   body:`<p>This is your school’s Session 2 competency. In your externship office, a lead assistant or the dentist watches you identify each item and grades it S (satisfactory) or U (unsatisfactory). If you are corrected, you repeat that item after 1 hour. If an item isn’t in the office, it is marked N/A.</p>
   <p>Use “Show” to find each item in the 3D rooms, and check off the ones you can find on your own. Your checks are saved on this device only.</p>`},
  {id:'best',sec:'Wrap-up',title:'Things best to remember',scene:OPS({zones:true,pins:[],cam:'top'}),controls:['opview','chair','zones','patient'],
   body:`<div class="remember"><h3>The operatory</h3><ul>
   <li>Operatory = air, water and suction lines.</li><li>Zones (right-handed): operator 7–12, transfer 4–7, assistant 2–4, static 12–2.</li><li>Assistant sits 4–6 in higher, feet on the ring; transfer below the chin.</li>
   <li>Supine: head, chest, knees level. Semi-upright: about 45°. Upright to seat and dismiss.</li><li>Sink is foot-operated with a metal mesh. X-ray control is always outside the room.</li>
   <li>Sharps in the sharps container; blood-soaked items in the red bag; clean items in regular trash.</li><li>Oxygen green, nitrous blue, nitrogen black (U.S.).</li>
   <li>Mechanical room: compressor (air), vacuum and its trap, water filters, and the Air/Vac/H2O shut-offs.</li></ul></div>
   <div class="remember"><h3>Instruments</h3><ul>
   <li>Working end (blade, point, nib) · shank · shaft.</li><li>Basic setup in order: mirror, explorer, cotton pliers, probe.</li>
   <li>High speed = friction grip. Slow speed = latch type or straight nose (twist lock). Hygiene = no lock.</li><li>Match bur shank to handpiece: FG, RA (latch), HP.</li>
   <li>HVE: pen grasp anterior, thumb-to-nose posterior.</li><li>Implants: plastic or titanium instruments only.</li></ul></div>
   <div class="remember"><h3>Office, ethics and law</h3><ul>
   <li>Clinical section: treatment, X-ray, sterilization, lab. Business section: reception, waiting, consultation, business office.</li>
   <li>Clinical department: dentist, hygienist, assistant (chairside, circulating), lab tech. Business: office manager, receptionist, treatment, insurance and appointment coordinators.</li>
   <li>Nonmaleficence (no harm), beneficence (good), autonomy (choice), confidentiality (privacy).</li>
   <li>Signed consent = informed consent = express contract. ADA the law ≠ ADA the association.</li><li>HIPAA: minimum necessary, privacy, training.</li></ul></div>`}
];

const OPQ=(o)=>Object.assign({type:'findOp',view:'room',cam:'room',chair:'supine',zones:false,patient:true,parts:false},o);

/* ================= Week 3 · Infection control and sterilization ================= */
Object.assign(OPP,{
  disinfect:{v:'room',grp:'Infection control',name:'Surface disinfectant and wipes',def:'An EPA-registered hospital disinfectant with a tuberculocidal (TB) claim, used to preclean and then disinfect surfaces between patients.',da:'Spray the towel, not the surface. Wipe once to preclean, then use a fresh towel to disinfect and leave it wet for the label’s contact time.'},
  barrier:{v:'room',grp:'Infection control',name:'Surface barriers',def:'Fluid-resistant plastic covers placed over surfaces that are touched during treatment and hard to clean: headrest, light handles, switches, touch pads, syringe and evacuator handles, x-ray controls, drawer handles.',da:'Put barriers on a clean, dry surface with clean hands. Take them off with utility gloves without touching the surface underneath. If you touch it, clean and disinfect it.'},
  counter:{v:'steri',grp:'Safety and records',name:'Sterilization counters',def:'One continuous work area arranged so instruments move in one direction: contaminated, then clean, then sterile, then storage.',da:'Clean the sterilization area like a treatment room: utility gloves, preclean, then disinfect. Never set clean packs on the dirty side.'},
  sterisink:{v:'steri',grp:'Contaminated area',name:'Deep sink (hands-free)',def:'A deep sink with hands-free controls for rinsing instruments after the ultrasonic cleaner.',da:'Hold the basket at an angle and rinse with minimal splashing. Wear your mask and eyewear.'},
  eyewash:{v:'steri',grp:'Contaminated area',name:'Eyewash station',def:'Required where chemicals and contaminated material could splash into the eyes.',da:'Know where it is before you need it. Flush the eyes for the time stated by the manufacturer and the SDS, then report the exposure.'},
  utilgloves:{v:'steri',grp:'Contaminated area',name:'Utility gloves',def:'Heavy, puncture-resistant gloves worn to clean rooms, handle contaminated instruments and disinfect surfaces. Never used for patient care.',da:'Each person has their own pair. Wash, disinfect and dry them after use, and throw them out when they crack or tear.'},
  transport:{v:'steri',grp:'Contaminated area',name:'Transport container',def:'A rigid, leakproof, covered container used to carry contaminated instruments from the treatment room to the processing area.',da:'Discard sharps and disposables in the treatment room first, then carry the covered tub with utility gloves on.'},
  ultrasonic:{v:'steri',grp:'Contaminated area',name:'Ultrasonic cleaner',def:'Uses sound waves that make tiny bubbles implode (cavitation) to loosen debris from instruments. Cycles run about 5 to 15 minutes, longer for plastic cassettes.',da:'Lid on while it runs. Use only ultrasonic solution, change it at least daily or when cloudy, and rinse and dry the tank. It must carry a biohazard label and a chemical label.'},
  holding:{v:'steri',grp:'Contaminated area',name:'Holding solution',def:'A covered container of noncorrosive solution (often enzymatic or dishwasher detergent) that keeps blood and debris from drying on instruments that can’t be cleaned right away.',da:'Label it with a biohazard label and a chemical label, and change it at least twice a day or when cloudy.'},
  impression:{v:'steri',grp:'Contaminated area',name:'Impression and disinfectant spray',def:'Impressions are contaminated with saliva and possibly blood when they come out of the mouth.',da:'Rinse, spray with an intermediate-level disinfectant and wrap in a wet paper towel for the contact time (or immerse), then rinse again and gently shake off the water.'},
  scrubbrush:{v:'steri',grp:'Contaminated area',name:'Long-handled scrub brush',def:'Used when instruments or burs must be scrubbed by hand. Hand scrubbing is the least desirable way to clean instruments.',da:'Utility gloves, goggles and gown. One or two instruments at a time, kept above the water line, brushing away from your hand.'},
  stsharps:{v:'steri',grp:'Contaminated area',name:'Sharps container (processing area)',def:'Puncture-resistant, closable, leakproof and labeled with the biohazard symbol. Broken glass and any sharps found on a tray go here.',da:'Never pick up broken glass with your hands; use tongs or a brush and dustpan.'},
  pouches:{v:'steri',grp:'Clean area',name:'Sterilization pouches',def:'Self-sealing paper and plastic pouches made for sterilization. Packaging keeps instruments sterile until they are used.',da:'Use only packaging labeled for your sterilizer. Never use staples, pins or paper clips, and never reuse a pouch.'},
  pouch:{v:'steri',grp:'Clean area',name:'Sealed and labeled pouch',def:'Instruments are clean before packaging. A process integrator goes inside, and the pouch is sealed and labeled with the date, contents and sterilizer.',da:'Group instruments into setups (hygiene, composite, crown, burs) so each pouch has what one procedure needs.'},
  integrator:{v:'steri',grp:'Clean area',name:'Process integrators',def:'Internal chemical indicators placed inside each package. They react to time, temperature and pressure together, so they show that the sterilizing agent got inside.',da:'Check the integrator when you open a pack. If it didn’t change, don’t use the instruments.'},
  wrapcass:{v:'steri',grp:'Clean area',name:'Wrapped cassette',def:'A cassette wrapped in sterilization wrap and sealed with indicator tape. The striped tape is an external process indicator.',da:'The tape only shows the pack went through heat. It doesn’t prove the pack is sterile.'},
  coldsteri:{v:'steri',grp:'Clean area',name:'Cold sterilization (liquid sterilant)',def:'A covered tray of liquid sterilant such as glutaraldehyde for items that can’t take heat. Sterilization takes 10 hours of contact; anything less is only disinfection.',da:'Label it with the chemical name and activation date, keep the lid closed, rinse items well before use, and test the concentration as directed.'},
  lube:{v:'steri',grp:'Clean area',name:'Handpiece lubricant',def:'Spray lubricant for handpieces, applied after cleaning and before sterilizing according to the manufacturer.',da:'Run the handpiece briefly after lubricating to clear the excess, wipe it, then bag and sterilize it.'},
  ecp:{v:'steri',grp:'Safety and records',name:'Exposure control plan',def:'OSHA’s required written plan describing how the office follows the Bloodborne Pathogens Standard. Reviewed and updated at least once a year.',da:'Know where it is and what it says to do after a needlestick.'},
  sds:{v:'steri',grp:'Safety and records',name:'Safety data sheets (SDS) binder',def:'An SDS for every chemical product in the office, in the standard 16-section format.',da:'The assistant is often the hazard communication coordinator: add an SDS when a new product comes in.'},
  autoclave:{v:'steri',grp:'Sterilization and storage',name:'Autoclave (steam sterilizer)',def:'Sterilizes with steam under pressure. Common cycles: 250°F (121°C) for 15 to 30 minutes or 273°F (134°C) for 3 to 10 minutes.',da:'Fill with distilled water, load packs on edge with space between them, don’t overload, and let the load cool and dry before removing it.'},
  distilled:{v:'steri',grp:'Sterilization and storage',name:'Distilled water',def:'Autoclaves use distilled water because tap water has minerals that leave deposits and corrode metal.',da:'Check the reservoir level at the start of the day and refill only with distilled water.'},
  statim:{v:'steri',grp:'Sterilization and storage',name:'STATIM (rapid cassette sterilizer)',def:'A fast steam sterilizer that runs instruments in a cassette. Fast cycles usually mean unwrapped instruments, which are no longer sterile once the cassette is opened.',da:'Use what comes out of a rapid cycle right away. Packaged sterilization is always preferred.'},
  spore:{v:'steri',grp:'Sterilization and storage',name:'Spore test (biologic indicator)',def:'Strips or vials of harmless, highly resistant bacterial spores. Biologic monitoring is the only way to prove sterilization actually happened.',da:'At least weekly: two strips in packs at the center of the load, one control strip not sterilized, all mailed to the service.'},
  log:{v:'steri',grp:'Sterilization and storage',name:'Sterilization log',def:'Records each spore test: date, sterilizer, cycle, temperature, time and operator, plus the result.',da:'Take off your utility gloves and wash your hands before you write in the log.'},
  storage:{v:'steri',grp:'Sterilization and storage',name:'Sterile storage',def:'A clean, dry, closed area for sterile packs, kept separate from contaminated items.',da:'Put on clean exam gloves to handle sterile packs. Rotate stock so the oldest dates are used first, and check packs for tears before use.'}
});

const CHAIN=[['c_agent','Infectious agent','#C8322F'],['c_reservoir','Reservoir','#E07A2E'],['c_exit','Portal of exit','#C98A0B'],['c_trans','Mode of transmission','#2FA36B'],['c_entry','Portal of entry','#2F6BE0'],['c_host','Susceptible host','#7A4FB0']];
Object.assign(SVGP,{
  c_agent:{v:'chain',name:'Infectious agent',def:'The pathogen (bacterium, virus or fungus). It must be present in large enough numbers and be virulent (strong enough) to cause disease. Break it by killing it: sterilization and disinfection.'},
  c_reservoir:{v:'chain',name:'Reservoir',def:'Where the organism lives and multiplies: people, water, food, contaminated surfaces and bioburden (blood and saliva). Break it with handwashing and cleaning and disinfecting surfaces.'},
  c_exit:{v:'chain',name:'Portal of exit',def:'How the pathogen leaves the reservoir: contaminated hands, surfaces or instruments, or body fluids such as a sneeze. Break it with barriers, the HVE and covering coughs.'},
  c_trans:{v:'chain',name:'Mode of transmission',def:'How it spreads: direct contact, indirect contact (cross-contamination), splash and spatter, airborne aerosol, and parenteral (through the skin). Break it with PPE, hand hygiene and sharps safety.'},
  c_entry:{v:'chain',name:'Portal of entry',def:'How it gets in: inhalation (mouth and nose), ingestion, mucous membranes (eyes, nose, mouth) and breaks in the skin. Break it with masks, eyewear, gloves and safe sharps handling.'},
  c_host:{v:'chain',name:'Susceptible host',def:'A body that can’t resist the pathogen. Fatigue, stress, poor nutrition, illness and surgery lower resistance. Break it with immunization (hepatitis B vaccine) and staying healthy.'},
  p_gown:{v:'ppe',name:'Protective clothing (gown)',def:'Fluid-resistant, long sleeves, high neck, cuffs tucked under the gloves, covering to the knees when seated for high-risk work. Never worn home, in the lounge or out of the office.'},
  p_mask:{v:'ppe',name:'Mask',def:'At least 95% filtration for 3–5 µm particles. Change it for every patient, about every hour in long procedures, and whenever it gets wet. Never wear it under the nose or on the chin.'},
  p_eye:{v:'ppe',name:'Protective eyewear',def:'Front and solid side shields. Prescription glasses need added side shields. A face shield can replace eyewear but never the mask, because it doesn’t stop aerosol.'},
  p_gloves:{v:'ppe',name:'Gloves',def:'Exam gloves for patient care, put on last over washed, dry hands. A torn glove means: excuse yourself, remove the gloves, wash your hands and reglove.'},
  p_hair:{v:'ppe',name:'Hair pulled back',def:'Long hair is tied back and off the shoulders so it can’t fall into the field or brush contaminated surfaces.'},
  p_shoes:{v:'ppe',name:'Proper shoes',def:'Closed-toe clinic shoes; clinic shoes and hosiery count as part of PPE.'},
  p_phone:{v:'ppe',name:'Phone and electronics',def:'Kept in the staff room. A phone touched with contaminated hands carries the contamination with you.'},
  p_jewel:{v:'ppe',name:'Jewelry and watch',def:'Remove rings and watches before washing. If anything loose remains, it is covered by PPE. Rings, long nails and artificial nails harbor microbes and tear gloves.'},
  s_crit:{v:'spaulding',name:'Critical',def:'Touches bone or penetrates soft tissue. Highest risk. Must be heat sterilized. Examples: forceps, scalpels, bone chisels, scalers, burs.'},
  s_semi:{v:'spaulding',name:'Semicritical',def:'Touches mucous membranes but not bone, and doesn’t penetrate tissue. Heat sterilize; if heat would damage it, high-level disinfection at minimum. Examples: mouth mirrors, amalgam condensers, HVE tips, x-ray film holders.'},
  s_non:{v:'spaulding',name:'Noncritical',def:'Touches only intact skin. Lowest risk. Clean and use an intermediate- or low-level disinfectant. Examples: x-ray tube head and PID, lead apron, curing light.'},
  g_product:{v:'ghs',name:'Product identifier',def:'The name of the chemical or product, matching its safety data sheet.'},
  g_picto:{v:'ghs',name:'Pictograms',def:'Red-bordered diamonds with a black symbol that show the type of hazard at a glance, such as flame (flammable), exclamation mark (irritant) or health hazard.'},
  g_signal:{v:'ghs',name:'Signal word',def:'“Danger” for more severe hazards, “Warning” for less severe ones.'},
  g_hazard:{v:'ghs',name:'Hazard statements',def:'Sentences describing the nature of the hazard, such as “Highly flammable liquid and vapor.”'},
  g_precaution:{v:'ghs',name:'Precautionary statements',def:'How to prevent or respond to exposure: storage, PPE, first aid and disposal.'},
  g_supplier:{v:'ghs',name:'Supplier identification',def:'The manufacturer or supplier’s name, address and phone number.'},
  sc_1:{v:'scoop',name:'1 · Lay the cap down',def:'Place the needle cap on the tray (or in a cap holder). Your free hand stays away from the needle.'},
  sc_2:{v:'scoop',name:'2 · Scoop with one hand',def:'Holding the syringe in one hand, slide the needle into the cap lying on the tray. Never bring the cap to the needle with your other hand.'},
  sc_3:{v:'scoop',name:'3 · Tip up and seat the cap',def:'Lift the syringe tip-up so the cap slides down, then press the cap against the tray to seat it. Dispose of the needle in the sharps container without bending, cutting or breaking it.'}
});
function svgChain(){
  const cx=340,cy=250,R=168;
  const links=CHAIN.map(([k,n,c],i)=>{const a=-Math.PI/2+i*Math.PI/3,x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R,rot=(a*180/Math.PI+90);const w=n.split(' ');const l1=w.length>2?w.slice(0,2).join(' '):w[0],l2=w.length>2?w.slice(2).join(' '):w.slice(1).join(' ');
    return `<g class="hs" data-k="${k}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><rect x="-82" y="-34" width="164" height="68" rx="34" fill="${c}" stroke="#16212B" stroke-opacity=".25" stroke-width="10"/><text text-anchor="middle" y="${l2?-4:6}" font-size="17" font-weight="700" fill="#fff">${l1}</text>${l2?`<text text-anchor="middle" y="16" font-size="17" font-weight="700" fill="#fff">${l2}</text>`:''}<text text-anchor="middle" y="-44" font-size="13" font-weight="700" fill="#5B6B77">${i+1}</text></g>`;}).join('');
  const joins=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#8A96A0" stroke-width="8" stroke-dasharray="22 12"/>`;
  return `<svg viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chain of infection"><rect x="0" y="0" width="680" height="500" rx="12" fill="#F7F9FA"/>${joins}${links}
  <circle cx="${cx}" cy="${cy}" r="78" fill="#fff" stroke="#D6DEE3" stroke-width="2"/><text x="${cx}" y="${cy-14}" text-anchor="middle" font-size="15" font-weight="700" fill="#16212B">Break any</text><text x="${cx}" y="${cy+6}" text-anchor="middle" font-size="15" font-weight="700" fill="#16212B">one link and</text><text x="${cx}" y="${cy+26}" text-anchor="middle" font-size="15" font-weight="700" fill="#C8322F">infection stops</text></svg>`;
}

  ${hs('p_gloves',`<ellipse cx="111" cy="392" rx="16" ry="22" fill="#7B4BB8"/><ellipse cx="289" cy="392" rx="16" ry="22" fill="#7B4BB8"/>`)}
  <rect x="188" y="138" width="24" height="22" fill="#E3BC9C"/>

  ${hs('p_eye',`<rect x="160" y="88" width="80" height="20" rx="8" fill="#BFE0F2" fill-opacity=".8" stroke="#24313B" stroke-width="3"/><rect x="154" y="90" width="8" height="16" rx="3" fill="#24313B"/><rect x="238" y="90" width="8" height="16" rx="3" fill="#24313B"/>`)}
  ${hs('p_mask',`<path d="M164,112 L236,112 L234,136 Q200,154 166,136 Z" fill="#8CC6E8" stroke="#5E9FC4" stroke-width="2"/><line x1="166" y1="118" x2="150" y2="104" stroke="#5E9FC4" stroke-width="2"/><line x1="234" y1="118" x2="250" y2="104" stroke="#5E9FC4" stroke-width="2"/>`)}
  ${hs('p_jewel',`<g transform="translate(300,330)"><circle r="17" fill="#fff" stroke="#8A96A0" stroke-width="2"/><circle r="9" fill="none" stroke="#5B6B77" stroke-width="2"/><line x1="-12" y1="-12" x2="12" y2="12" stroke="#C8322F" stroke-width="4"/></g>`)}
  ${hs('p_phone',`<g transform="translate(60,250)"><rect x="-14" y="-24" width="28" height="48" rx="5" fill="#2B3238"/><rect x="-10" y="-18" width="20" height="32" fill="#86A8F4"/><line x1="-20" y1="-28" x2="20" y2="28" stroke="#C8322F" stroke-width="4"/><text x="0" y="46" text-anchor="middle" font-size="11" fill="#5B6B77">staff room</text></g>`)}
  <g class="lay lay-don">${badge(200,250,1,'#1F4FB5')}${badge(256,128,2,'#1F4FB5')}${badge(256,92,3,'#1F4FB5')}${badge(111,430,5,'#1F4FB5')}${badge(289,430,5,'#1F4FB5')}</g>

}

function svgScoop(){
  const tray='<rect x="10" y="150" width="180" height="14" rx="4" fill="#B7C0C8"/>';
  const syr=(x,y,rot)=>`<g transform="translate(${x},${y}) rotate(${rot})"><rect x="-70" y="-9" width="70" height="18" rx="4" fill="#D8DEE3" stroke="#5B6B77" stroke-width="2"/><rect x="-92" y="-5" width="24" height="10" rx="2" fill="#8A96A0"/><rect x="0" y="-4" width="10" height="8" fill="#C9A227"/><line x1="10" y1="0" x2="52" y2="0" stroke="#5B6B77" stroke-width="2"/></g>`;
  const cap=(x,y,rot)=>`<g transform="translate(${x},${y}) rotate(${rot})"><rect x="0" y="-5" width="44" height="10" rx="4" fill="#2F6BE0"/></g>`;
  const panel=(k,x,n,title,body)=>`<g class="hs" data-k="${k}" transform="translate(${x},40)"><rect width="200" height="280" rx="12" fill="#fff" stroke="#D6DEE3" stroke-width="2"/><circle cx="26" cy="26" r="15" fill="#1F4FB5"/><text x="26" y="32" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">${n}</text><text x="50" y="32" font-size="15" font-weight="700" fill="#16212B">${title}</text>${body}</g>`;
  return `<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One-handed scoop technique for recapping a needle"><rect width="680" height="360" rx="12" fill="#F7F9FA"/>
  ${panel('sc_1',20,1,'Cap on the tray',`${tray}${cap(120,143,0)}${syr(84,90,0)}<text x="100" y="210" text-anchor="middle" font-size="13" fill="#5B6B77">Free hand stays</text><text x="100" y="228" text-anchor="middle" font-size="13" fill="#5B6B77">away from the needle</text>`)}
  ${panel('sc_2',240,2,'Scoop one-handed',`${tray}${cap(118,143,0)}${syr(104,143,0)}<path d="M50,110 Q90,96 120,128" fill="none" stroke="#1F8A4C" stroke-width="3" marker-end="url(#ar)"/><text x="100" y="210" text-anchor="middle" font-size="13" fill="#5B6B77">Slide the needle</text><text x="100" y="228" text-anchor="middle" font-size="13" fill="#5B6B77">into the cap</text>`)}
  ${panel('sc_3',460,3,'Tip up, seat it',`${tray}<g transform="translate(100,112) rotate(-90) scale(0.62)">${syr(0,0,0)}${cap(14,0,0)}</g><text x="100" y="210" text-anchor="middle" font-size="13" fill="#5B6B77">Press the cap against</text><text x="100" y="228" text-anchor="middle" font-size="13" fill="#5B6B77">the tray to seat it</text>`)}
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1F8A4C"/></marker></defs></svg>`;
}
