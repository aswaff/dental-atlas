const SV=(view,hl,layers)=>({scene:'svg',view,layers:layers||[],hl:hl||[]});
const ST=(o)=>Object.assign({scene:'op',view:'steri',hl:[],pins:[],cam:'steri',chair:'supine',zones:false,patient:true,parts:false,room:'clean'},o);
const RM=(o)=>Object.assign({scene:'op',view:'room',hl:[],pins:[],cam:'room',chair:'supine',zones:false,patient:true,parts:false,room:'clean'},o);
const LESSON_W3=[
  /* ---- Disease transmission (Ch 5) ---- */
  {id:'w3-micro',sec:'Disease transmission',title:'What you’re protecting against',scene:SV('chain',['c_agent']),controls:[],
   body:`<p>${T('Bacteria')} come in three shapes: spherical (${T('cocci')}, such as strep and staph), rod-shaped (${T('bacilli')}, such as tuberculosis) and spiral (${T('spirochetes')}, such as syphilis and Lyme disease). Most are treated with antibiotics.</p>
   <p>Under bad conditions some bacteria turn into ${T('spores')}, the most resistant form of life known. They survive heat, drying, disinfectants and radiation. That is why harmless spores are used to test whether your sterilizer works.</p>
   <p>${T('Viruses')} are much smaller and can only multiply inside a host cell. Antibiotics don’t work on them, they mutate, and some go ${T('latent')} (dormant) and reactivate later. Hepatitis C can stay latent for 15 to 25 years.</p>
   <p>${T('Fungi')} include yeasts and molds. Oral ${T('candidiasis')} (Candida albicans) looks like white, cottage-cheese patches that wipe off to a red, raw base. It is an opportunistic infection seen in the very young, the very old, the very ill and under dentures.</p>`,
   remember:['Spores are the hardest thing to kill, so they are the test for sterilization.','Antibiotics treat bacteria, not viruses.','Candidiasis: white patches that wipe off and leave a red base.'],
   check:{q:'Why are bacterial spores used to test sterilizers?',a:'They are the most resistant form of life known',d:['They are the most common germ in the mouth','They only live in dental offices','They change color when heated'],why:'If the sterilizer kills spores, it has killed everything less resistant too.'}},
  {id:'w3-chain',sec:'Disease transmission',title:'The chain of infection',scene:SV('chain',[]),controls:[],
   body:`<p>Six links must all be present for infection to happen: (1) an ${T('infectious agent')}, (2) a ${T('reservoir')}, (3) a ${T('portal of exit')}, (4) a ${T('mode of transmission')}, (5) a ${T('portal of entry')} and (6) a ${T('susceptible host')}.</p>
   <p>Every infection control step you take breaks at least one link. Click each link to see how.</p>
   <p>${T('Virulence')} is how strong an organism is at causing disease. ${T('Bioburden')} is organic material such as blood and saliva.</p>`,
   remember:['Six links: agent, reservoir, exit, transmission, entry, host.','Break one link and the chain fails.','Bioburden = blood and saliva left on a surface or instrument.'],
   check:{q:'Getting the hepatitis B vaccine breaks which link?',a:'Susceptible host',d:['Reservoir','Portal of exit','Infectious agent'],why:'Immunity means your body can resist the virus, so you are no longer a susceptible host.'}},
  {id:'w3-modes',sec:'Disease transmission',title:'How disease spreads in the dental office',scene:RM({room:'dirty',cam:'units',pins:['hve','aws','docunit']}),controls:['opview','roomstate','patient'],
   body:`<p><b>${T('Direct')}:</b> touching an infectious lesion or infected blood or saliva.<br><b>${T('Indirect')} (cross-contamination):</b> touching a contaminated instrument or surface, then your face, eyes or mouth.<br><b>${T('Splash and spatter')}:</b> large droplets of blood and saliva from the handpiece, ultrasonic scaler and air-water syringe. Spatter lands on the wrists, forearms, upper arms and chest.<br><b>${T('Airborne')}:</b> aerosol and droplets. Breathing handpiece aerosol without a mask is like being sneezed on twice a minute from a foot away.<br><b>${T('Parenteral')}:</b> through the skin, such as needlesticks, cuts and bites.<br><b>Dental unit water lines:</b> biofilm releases bacteria into the spray.</p>
   <p>Infections can be ${T('acute')} (short and severe), ${T('chronic')} (long-lasting, often with no symptoms, as with HBV, HCV and HIV carriers), ${T('latent')} (comes and goes, like cold sores) or ${T('opportunistic')} (normally harmless organisms in someone with low resistance).</p>
   <p>The red surfaces in the room are the ones gloved hands touch during treatment. Everything touched during patient care is considered contaminated, down to the pen.</p>`,
   remember:['Blood is often present in saliva even when you can’t see it.','Face shields stop spatter but not aerosol; always wear the mask.','Transient bacteremia (bacteria briefly in the blood) is dangerous for some heart and joint-replacement patients, which is why they may need premedication.'],
   check:{q:'Touching a contaminated light handle and then your face is which kind of transmission?',a:'Indirect (cross-contamination)',d:['Direct','Parenteral','Airborne'],why:'Indirect transmission goes through an object or surface. Direct is contact with the lesion or body fluid itself.'}},
  {id:'w3-hep',sec:'Disease transmission',title:'Bloodborne viruses: hepatitis and HIV',scene:SV('chain',['c_entry','c_host']),controls:[],
   body:`<div class="table-wrap"><table><thead><tr><th></th><th>Spread by</th><th>Chronic?</th><th>Prevention</th></tr></thead><tbody>
   <tr><td class="k">Hepatitis A</td><td>Fecal-oral</td><td>No</td><td>Vaccine, handwashing</td></tr>
   <tr><td class="k">Hepatitis B</td><td>Blood and body fluids, including saliva</td><td>Yes</td><td>Vaccine</td></tr>
   <tr><td class="k">Hepatitis C</td><td>Blood, mostly needlesticks</td><td>Yes</td><td>No vaccine</td></tr>
   <tr><td class="k">Hepatitis D</td><td>Blood; needs HBV to exist</td><td>Yes</td><td>HBV vaccine</td></tr>
   <tr><td class="k">Hepatitis E</td><td>Fecal-oral, water</td><td>No</td><td>Safe water</td></tr></tbody></table></div>
   <p>${T('HBV')} is the biggest bloodborne risk for dental teams, and healthy-looking patients can be carriers. Your employer must offer the ${T('hepatitis B vaccine')} free within 10 days of assignment to a job with exposure. You can decline by signing a refusal, and change your mind later. Antibody testing is recommended 1 to 6 months after the third dose.</p>
   <p>${T('HIV')} attacks the immune system. Transmission in dentistry is rare, but patients with HIV may have other diseases, such as TB and HBV, that spread more easily. Herpes simplex (HSV-1) causes cold sores and is latent.</p>`,
   remember:['HBV: vaccine offered free within 10 days. Test for antibodies 1–6 months after dose 3.','HCV: no vaccine; the main risk is a needlestick.','Protect your eyes: herpes in the eye can damage vision.'],
   check:{q:'Which hepatitis virus has no vaccine?',a:'Hepatitis C',d:['Hepatitis A','Hepatitis B','Hepatitis D'],why:'There is a vaccine for A and B, and the HBV vaccine also prevents D. There is no vaccine for hepatitis C.'}},
  /* ---- OSHA and CDC (Ch 6) ---- */
  {id:'w3-osha',sec:'OSHA, PPE and hazards',title:'CDC, OSHA and the Bloodborne Pathogens Standard',scene:ST({hl:['ecp','sds'],pins:['ecp','sds'],cam:'steriShelf'}),controls:['opview'],
   body:`<p>The ${T('CDC')} makes recommendations based on science; it is not a regulatory agency, but its infection control guidelines are the ${T('standard of care')}. ${T('OSHA')} makes regulations (standards) that protect employees, and breaking them can bring heavy fines.</p>
   <p>OSHA’s ${T('Bloodborne Pathogens (BBP) Standard')} is the most important infection control law in dentistry. Every office needs a copy of it and a written ${T('exposure control plan')} that is reviewed at least once a year and available to every employee.</p>
   <p>${T('Universal Precautions')} treat all blood and certain body fluids as infectious. The CDC broadened this to ${T('Standard Precautions')}: blood, all body fluids, secretions and excretions except sweat, nonintact skin and mucous membranes. In dentistry saliva has always been treated as infectious, so the two work the same in practice.</p>`,
   remember:['CDC recommends; OSHA enforces.','Treat every patient as potentially infectious.','Exposure control plan: written, reviewed yearly, available to everyone.'],
   check:{q:'Which agency issues regulations that can result in fines?',a:'OSHA',d:['CDC','ADA','ADAA'],why:'OSHA is the regulatory agency. The CDC issues recommendations that become the standard of care.'}},
  {id:'w3-cat',sec:'OSHA, PPE and hazards',title:'Exposure categories, training and records',scene:{scene:'svg',view:'office',layers:['clinical','business'],hl:['o_op1','o_steri','o_bizoff']},controls:[],
   body:`<p>An ${T('occupational exposure')} is any reasonably expected skin, eye or mucous membrane contact, or ${T('percutaneous')} injury, with blood or other potentially infectious materials. ${T('Permucosal')} means through the mucous membranes.</p>
   <p><b>Category I</b> is routinely exposed (dentist, hygienist, assistant, sterilization assistant, lab tech). <b>Category II</b> may occasionally be exposed (a receptionist who sometimes cleans a room). <b>Category III</b> is never exposed (financial manager, insurance clerk).</p>
   <p>Training happens when you’re first assigned and every year after, during work hours, and the employer keeps a record of each session. Employee medical records (including HBV vaccination or refusal and any exposure incidents) are kept confidential, locked, for the length of employment plus 30 years.</p>`,
   remember:['As an assistant you are Category I.','BBP training: at hire and yearly.','Medical records: employment + 30 years.'],
   check:{q:'How long must employee medical records be kept?',a:'Duration of employment plus 30 years',d:['5 years','Until the employee leaves','1 year after an exposure'],why:'The BBP Standard requires confidential medical records for the duration of employment plus 30 years.'}},
  {id:'w3-sharps',sec:'OSHA, PPE and hazards',title:'Sharps, needlesticks and exposure first aid',scene:SV('scoop',['sc_2']),controls:[],
   body:`<p>Needles, scalpel blades, orthodontic wires, endo files and broken glass go into a ${T('sharps container')} that is puncture resistant, closable, leakproof and red or labeled with the biohazard symbol, placed as close to use as possible. Don’t bend, cut or break needles, and never remove a needle from a disposable device.</p>
   <p>Recap with the ${T('one-handed scoop technique')} or a recapping device. Click each panel to walk through it.</p>
   <p><b>After an exposure:</b> stop, remove your gloves, wash with antimicrobial soap and warm water, dry, apply a small amount of antiseptic and a bandage. Never put bleach or disinfectant on the wound. Report it to your employer right away and complete the paperwork. Follow-up is free: confidential counseling, HIV testing (immediately, then at 6 weeks, 12 weeks and 6 months), HBV immunoglobulin if unvaccinated, and a tetanus booster.</p>`,
   remember:['Never recap with two hands.','Exposure: wash, antiseptic, bandage, report immediately.','No bleach or disinfectant on a wound.'],
   check:{q:'What do you do first after a needlestick?',a:'Stop, remove gloves and wash the area with soap and water',d:['Squeeze it and pour disinfectant on it','Finish the procedure, then report it','Apply bleach and a bandage'],why:'Stop work, wash with antimicrobial soap and water, apply antiseptic and a bandage, then report it right away.'}},
  {id:'w3-hands',sec:'OSHA, PPE and hazards',title:'Hand hygiene',scene:RM({hl:['sink','sinkpedal'],pins:['sink','sinkpedal'],cam:'sink'}),controls:['opview'],
   body:`<p>Wash your hands before you put on gloves and right after you take them off. Bacteria multiply in the warm, moist space under the glove.</p>
   <p><b>Handwashing:</b> remove jewelry and watch; use the foot or electronic control (or a paper towel on the faucet); liquid soap, fingertips down, lather with friction between the fingers; use a nailbrush on the first wash of the day; rub at least 10 seconds; rinse with cool water; dry hands, then forearms, with paper towels.</p>
   <p><b>${T('Alcohol-based hand rubs')}</b> (60% to 95% alcohol) kill more microbes than soap and are easier on skin, but only when hands are not visibly soiled with blood or saliva. Use the full dose on the label and rub until dry, covering between the fingers and the backs of the hands.</p>`,
   remember:['Wash before gloving and right after removing gloves.','Visibly soiled hands: soap and water, not hand rub.','No bar soap, no topping off soap bottles, no rings, polish or artificial nails.','Petroleum or oil-based lotions weaken latex; save them for the end of the day.'],
   check:{q:'When should you NOT use an alcohol-based hand rub?',a:'When your hands are visibly soiled with blood or saliva',d:['Before putting on gloves','After removing gloves','Between patients'],why:'Hand rubs don’t work in the presence of organic matter. Wash with soap and water first.'}},
  {id:'w3-ppe',sec:'OSHA, PPE and hazards',title:'Personal protective equipment',scene:SV('ppe',[]),controls:[],
   body:`<p>OSHA requires your employer to provide ${T('PPE')} at no cost: protective clothing, masks, eyewear or face shields, patient-care gloves and utility gloves. Wear it whenever you could contact body fluids, including processing radiographs, lab cases and contaminated equipment.</p>
   <p>Click each piece on the figure. Your competency checks every one, plus shoes, phone, hair and jewelry.</p>`,
   remember:['Protective clothing never leaves the office, and never goes in the lounge.','Change it daily, and immediately if it is soaked.','The employer launders it; you never take it home.','Patients get protective eyewear too.'],
   check:{q:'Why can’t a face shield replace a mask?',a:'It doesn’t protect against inhaling aerosol',d:['It is too heavy','It fogs up','OSHA bans face shields'],why:'A face shield protects against splatter but aerosol goes around it. Wear a mask under it.'}},
  {id:'w3-donoff',sec:'OSHA, PPE and hazards',title:'Putting on and taking off PPE',scene:SV('ppe',[],['don']),controls:[],donoff:true,
   body:`<p><b>Putting on:</b> protective clothing, mask, eyewear, wash and dry hands, then gloves. Gloves always go on last so they’re clean when they go into the mouth.</p>
   <p><b>Taking off:</b> gloves first, turned inside out (gloved hand pulls the other glove off by the outside cuff; bare fingers slide inside the cuff of the second). Wash and dry your hands. Remove eyewear by the ear rests, the mask by its straps, and the gown by turning it inside out without touching your clothes or skin.</p>
   <p>Switch between the two sequences with the buttons below.</p>`,
   remember:['On: gown, mask, eyewear, hands, gloves.','Off: gloves, hands, eyewear, mask, gown.','Touch the mask only by its edges or straps; the front is the most contaminated part.'],
   check:{q:'Which PPE goes on last?',a:'Gloves',d:['Mask','Eyewear','Gown'],why:'Gloves go on last, over freshly washed and dried hands, so nothing contaminates them before they enter the mouth.'}},
  {id:'w3-gloves',sec:'OSHA, PPE and hazards',title:'Gloves',scene:SV('ppe',['p_gloves']),controls:[],
   body:`<p><b>${T('Exam gloves')}:</b> nonsterile latex, vinyl or nitrile, fit either hand; for most patient care.<br><b>${T('Overgloves')}:</b> thin plastic food-handler gloves worn over exam gloves to touch something clean during treatment, like a drawer or the chart.<br><b>${T('Sterile surgical gloves')}:</b> sized for left and right hands; for surgery and invasive periodontal work.<br><b>${T('Utility gloves')}:</b> heavy, puncture-resistant; for cleaning rooms, handling contaminated instruments and disinfecting. Never for patient care. Each person has their own pair.<br><b>Non-latex gloves:</b> vinyl or nitrile for anyone with latex allergy.</p>
   <p>If a glove tears during treatment: excuse yourself, remove the gloves, wash your hands and reglove before returning.</p>`,
   remember:['Never wash and reuse exam gloves.','Disinfectants degrade exam gloves; clean the room in utility gloves.','Leaving chairside: overgloves, or remove gloves and wash, then fresh gloves when you return.'],
   check:{q:'Which gloves do you wear to clean and disinfect the treatment room?',a:'Utility gloves',d:['Exam gloves','Overgloves','Sterile surgical gloves'],why:'Utility gloves are puncture- and chemical-resistant. The chemicals break down exam gloves.'}},
  {id:'w3-waste',sec:'OSHA, PPE and hazards',title:'Dental waste',scene:RM({hl:['biotrash','trash','sharps'],pins:['biotrash','trash','sharps'],cam:'waste'}),controls:['opview'],
   body:`<p><b>${T('General waste')}:</b> paper towels, mixing pads, empty food containers.<br><b>${T('Hazardous waste')}:</b> dangerous to people or the environment, such as toxic chemicals.<br><b>${T('Contaminated waste')}:</b> has touched blood or body fluids, such as used barriers and patient napkins. In most states it goes out with general waste.<br><b>${T('Infectious (regulated) waste')}:</b> can transmit disease. Three kinds: blood or saliva that could be squeezed out (or dried blood that could flake off), pathologic waste (soft tissue and extracted teeth), and sharps. Containers must carry the biohazard label.</p>`,
   remember:['Red bag = items that would drip or flake blood or saliva if squeezed.','Extracted teeth with amalgam never go in waste that will be incinerated.','Always follow your state and local rules.'],
   check:{q:'An extracted tooth is which type of waste?',a:'Infectious (regulated) pathologic waste',d:['General waste','Hazardous chemical waste','Contaminated waste'],why:'Soft tissue and extracted teeth are pathologic waste, one of the three kinds of infectious waste.'}},
  {id:'w3-hcs',sec:'OSHA, PPE and hazards',title:'Hazard Communication: the right to know',scene:SV('ghs',[]),controls:[],
   body:`<p>OSHA’s ${T('Hazard Communication Standard')} (the “Employee Right-to-Know Law”) requires employers to tell employees about the chemicals they use. Since 2012 it follows the ${T('Globally Harmonized System (GHS)')}.</p>
   <p>The program has five parts: a ${T('written program')}, a ${T('chemical inventory')}, ${T('safety data sheets (SDSs)')} in a 16-section format, ${T('labeling')} and ${T('employee training')}. Click each part of the label.</p>
   <p>When you pour a chemical into another container, like mixing disinfectant into a spray bottle or filling the ultrasonic, that ${T('secondary container')} must be labeled too. Training happens at hire, whenever a new chemical arrives, and yearly; records are kept at least 5 years.</p>`,
   remember:['Five parts: written program, inventory, SDS, labels, training.','Label every secondary container.','The assistant is often the coordinator: keep the inventory and SDS binder up to date.','No eating, drinking, lip balm or contact lenses where chemicals are used.'],
   check:{q:'Which label element says “Danger” or “Warning”?',a:'The signal word',d:['The pictogram','The hazard statement','The product identifier'],why:'The signal word shows severity: Danger for more severe hazards, Warning for less severe.'}},
  /* ---- Treatment room (Ch 7) ---- */
  {id:'w3-barriers',sec:'The treatment room',title:'Surface barriers',scene:RM({room:'barriers',hl:['barrier'],pins:['barrier'],cam:'units'}),controls:['opview','roomstate','patient'],
   body:`<p>There are two ways to deal with surface contamination: keep it from happening with ${T('surface barriers')}, or ${T('preclean and disinfect')} between patients. Most offices use both. If a surface can’t be easily and thoroughly cleaned, it gets a barrier.</p>
   <p>Common barrier surfaces: the headrest, chair control buttons, light handles and switches, evacuator hoses and controls, x-ray controls, air-water syringe handles, unit touch pads, the curing light handle, drawer handles, stool adjustment handles and the bracket table. The blue covers in the room show them.</p>
   <p><b>Single use only:</b> prophy cups and brushes, sterilization pouches, irrigating syringes, patient napkins, barriers, masks, gloves, needles and sharps containers.</p>`,
   remember:['Barriers go on with clean hands, over a clean surface.','Remove them with utility gloves without touching the surface underneath.','Most states let barriers go in regular trash unless they are soaked or caked with blood or saliva.'],
   check:{q:'When removing a barrier you accidentally touch the surface underneath. What now?',a:'Preclean and disinfect that surface',d:['Nothing, the barrier protected it','Put a second barrier over it','Wipe it with a dry towel'],why:'Once the surface is touched with a contaminated glove or barrier, it has to be precleaned and disinfected.'}},
  {id:'w3-breakdown',sec:'The treatment room',title:'Breaking down and disinfecting the room',scene:RM({room:'dirty',hl:['disinfect'],pins:['disinfect'],cam:'back'}),controls:['opview','roomstate','patient'],
   body:`<p><b>1.</b> Put on utility gloves, eyewear, mask and protective clothing. Make sure the cleaner and disinfectant are fresh and correctly mixed.<br>
   <b>2.</b> Discard sharps in the sharps container and disposables in the trash; put instruments in the covered transport container.<br>
   <b>3.</b> Remove barriers without touching the surfaces underneath.<br>
   <b>4. ${T('Preclean')}:</b> spray the paper towel (not the surface) and wipe vigorously. Use a brush for anything that doesn’t come clean.<br>
   <b>5. ${T('Disinfect')}:</b> spray a fresh towel and wet the surface again. Leave it wet for the label’s tuberculocidal contact time (often 10 minutes).<br>
   <b>6.</b> Wipe dry and rinse with water any surface that touches the patient’s skin or mouth.<br>
   <b>7.</b> Wash, disinfect and remove your utility gloves, wash your hands, and place fresh barriers for the next patient.</p>`,
   remember:['If it isn’t clean, it can’t be disinfected: preclean first.','Spray the towel to reduce overspray.','Clean and dirty never mix: dirty tray out before clean tray in.'],
   check:{q:'Why do you preclean before disinfecting?',a:'Bioburden blocks the disinfectant, so a dirty surface can’t be disinfected',d:['It saves disinfectant','The law requires two different chemicals','Precleaning sterilizes the surface'],why:'Blood and saliva shield microbes from the disinfectant. Remove them first, then disinfect.'}},
  {id:'w3-disinf',sec:'The treatment room',title:'Disinfectants',scene:ST({hl:['coldsteri'],pins:['coldsteri'],cam:'steriPack'}),controls:['opview'],
   body:`<p>A ${T('disinfectant')} is used on surfaces; an ${T('antiseptic')} is used on living tissue. Never swap them. Disinfection kills disease-causing organisms but not spores; ${T('sterilization')} kills all life.</p>
   <p>The ${T('EPA')} registers disinfectants. For treatment rooms, use only an EPA-registered ${T('hospital disinfectant with a tuberculocidal claim')} (it kills Mycobacterium tuberculosis, which is hard to kill).</p>
   <p><b>Intermediate-level surface disinfectants:</b> ${T('iodophors')} (mix with soft or distilled water; may stain), ${T('synthetic phenols')} (broad spectrum; can leave a film) and EPA-registered chlorine products. Household bleach alone isn’t EPA registered for this. ${T('Alcohol')} is not recommended for surfaces: it evaporates too fast and doesn’t work through bioburden.</p>
   <p><b>High-level disinfectants and sterilants</b> are for soaking heat-sensitive items only, never surfaces: ${T('glutaraldehyde')}, chlorine dioxide and ${T('OPA')} (ortho-phthalaldehyde). They are toxic, so keep the lid closed.</p>`,
   remember:['Surfaces: EPA-registered hospital disinfectant with a TB claim.','Disinfectant = objects. Antiseptic = skin.','Follow the label’s dilution and contact time exactly.'],
   check:{q:'What should a treatment room surface disinfectant’s label say?',a:'EPA-registered hospital disinfectant with a tuberculocidal claim',d:['FDA-approved antiseptic','70% alcohol','High-level sterilant'],why:'Only EPA-registered hospital disinfectants that kill tuberculosis should be used on dental treatment surfaces.'}},
  {id:'w3-spaulding',sec:'The treatment room',title:'Critical, semicritical and noncritical',scene:SV('spaulding',[]),controls:[],
   body:`<p>How an item is processed depends on what it touches. Click each category.</p>
   <p>The basic rule: <b>if an item can be heat sterilized, heat sterilize it.</b> Items made for single use are thrown away, not disinfected.</p>`,
   remember:['Critical: penetrates tissue or bone → sterilize.','Semicritical: mucous membranes → sterilize (or high-level disinfect if heat would ruin it).','Noncritical: intact skin → intermediate- or low-level disinfectant.'],
   check:{q:'A mouth mirror is which category?',a:'Semicritical',d:['Critical','Noncritical','Single-use'],why:'Mirrors touch mucous membranes but don’t penetrate tissue. They are heat tolerant, so they are sterilized.'}},
  {id:'w3-aseptic',sec:'The treatment room',title:'Reducing contamination and water lines',scene:RM({hl:['hve','aws','docunit'],pins:['hve','aws','docunit'],cam:'units'}),controls:['opview','roomstate','patient'],
   body:`<p>Ways to cut down the spread of microorganisms: avoid unnecessary touching (have everything ready before you start), use the ${T('HVE')}, use the ${T('rubber dam')} (with the HVE, the best way to reduce aerosol and spatter), use a ${T('preprocedural mouth rinse')}, use disposables, and reduce water line contamination.</p>
   <p>Water standing in narrow dental unit water lines forms ${T('biofilm')} on the tubing walls, which sheds bacteria into the spray. To reduce it: flush lines several minutes at the start of the day (longer after weekends) and 20 to 30 seconds between patients; use a self-contained water reservoir with the recommended treatment; use sterile water for surgery; purge and air-dry the lines at the end of the day; use filters; and monitor water quality as the manufacturer directs.</p>`,
   remember:['Flushing alone doesn’t remove biofilm, but it does help.','Clean the HVE system at the end of the day and replace the trap in PPE.','Don’t touch your eyes, nose, skin or hair with gloved hands.'],
   check:{q:'How long should you flush water lines between patients?',a:'20 to 30 seconds',d:['2 seconds','10 minutes','Only at the start of the day'],why:'Flushing 20 to 30 seconds between patients clears material pulled back from the previous patient.'}},
  {id:'w3-lab',sec:'The treatment room',title:'Impressions, lab and x-ray area',scene:ST({hl:['impression'],pins:['impression'],cam:'steriDirty'}),controls:['opview'],
   body:`<p><b>Impressions:</b> rinse under running water (a soft brush helps), then disinfect with an intermediate-level hospital disinfectant for the label’s contact time. Spray and wrap in a wet paper towel, or immerse. Rinse again and gently shake off the water. Check the impression material’s instructions so it isn’t distorted. Wear gloves, eyewear and outerwear.</p>
   <p><b>Casts</b> are hard to disinfect without damage, which is why the impression is disinfected first. Articulators and case pans get an intermediate-level disinfectant; brushes and rag wheels are sterilized or disinfected between patients; dispense pumice one patient at a time.</p>
   <p><b>X-ray area:</b> barrier or disinfect the headrest, counter, extension arm, tube head, PID, control panel and exposure button.</p>`,
   remember:['Rinse, disinfect, rinse.','No eating, drinking, cosmetics or contact lenses in the lab.','Your competency asks you to spray impressions with disinfectant.'],
   check:{q:'What is the first step for disinfecting an alginate impression?',a:'Rinse it under running water',d:['Spray it with disinfectant','Pour the cast','Dry it with air'],why:'Rinsing removes blood and saliva first, so the disinfectant can reach the surface.'}},
  /* ---- Instrument processing (Ch 8) ---- */
  {id:'w3-seven',sec:'Instrument processing',title:'The seven steps of instrument processing',scene:ST({cam:'steri',pins:['transport','ultrasonic','pouch','autoclave','storage']}),controls:['opview'],
   body:`<p>Processing instruments is one of the assistant’s most important jobs, and it’s more than sterilization:</p>
   <p><b>1. ${T('Transport')}</b> in a rigid, leakproof, covered container, wearing PPE.<br><b>2. ${T('Cleaning')}</b> hands-free (ultrasonic or washer), or a holding solution if you can’t clean right away.<br><b>3. ${T('Packaging')}</b> in the clean area, with an indicator inside.<br><b>4. ${T('Sterilization')}</b>, loaded and run by the manufacturer’s directions.<br><b>5. ${T('Storage')}</b> clean, dry and rotated so the oldest is used first.<br><b>6. ${T('Delivery')}</b> to chairside, inspected and opened aseptically.<br><b>7. ${T('Quality assurance')}</b>: training, records, maintenance and biologic monitoring.</p>`,
   remember:['Transport, clean, package, sterilize, store, deliver, quality assurance.','Before leaving the room: sharps in the sharps container, disposables in the trash.'],
   check:{q:'What should contaminated instruments be carried in?',a:'A rigid, leakproof, covered container',d:['An open tray','A sterilization pouch','Your gloved hands'],why:'A covered, rigid container protects you and others from sharps and spills on the way to processing.'}},
  {id:'w3-center',sec:'Instrument processing',title:'The sterilization center',scene:ST({cam:'steri',hl:['counter'],pins:['holding','eyewash','sterisink']}),controls:['opview'],
   body:`<p>The ideal processing area is used only for processing, separated from the operatories and lab, and not a walkway. Instruments move in a single loop: ${T('dirty → clean → sterile → storage')}, never doubling back. Small areas use signs like “Contaminated items only” and “Sterile items only.”</p>
   <p>The ${T('contaminated area')} has clean eyewear and utility gloves, counter space, a sink, waste container, ${T('holding solution')}, ultrasonic cleaner, ${T('eyewash station')} and wrapping supplies. Soiled and clean instruments are never stored in the same cabinet.</p>
   <p>The holding solution (enzymatic cleaner or dishwasher detergent, not plain disinfectant) keeps debris from drying on. Its container has a lid, a biohazard label and a chemical label, and it’s changed at least twice a day.</p>`,
   remember:['One direction only: dirty, clean, sterile, storage.','Holding solution: covered, double-labeled, changed twice daily.','Know where the eyewash is.'],
   check:{q:'Which way should instruments move through the sterilization area?',a:'Dirty → clean → sterile → storage, never back',d:['Any order, as long as they get sterilized','Sterile → dirty → clean','Clean → dirty → sterile'],why:'A one-way loop keeps contaminated instruments from ever touching clean or sterile ones.'}},
  {id:'w3-clean',sec:'Instrument processing',title:'Cleaning: ultrasonic, washer or hand scrubbing',scene:ST({hl:['ultrasonic','scrubbrush'],pins:['ultrasonic','scrubbrush'],cam:'steriDirty'}),controls:['opview'],
   body:`<p><b>${T('Hand scrubbing')}</b> is the least desirable method because your hands touch sharp, dirty instruments. If you must: goggles, puncture-resistant gloves and gown; one or two instruments at a time; a long-handled brush; keep items above the water line; pat dry, never roll them in a towel. Some states don’t allow it.</p>
   <p>The ${T('ultrasonic cleaner')} uses ${T('cavitation')}: sound waves create tiny bubbles that implode and knock debris loose. Run it 5 to 15 minutes, longer for plastic cassettes. Keep the lid on, use only ultrasonic solution, then rinse the basket at an angle with minimal splashing. Use tongs to lift instruments out.</p>
   <p>Change the solution at least daily or when cloudy; rinse, disinfect, rinse and dry the tank. To test it, run a piece of foil half-submerged for 20 seconds: it should be evenly pebbled.</p>
   <p>${T('Automated washers')} work like a dishwasher with hot water and detergent. Instruments still have to be packaged and sterilized after.</p>`,
   remember:['Ultrasonic: lid on, 5–15 minutes, rinse, change daily.','Clean is not sterile.','Your competency asks you to use, drain and fill the ultrasonic and to brush-clean burs and instruments.'],
   check:{q:'Which cleaning method is the least desirable?',a:'Hand scrubbing',d:['Ultrasonic cleaner','Automated washer','Holding solution then ultrasonic'],why:'Hand scrubbing puts your hands in direct contact with sharp, contaminated instruments.'}},
  {id:'w3-pack',sec:'Instrument processing',title:'Drying, lubrication and packaging',scene:ST({hl:['pouch','integrator','wrapcass','lube'],pins:['pouch','integrator','wrapcass','lube'],cam:'steriPack'}),controls:['opview'],
   body:`<p>Carbon steel instruments and burs rust in steam: dip them in a rust inhibitor (such as 1% sodium nitrate) or use dry heat or chemical vapor. Lubricate hinged instruments and handpieces, then remove excess lubricant.</p>
   <p>Packaging keeps instruments sterile after the sterilizer door opens, and lets you group setups such as hygiene, composite, crown and bridge, and burs. Use only FDA-cleared packaging made for your type of sterilizer. Put a ${T('process integrator')} inside every package; if the package doesn’t show an outside indicator, add indicator tape. Seal with the self-seal strip or sterilization tape. Never staples, pins or paper clips, and never reuse a wrap.</p>`,
   remember:['Integrator inside, indicator outside.','Label each package: date, contents, sterilizer.','Your competency asks you to bag and sterilize hygiene, composite and crown setups, burs and handpieces, and wrap a cassette.'],
   check:{q:'What goes inside every sterilization package?',a:'A process integrator',d:['A spore test','Indicator tape','A cotton roll'],why:'The integrator inside confirms the sterilizing agent reached the instruments. Indicator tape goes on the outside.'}},
  {id:'w3-autoclave',sec:'Instrument processing',title:'The autoclave',scene:ST({hl:['autoclave','distilled','statim'],pins:['autoclave','distilled','statim'],cam:'steriSterile'}),controls:['opview'],
   body:`<p>The ${T('autoclave')} sterilizes with steam under pressure. It runs four cycles: heat-up, sterilizing, depressurization and drying. Typical settings: 250°F (121°C) for 15 to 30 minutes, or 273°F (134°C) for 3 to 10 minutes.</p>
   <p><b>Use it right:</b> fill with ${T('distilled water')}. Instruments must be clean (dry for glass, rubber and stones). Packages on edge, space between them, large packs at the bottom, never overloaded. No closed metal trays, capped vials or foil, because steam can’t get in. Let the load cool and dry before removing it, then wash your hands and use clean exam gloves to unload in the clean area.</p>
   <p><b>Pros:</b> fast, good penetration, common. <b>Cons:</b> can dull or rust carbon steel and damage some plastics, and packs can come out wet.</p>
   <p>Rapid units like the ${T('STATIM')} use unwrapped cassettes. Anything sterilized unwrapped must be used right away, because it stops being sterile when it’s exposed to the room.</p>`,
   remember:['Distilled water only.','Packs on edge, spaced, not overloaded.','Cool and dry before removing; exam gloves for sterile packs.','Your competency asks you to fill the autoclave with distilled water, run it, run a STATIM, and unload and organize.'],
   check:{q:'Why must autoclaves use distilled water?',a:'Tap water minerals leave deposits and cause corrosion',d:['Distilled water is sterile','Tap water won’t boil','It is cheaper'],why:'Minerals in tap water build up on the chamber and corrode metal.'}},
  {id:'w3-other',sec:'Instrument processing',title:'Chemical vapor, dry heat and cold sterilization',scene:ST({hl:['coldsteri'],pins:['coldsteri'],cam:'steriPack'}),controls:['opview'],
   body:`<p><b>${T('Chemical vapor')}:</b> like an autoclave but uses a chemical solution (alcohol, formaldehyde and others) at 270°F (131°C), 20 psi for 20 to 40 minutes. It doesn’t rust or dull instruments and they come out dry. Instruments must be dry going in, the room needs good ventilation, and an SDS is required.</p>
   <p><b>${T('Dry heat')}:</b> 320°F to 375°F (160°C to 190°C). ${T('Static air')} (like an oven) takes 1 to 2 hours; ${T('forced air')} (rapid heat transfer) takes 6 minutes unwrapped or 12 minutes wrapped. No rust if instruments are dry, but it can damage plastics, and you never add instruments mid-cycle.</p>
   <p><b>${T('Chemical liquid')} (cold sterilization):</b> for heat-sensitive items such as some rubber dam frames, shade guides and x-ray holders. Glutaraldehyde needs 10 hours to sterilize; less is only disinfection. It can’t be biologically monitored. Label it with the date, keep it covered, rinse items thoroughly, and test the concentration.</p>`,
   remember:['Chemical vapor: 270°F, 20 psi, 20–40 min; dry instruments; ventilate.','Dry heat: hot and slow, or forced air and fast.','Cold sterilization: 10 hours, labeled and dated, rinse well.'],
   check:{q:'How long does glutaraldehyde need to sterilize?',a:'10 hours',d:['10 minutes','1 hour','30 days'],why:'Anything less than a 10-hour contact time is disinfection, not sterilization.'}},
  {id:'w3-monitor',sec:'Instrument processing',title:'Sterilization monitoring',scene:ST({hl:['spore','log','integrator','wrapcass'],pins:['spore','log','integrator'],cam:'steri'}),controls:['opview'],
   body:`<p><b>${T('Physical monitoring')}:</b> check the gauges every cycle: solution level, temperature, pressure and time. A wrong reading is the first warning, but correct readings don’t prove sterility.</p>
   <p><b>${T('Chemical monitoring')}:</b> ${T('process indicators')} (outside, such as autoclave tape) only show the pack was heated. ${T('Process integrators')} (inside) react to time, temperature and pressure together. Neither proves sterility.</p>
   <p><b>${T('Biologic monitoring')}</b> (spore testing) is the only way to confirm sterilization. Do it at least weekly. Put two spore strips in packs in the center of the load, run a normal cycle, and keep a third as the unsterilized control. Mail all three. A positive result (spores grew) means sterilization failed.</p>
   <p>Failures come from poor cleaning, wrong or too-thick packaging, closed containers, overloading, packs too close together, timing errors and low temperature.</p>`,
   remember:['Physical (gauges), chemical (indicators and integrators), biologic (spores).','Spore test weekly; center of the load; keep a control.','Positive = failed. Record every test in the log.'],
   check:{q:'Which is the only way to confirm sterilization actually happened?',a:'Biologic monitoring (spore test)',d:['Autoclave tape','Process integrator','Checking the gauges'],why:'Only killing resistant spores proves sterilization. Indicators and gauges only show conditions were reached.'}},
  {id:'w3-storage',sec:'Instrument processing',title:'Storage and delivery',scene:ST({hl:['storage'],pins:['storage'],cam:'storage'}),controls:['opview'],
   body:`<p>Store sterile packs in a clean, dry, closed area that protects the packages. Rotate them so the oldest sterilization dates are used first.</p>
   <p>When you deliver a pack to chairside, inspect it for tears, wetness or a broken seal; if it’s damaged, reprocess it. Check the indicator, then open it aseptically in front of the patient.</p>`,
   remember:['Oldest date in front.','Torn, wet or unsealed = not sterile; reprocess.','Opening the pack at chairside shows the patient it was sterile.'],
   check:{q:'You find a sterile pouch with a small tear. What do you do?',a:'Reprocess it: reclean if needed, repackage and sterilize again',d:['Use it if the indicator changed','Tape over the tear','Use it on the next patient only'],why:'A torn package is no longer sterile.'}},
  /* ---- Wrap-up ---- */
  {id:'w3-comp',sec:'Wrap-up',title:'Your Week 3 competency checklist',scene:ST({cam:'steri'}),controls:['opview'],comp:'w3',
   body:`<p>This is your school’s Sterilization and Infection Control competency. During your externship, a lead assistant watches you complete each task without help and grades it S or U. If you’re corrected, you repeat the task on another patient. The PPE section is graded Yes or No.</p>
   <p>Use “Show” to find each item, and check off what you can do on your own. Your checks are saved on this device only.</p>`},
  {id:'w3-best',sec:'Wrap-up',title:'Things best to remember',scene:ST({cam:'steri'}),controls:['opview'],
   body:`<div class="remember"><h3>Disease transmission</h3><ul>
   <li>Chain of infection: agent, reservoir, exit, transmission, entry, host. Break one link.</li><li>Spores are the most resistant life form, so they test sterilizers.</li>
   <li>HBV vaccine: offered free within 10 days; antibody test 1–6 months after dose 3. HCV has no vaccine.</li><li>Saliva can contain blood you can’t see.</li></ul></div>
   <div class="remember"><h3>OSHA and PPE</h3><ul>
   <li>CDC recommends; OSHA enforces. BBP Standard + exposure control plan reviewed yearly.</li><li>Standard Precautions: treat every patient as infectious.</li>
   <li>Medical records: employment + 30 years. HCS training records: 5 years.</li><li>Wash before gloving and after removing gloves; hand rub only if not visibly soiled.</li>
   <li>On: gown, mask, eyewear, hands, gloves. Off: gloves, hands, eyewear, mask, gown.</li><li>Face shield ≠ mask. Change masks every patient and when wet.</li>
   <li>One-handed scoop. Exposure: wash, antiseptic, bandage, report.</li><li>Five HCS parts: written program, inventory, SDS, labels, training.</li></ul></div>
   <div class="remember"><h3>Treatment room</h3><ul>
   <li>Utility gloves to clean. Spray the towel, preclean, then disinfect for the contact time.</li><li>EPA hospital disinfectant with a TB claim. Disinfectant = surfaces; antiseptic = skin.</li>
   <li>Critical → sterilize; semicritical → sterilize (or high-level disinfect); noncritical → disinfect.</li><li>Flush water lines 20–30 seconds between patients.</li></ul></div>
   <div class="remember"><h3>Sterilization</h3><ul>
   <li>Transport, clean, package, sterilize, store, deliver, QA. Dirty → clean → sterile → storage.</li><li>Holding solution and ultrasonic: covered, double-labeled; ultrasonic 5–15 min, changed daily.</li>
   <li>Integrator inside, indicator outside. Never reuse wraps or use staples.</li><li>Autoclave: distilled water; 250°F 15–30 min or 273°F 3–10 min; packs on edge; don’t overload.</li>
   <li>Chemical vapor 270°F/20 psi/20–40 min. Dry heat 320–375°F. Glutaraldehyde 10 hours.</li><li>Spore test weekly; positive = failure.</li></ul></div>`}
];

function svgSafety(){
  const cx=340,cy=250,R=170;
  const sector=(a1,a2)=>{const p=a=>[cx+Math.sin(a*Math.PI/180)*R,cy+Math.cos(a*Math.PI/180)*R];const [x1,y1]=p(a1),[x2,y2]=p(a2);return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R} 0 0,${a2>a1?0:1} ${x2.toFixed(1)},${y2.toFixed(1)} Z`;};
  // beam travels from the tube (bottom) up through the head; angles measured from the central ray toward the tube side
  const pt=a=>[cx+Math.sin(a*Math.PI/180)*R,cy-Math.cos(a*Math.PI/180)*R];
  const sec=(a1,a2,sgn)=>{const [x1,y1]=pt(sgn*a1),[x2,y2]=pt(sgn*a2);return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R} 0 0,${sgn>0?1:0} ${x2.toFixed(1)},${y2.toFixed(1)} Z`;};
  return `<svg viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Radiation safety positions">${svgBg(680,480)}
  ${hsG('s_zone',`<path d="${sec(45,90,1)}" fill="#1F8A4C" fill-opacity=".28" stroke="#1F8A4C" stroke-width="2"/><path d="${sec(45,90,-1)}" fill="#1F8A4C" fill-opacity=".28" stroke="#1F8A4C" stroke-width="2"/>${txt(cx+120,cy-90,'90–135°',{fs:14,c:'#1F8A4C',fw:800})}${txt(cx-180,cy-90,'90–135°',{fs:14,c:'#1F8A4C',fw:800})}${txt(cx+120,cy-70,'≥ 6 feet',{fs:13,c:'#1F8A4C'})}`)}
  <line x1="${cx}" y1="${cy+150}" x2="${cx}" y2="${cy-200}" stroke="#C8322F" stroke-width="5" stroke-dasharray="14 8"/>${txt(cx-150,cy-180,'beam path',{fs:12,c:'#C8322F'})}
  <rect x="${cx-22}" y="${cy+150}" width="44" height="60" rx="6" fill="#33414C"/>${txt(cx+30,cy+190,'tube / PID',{fs:12})}
  ${hsG('s_apron',`<circle cx="${cx}" cy="${cy}" r="34" fill="#F2D3BF" stroke="#8C6553" stroke-width="2"/><path d="M${cx-46},${cy-40} Q${cx},${cy-70} ${cx+46},${cy-40} L${cx+40},${cy-30} Q${cx},${cy-52} ${cx-40},${cy-30} Z" fill="#55677B"/>${txt(cx,cy+6,'patient',{a:'middle',fs:12})}`)}
  ${hsG('s_barrier',`<rect x="20" y="20" width="16" height="200" fill="#8A96A0"/><rect x="44" y="60" width="44" height="60" rx="6" fill="#F2F4F5" stroke="#5B6B77" stroke-width="2"/><circle cx="66" cy="100" r="8" fill="#C8322F"/>${txt(44,140,'exposure button',{fs:12})}${txt(44,156,'behind barrier',{fs:12})}`)}
  ${hsG('s_alara',`<rect x="470" y="20" width="190" height="80" rx="10" fill="#fff" stroke="#D6DEE3" stroke-width="2"/>${txt(565,50,'ALARA',{a:'middle',fs:20,fw:800,c:'#1F4FB5'})}${txt(565,74,'As Low As',{a:'middle',fs:12})}${txt(565,90,'Reasonably Achievable',{a:'middle',fs:12})}`)}
  </svg>`;
}
