<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Interactive 3D dental assisting study atlas.">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Dental Terminology Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: full-height two-pane bench. 3D stage left, reference/lesson panel right; stacks on phones.
   Accents borrow dental charting convention: red marks the selected item, blue is reference. */
:root{
  --bg:#EDF1F3; --panel:#FFFFFF; --ink:#16212B; --muted:#5B6B77; --line:#D6DEE3;
  --stage-a:#F9FBFC; --stage-b:#D9E2E8; --blue:#1F4FB5; --red:#C8322F; --chip:#E7EDF7; --chip-ink:#1F3F8F;
  --ok:#1F8A4C; --ok-bg:#E3F3E9; --red-bg:#FBE9E7; --on-blue:#FFFFFF; --term-bg:#FFF3D6; --term-ink:#6B4A00;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151B; --panel:#141E26; --ink:#E4EAEE; --muted:#93A3AE; --line:#24313B;
    --stage-a:#1B2831; --stage-b:#0A1015; --blue:#86A8F4; --red:#F07A6E; --chip:#1C2A3B; --chip-ink:#B9CCF7;
    --ok:#5BC98A; --ok-bg:#15301F; --red-bg:#3A1C1A; --on-blue:#0E151B; --term-bg:#3A2F12; --term-ink:#F5D98A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151B; --panel:#141E26; --ink:#E4EAEE; --muted:#93A3AE; --line:#24313B;
  --stage-a:#1B2831; --stage-b:#0A1015; --blue:#86A8F4; --red:#F07A6E; --chip:#1C2A3B; --chip-ink:#B9CCF7;
  --ok:#5BC98A; --ok-bg:#15301F; --red-bg:#3A1C1A; --on-blue:#0E151B; --term-bg:#3A2F12; --term-ink:#F5D98A;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
*{box-sizing:border-box}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-block:12px;padding-inline:20px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:1.35rem;letter-spacing:-0.01em;line-height:1.1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.82rem}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:7px 13px;border-radius:7px;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

main{display:grid;grid-template-columns:minmax(0,1fr) 410px;min-height:0}
.stage{position:relative;min-height:0;background:radial-gradient(ellipse 80% 70% at 50% 42%,var(--stage-a),var(--stage-b));overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas.pointing{cursor:pointer}
.toolbar{position:absolute;top:12px;left:14px;right:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none;z-index:4}
.toolbar > *{pointer-events:auto}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button,.tbtn{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--chip-ink)}
.tbtn{background:var(--panel);border:1px solid var(--line);padding:7px 10px;border-radius:8px}
.tbtn[aria-pressed="true"]{background:var(--chip);color:var(--chip-ink);border-color:transparent}
.toolbar select{font-size:.78rem;font-weight:600;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:100%}
.hint{position:absolute;left:16px;bottom:12px;right:16px;font-size:.76rem;color:var(--muted);pointer-events:none}
.tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:.78rem;font-weight:600;white-space:nowrap;box-shadow:0 4px 14px rgb(0 0 0 / .14);z-index:6}
.chip{position:absolute;left:14px;bottom:36px;max-width:min(460px,calc(100% - 28px));background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:8px;padding:8px 34px 8px 12px;font-size:.84rem;box-shadow:0 6px 18px rgb(0 0 0 / .12);z-index:5}
.chip b{display:block;font-size:.9rem}
.chip span{color:var(--muted)}
.chip button{position:absolute;top:4px;right:4px;border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:1rem;line-height:1;padding:4px 7px;border-radius:5px}
.building{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3}
.building span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:.85rem;font-weight:600;color:var(--muted);box-shadow:0 4px 14px rgb(0 0 0 / .1)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.9rem}
#pins{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.pin{position:absolute;left:0;top:0;will-change:transform}
.pin i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid #fff;box-shadow:0 1px 3px rgb(0 0 0 / .35)}
.pin span{position:absolute;left:9px;bottom:6px;white-space:nowrap;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:.74rem;font-weight:600;box-shadow:0 2px 8px rgb(0 0 0 / .12)}
.pin.left span{left:auto;right:9px}
.pin.blue i{background:var(--blue)}

.panel{min-height:0;overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding-block:20px 32px;padding-inline:22px}
.panel section + section{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.04em;color:var(--muted);margin:0 0 6px;font-variant-numeric:tabular-nums}
.panel h2{font-family:var(--f-display);font-weight:700;font-size:1.45rem;line-height:1.15;margin:0 0 8px;text-wrap:balance;letter-spacing:-0.01em}
.panel h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 10px;font-weight:700}
.panel p{margin:0 0 10px;max-width:65ch}
.aka{color:var(--muted);font-size:.9rem}
.small{font-size:.84rem}
.nums{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 14px}
.num{font-family:var(--f-mono);font-size:.8rem;padding:4px 9px;border-radius:6px;background:var(--chip);color:var(--chip-ink);font-weight:600}
.num b{font-weight:500;opacity:.75;margin-right:5px}
dl.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px;margin:0 0 12px;font-size:.9rem}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;min-width:0}
.surfchips{display:flex;gap:5px;flex-wrap:wrap}
.sc{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;padding:2px 8px 2px 6px;border-radius:999px;border:1px solid var(--line)}
.sc i{width:9px;height:9px;border-radius:50%;display:inline-block}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid rgb(0 0 0 / .18);vertical-align:-1px;margin-right:6px}

.odo{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px}
.odo.p{grid-template-columns:repeat(10,minmax(0,1fr))}
.odo button{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:6px 0;font-family:var(--f-mono);font-size:.68rem;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums;min-width:0}
.odo button:hover{border-color:var(--blue)}
.odo button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.odo .gap{grid-column:1 / -1;height:1px;background:var(--line);margin:4px 0}
.odo-sides{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:6px}
.odo-cap{font-size:.72rem;color:var(--muted);margin:0 0 6px}
.systems{display:grid;gap:10px;font-size:.88rem}
.systems div{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px}
.systems b{font-weight:600}

.legend{display:grid;gap:6px}
.legend button{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;cursor:pointer}
.legend button[aria-pressed="true"]{border-color:var(--ink)}
.legend .code{font-family:var(--f-mono);font-weight:600;font-size:.78rem;color:#fff;border-radius:5px;text-align:center;padding:3px 0}
.legend .nm{font-weight:600;font-size:.9rem;display:block}
.legend .df{font-size:.8rem;color:var(--muted);display:block;line-height:1.4}
.callout{border-left:3px solid var(--red);padding:2px 0 2px 12px;margin:0 0 10px}
.table-wrap{overflow-x:auto;margin:6px 0 12px}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{text-align:left;padding:7px 10px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.k{font-weight:600;white-space:nowrap}
td.m{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}

.parts{display:grid;gap:3px}
.parts button{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid transparent;background:transparent;border-radius:7px;padding:6px 8px;cursor:pointer;font-size:.9rem}
.parts button:hover{background:var(--bg)}
.parts button[aria-pressed="true"]{background:var(--chip);color:var(--chip-ink);font-weight:600}
.parts i{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgb(0 0 0 / .15)}
.parts small{margin-left:auto;font-family:var(--f-mono);color:var(--muted);font-size:.72rem}

/* Lesson */
.lesson-head{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-bottom:18px;min-width:0}
.lesson-head .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lesson-head select{font-size:.82rem;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-width:100%;min-width:0;flex:1 1 200px}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.lesson-body ul,.lesson-body ol{margin:0 0 12px;padding-left:20px}
.lesson-body li{margin-bottom:5px;max-width:62ch}
.lesson-body b.t,.term{background:var(--term-bg);color:var(--term-ink);padding:0 3px;border-radius:3px;font-weight:600}
.try{font-size:.86rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:12px 0}
.try b{color:var(--blue)}
.check{margin-top:20px;border:1px solid var(--line);border-radius:10px;padding:14px}
.check h3{margin-bottom:6px}
.check .q{font-weight:600;margin-bottom:10px}
.lesson-nav{position:sticky;bottom:-32px;margin:22px -22px -32px;padding:12px 22px calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
.lesson-nav .cnt{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.gl{display:grid;gap:12px}
.gl div{display:grid;gap:2px}
.gl b{font-size:.95rem}
.gl .pr{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.gl p{margin:0;font-size:.88rem}
.gl button{justify-self:start;border:0;background:none;color:var(--blue);font-weight:600;font-size:.8rem;padding:0;cursor:pointer}
.contour-fig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0 14px}
.contour-fig figure{margin:0;text-align:center;font-size:.76rem;color:var(--muted)}
.contour-fig svg{width:100%;height:auto;display:block}
.contour-fig figcaption b{display:block;color:var(--ink);font-size:.8rem}

/* Diagrams, chips, remember boxes */
.comp{margin-top:14px}
.comp h3{margin:14px 0 6px}
.comphead{font-size:.88rem;color:var(--muted)}
.comphead b{color:var(--ink)}
.comphead .bar{margin-top:6px}
.complist{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.complist li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-top:1px solid var(--line);font-size:.88rem}
.complist li:first-child{border-top:0}
.complist li span{flex:1;min-width:0}
.cbox{flex:none;width:24px;height:24px;border-radius:6px;border:1.5px solid var(--muted);background:var(--panel);color:var(--on-blue);font-weight:700;font-size:.85rem;line-height:1;cursor:pointer;padding:0}
.cbox[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.cshow{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--chip-ink);border-radius:6px;padding:3px 9px;font-size:.76rem;font-weight:600;cursor:pointer}
.compwrap summary{cursor:pointer;font-weight:700;font-size:.92rem;padding:4px 0}
.remember + .remember{margin-top:10px}

#diagram{position:absolute;inset:0;display:none;padding-block:58px 34px;padding-inline:12px;z-index:1}
.svgmode #diagram{display:block}
.svgmode canvas{visibility:hidden}
#diagram svg{width:100%;height:100%;display:block}
#diagram .lay{display:none}
#diagram.show-regions .lay-regions,#diagram.show-landmarks .lay-landmarks,#diagram.show-bones .lay-bones,#diagram.show-nerves .lay-nerves,#diagram.show-sinuses .lay-sinuses,#diagram.show-glands .lay-glands,#diagram.show-nodes .lay-nodes,#diagram.show-lines .lay-lines,#diagram.show-tmj .lay-tmj,#diagram.show-don .lay-don,#diagram.show-doff .lay-doff{display:inline}
#diagram .hs{cursor:pointer;transition:filter .15s}
#diagram .hs:hover{filter:brightness(1.06) drop-shadow(0 0 3px rgba(31,79,181,.7))}
#diagram .hs.on{filter:drop-shadow(0 0 3px #1F4FB5) drop-shadow(0 0 6px #1F4FB5)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--chip);color:var(--chip-ink);border-color:transparent}
.remember{margin-top:16px;border-radius:10px;padding:12px 14px;background:var(--term-bg);color:var(--ink)}
.remember h3{color:var(--term-ink);margin-bottom:6px}
.remember ul{margin:0;padding-left:18px}
.remember li{margin-bottom:5px;font-size:.9rem}
.da-box{font-size:.9rem;background:var(--term-bg);border-radius:8px;padding:8px 12px}
.da-box b{color:var(--term-ink)}
.chip .da{display:block;margin-top:4px;color:var(--ink)}
.chip .da b{display:inline;font-size:inherit;color:var(--term-ink)}
.lesson-body ul ul{margin-top:5px}
.lesson-head select#lesson-ch{font-weight:600}

/* Quiz */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.qscore{font-family:var(--f-mono);font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums}
.qbar{margin:8px 0 18px}
.qkind{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--chip-ink);background:var(--chip);padding:3px 8px;border-radius:5px;margin-bottom:10px}
.opts{display:grid;gap:6px;margin:14px 0}
.opts button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:.92rem;display:flex;gap:10px;align-items:center}
.opts button:hover:not(:disabled){border-color:var(--blue)}
.opts button:disabled{cursor:default}
.opts button .k{font-family:var(--f-mono);font-size:.75rem;font-weight:600;color:var(--muted);width:16px;flex:none}
.opts button.correct{border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}
.opts button.wrong{border-color:var(--red);background:var(--red-bg)}
.fb{font-size:.9rem;margin:10px 0;padding:8px 12px;border-radius:8px;background:var(--red-bg)}
.fb.good{background:var(--ok-bg)}
.hintbox{font-size:.9rem;margin:12px 0;padding:10px 12px;border-radius:8px;border:1px dashed var(--line);background:var(--bg)}
.hintbox b{color:var(--blue)}
.why{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.why p{font-size:.92rem}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;font-weight:600;font-size:.88rem;cursor:pointer}
.btn:hover{border-color:var(--blue)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.card{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:6px}
.card.feature{border-color:var(--blue)}
.card h3{margin:0;color:var(--ink);font-size:.95rem;text-transform:none;letter-spacing:0}
.topics{display:grid;gap:6px;margin:8px 0 12px}
.topics button{display:grid;grid-template-columns:20px minmax(0,1fr);gap:10px;text-align:left;align-items:start;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;cursor:pointer}
.topics button .box{width:18px;height:18px;border-radius:4px;border:2px solid var(--muted);margin-top:2px;display:grid;place-items:center;font-size:12px;line-height:1;color:var(--on-blue)}
.topics button[aria-pressed="true"]{border-color:var(--blue)}
.topics button[aria-pressed="true"] .box{background:var(--blue);border-color:var(--blue)}
.topics .nm{font-weight:600;display:block;font-size:.92rem}
.topics .df{font-size:.8rem;color:var(--muted);display:block}
.big{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:1;margin:6px 0;font-variant-numeric:tabular-nums}
.missed{list-style:none;padding:0;margin:0;display:grid;gap:8px;font-size:.88rem}
.missed li{border-left:3px solid var(--red);padding-left:10px}
.missed span{display:block;color:var(--muted)}

@media (max-width:900px){
  .app{height:auto;display:block}
  main{display:block}
  .stage{height:64vh;min-height:380px}
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible;padding-inline:16px}
  header{padding-inline:16px}
  .lesson-nav{position:sticky;bottom:0;margin:22px -16px -32px;padding-inline:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <div class="brand">
      <h1>Dental Terminology Atlas</h1>
      <p>Weeks 1–4 · anatomy, the clinic, infection control, patient care and radiography · click anything to learn its name</p>
    </div>
    <div class="tabs" role="tablist" aria-label="Section">
      <button role="tab" id="tab-lesson" data-mode="lesson" aria-selected="true">Lesson</button>
      <button role="tab" id="tab-chart" data-mode="chart" aria-selected="false">Teeth</button>
      <button role="tab" id="tab-anatomy" data-mode="anatomy" aria-selected="false">Tooth anatomy</button>
      <button role="tab" id="tab-headneck" data-mode="headneck" aria-selected="false">Head &amp; neck</button>
      <button role="tab" id="tab-op" data-mode="op" aria-selected="false">Clinic</button>
      <button role="tab" id="tab-surfaces" data-mode="surfaces" aria-selected="false">Surfaces</button>
      <button role="tab" id="tab-quiz" data-mode="quiz" aria-selected="false">Quiz</button>
    </div>
  </header>
  <main>
    <div class="stage" id="stage">
      <div class="loading" id="loading">Loading 3D model…</div>
      <div class="toolbar" id="toolbar"></div>
      <div id="pins"></div>
      <div class="building" id="building" hidden><span>Building the 3D tooth…</span></div>
      <div class="tip" id="tip" hidden></div>
      <div class="chip" id="chip" hidden></div>

<script id="anat-src" type="text/plain">
/* Dental anatomy specimen builder: signed-distance tooth models, surface-nets meshing,

var ANAT = (function(){

    if(y<=ys[0])return vs[0]; if(y>=ys[n-1])return vs[n-1];
    let i=0; while(y>ys[i+1])i++;

// Inigo Quilez round cone; sz squashes the cross-section along z (ellipse).
function cone(A,B,r1,r2,sz){

const DEFS={
  lowerMolar:{

    a:[[-3.5,3.1],[0,3.35],[2,3.5],[4.5,3.0],[7,2.0],[9.3,1.1],[10.7,0.7]],

    roots:[{A:[0.05,-1,0],B:[0.35,-13.3,0],r1:3.1,r2:0.75,sz:0.95,name:'Root'}],
    rootK:1.5, enamel:[0.95,0.25,8.5,10.7], cem:[-6,-13.5], incisor:true,

function make(key,age,rec){
  const D=DEFS[key], G=GUM[rec], young=age==='young', older=age==='older';

      for(const f of D.fossae){const dx=x-f[0],dz=z-f[1];h-=f[2]*Math.exp(-(dx*dx+dz*dz)/(2*f[3]*f[3]));}

    let side=(Math.sqrt(Math.sqrt(X2*X2+Z2*Z2))-1)*Math.sqrt(a*b);
    if(D.lingualFossa){
      const w=sstep(0.3,-1.2,x-fcx(y))*clamp(1-Z2,0,1);
      side+=w*(0.55*Math.exp(-((y-6)*(y-6))/5.8)-0.35*Math.exp(-((y-1.8)*(y-1.8))/1.6));
    }

  }

    const occ=young?2.2:older?3.6:2.7, wall=young?1.7:older?3.0:2.3, hf=young?1.0:older?0.45:0.85;
    const floor=young?-3.5:older?-2.3:-3.0;
    roof=D.base-occ+0.8;
    const hs=D.cusps.map(c=>[0.8*c[1],0.3*c[2],c[3]*hf]);
    const roofF=(x,z)=>{let h=D.base-occ;for(const c of hs){const dx=x-c[0],dz=z-c[1];h+=c[2]*Math.exp(-(dx*dx+dz*dz)/2.1);}return h;};
    chamberF=(x,y,z)=>{const yy=Math.max(y,floor),a=Math.max(0.8,fa(yy)-wall),b=Math.max(0.8,fb(yy)-wall),X=x/a,Z=z/b,X2=X*X,Z2=Z*Z;
      const side=(Math.pow(X2*X2+Z2*Z2,0.25)-1)*Math.sqrt(a*b);
      return smax(smax(side,y-roofF(x,z),0.5),floor-y,0.7);};
    hs.forEach(c=>hornTips.push([c[0],roofF(c[0],c[1]),c[1]]));
    const horns=[];
    roots.forEach(r=>{
      const A=[r.A[0]*0.95,floor+0.4,r.A[2]], end=extendTip(r.A,r.B,r.r2*0.85);
      const cf=cone(A,end,young?1.25:older?0.45:0.8,young?0.95:older?0.12:0.2,D.canalSz);
      canals.push({f:cf,A,B:end,root:r});

  let acc=null;

    const ac=D.incisor?{root:0,t:0.62,dir:[1,-0.25,0]}:D.acc, cn=canals[ac.root];
    const S0=lerp3(cn.A,cn.B,ac.t), l=Math.hypot(...ac.dir);
    const dir=ac.dir.map(v=>v/l), E1=[S0[0]+dir[0]*5,S0[1]+dir[1]*5,S0[2]+dir[2]*5];
    // clip end just past the root surface
    let s=0; for(;s<5;s+=0.05){if(T(S0[0]+dir[0]*s,S0[1]+dir[1]*s,S0[2]+dir[2]*s)>0.05)break;}
    const E2=[S0[0]+dir[0]*(s+0.05),S0[1]+dir[1]*(s+0.05),S0[2]+dir[2]*(s+0.05)];
    const af=cone(S0,E2,0.17,0.15,1);

/* ---------- surface nets ---------- */
function surfaceNets(F,nx,ny,nz,ox,oy,oz,st){
  const cells=new Int32Array(nx*ny*nz); cells.fill(-1);
  const pos=[], idx=[], g=new Float32Array(8);
  const E=[[0,1],[2,3],[4,5],[6,7],[0,2],[1,3],[4,6],[5,7],[0,4],[1,5],[2,6],[3,7]];
  const sxy=nx*ny;
  for(let k=0;k<nz-1;k++)for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){
    const b=i+nx*j+sxy*k;
    let mask=0;
    for(let c=0;c<8;c++){const v=F[b+(c&1)+nx*((c>>1)&1)+sxy*((c>>2)&1)];g[c]=v;if(v<0)mask|=1<<c;}
    if(mask===0||mask===255)continue;
    let vx=0,vy=0,vz=0,cnt=0;
    for(let e=0;e<12;e++){
      const a=E[e][0],c=E[e][1];
      if(((mask>>a)&1)===((mask>>c)&1))continue;
      const t=g[a]/(g[a]-g[c]);
      vx+=(a&1)+((c&1)-(a&1))*t; vy+=((a>>1)&1)+(((c>>1)&1)-((a>>1)&1))*t; vz+=((a>>2)&1)+(((c>>2)&1)-((a>>2)&1))*t; cnt++;
    }
    cells[b]=pos.length/3;
    pos.push(ox+(i+vx/cnt)*st,oy+(j+vy/cnt)*st,oz+(k+vz/cnt)*st);
    const R=[1,nx,sxy], ijk=[i,j,k];
    for(let ax=0;ax<3;ax++){
      const c1=1<<ax;
      if(((mask)&1)===((mask>>c1)&1))continue;
      const u=(ax+1)%3,v=(ax+2)%3;
      if(ijk[u]===0||ijk[v]===0)continue;
      const du=R[u],dv=R[v];
      const q0=cells[b],q1=cells[b-du],q2=cells[b-du-dv],q3=cells[b-dv];
      if(q1<0||q2<0||q3<0)continue;
      if(mask&1){idx.push(q0,q3,q2,q0,q2,q1);}else{idx.push(q0,q1,q2,q0,q2,q3);}
    }
  }
  return {pos:new Float32Array(pos),idx:(pos.length/3>65535?new Uint32Array(idx):new Uint16Array(idx))};
}
function grid(fn,x0,x1,y0,y1,z0,z1,st){
  const nx=Math.ceil((x1-x0)/st)+1,ny=Math.ceil((y1-y0)/st)+1,nz=Math.ceil((z1-z0)/st)+1;
  return {nx,ny,nz,x0,y0,z0,st};
}

/* ---------- build meshes ---------- */
function buildMeshes(S){
  const BL=S.block, st=0.25, pad=0.6;
  const topMax=S.D.incisor?S.D.incisal:9;
  const x0=-BL.x-pad,x1=BL.x+pad,y0=BL.bottom-pad,y1=Math.max(topMax,S.G.gm)+pad,z0=-(BL.z+1.1)-pad,z1=-z0;
  const nx=Math.ceil((x1-x0)/st)+1,ny=Math.ceil((y1-y0)/st)+1,nz=Math.ceil((z1-z0)/st)+1, N=nx*ny*nz;
  const Tf=new Float32Array(N), Bf=new Float32Array(N), Gf=new Float32Array(N);
  let n=0;
  for(let k=0;k<nz;k++){const z=z0+k*st;for(let j=0;j<ny;j++){const y=y0+j*st;for(let i=0;i<nx;i++,n++){const x=x0+i*st;
    // skip exact tooth eval far away from the tooth for speed
    const t=S.T(x,y,z);
    Tf[n]=t; Bf[n]=S.boneF(x,y,z,t); Gf[n]=S.gumF(x,y,z,t);
  }}}
  const tooth=surfaceNets(Tf,nx,ny,nz,x0,y0,z0,st);
  const bone=surfaceNets(Bf,nx,ny,nz,x0,y0,z0,st);
  const gum=surfaceNets(Gf,nx,ny,nz,x0,y0,z0,st);
  // pulp on a finer grid around the pulp
  const ps=0.15;
  let px0=1e9,px1=-1e9,py0=1e9,py1=-1e9,pz0=1e9,pz1=-1e9;
  S.canals.forEach(c=>[c.A,c.B].forEach(p=>{px0=Math.min(px0,p[0]);px1=Math.max(px1,p[0]);py0=Math.min(py0,p[1]);pz0=Math.min(pz0,p[2]);pz1=Math.max(pz1,p[2]);}));
  S.hornTips.forEach(p=>{px0=Math.min(px0,p[0]);px1=Math.max(px1,p[0]);py1=Math.max(py1,p[1]);pz0=Math.min(pz0,p[2]);pz1=Math.max(pz1,p[2]);});
  if(S.acc){[S.acc.B].forEach(p=>{px0=Math.min(px0,p[0]);px1=Math.max(px1,p[0]);});}
  px0-=3.4;px1+=3.4;py0-=1;py1+=1;pz0-=3.4;pz1+=3.4;
  const qx=Math.ceil((px1-px0)/ps)+1,qy=Math.ceil((py1-py0)/ps)+1,qz=Math.ceil((pz1-pz0)/ps)+1;
  const Pf=new Float32Array(qx*qy*qz); n=0;
  for(let k=0;k<qz;k++){const z=pz0+k*ps;for(let j=0;j<qy;j++){const y=py0+j*ps;for(let i=0;i<qx;i++,n++){const x=px0+i*ps;
    const p=S.P(x,y,z); Pf[n]=p>0.8?p:Math.max(p,S.T(x,y,z)-0.02);
  }}}
  const pulp=surfaceNets(Pf,qx,qy,qz,px0,py0,pz0,ps);
  return {tooth,bone,gum,pulp};
}

/* ---------- cross-section at z = 0 ---------- */
const ID={bg:0,enamel:1,dentinC:2,dentinR:3,pulpC:4,horn:5,pulpR:6,acc:7,cem:8,pdl:9,bone:10,gum:11,sulcus:12};
function classify(S,x,y,z,out){
  const t=S.T(x,y,z);

    const p=S.P(x,y,z);
    if(p<0){

      if(y>S.roof-0.25)return ID.horn;
      return y>0?ID.pulpC:ID.pulpR;

  body:`<p>${T('Enamel')} makes up the outer layer of the anatomic crown. It is the hardest material in the body. That hardness protects the softer dentin underneath and gives the tooth a strong surface for tearing, crushing, grinding and chewing.</p>
<p>Enamel is <i>translucent</i>, meaning some light passes through it, and ranges from yellow-white to gray-white.</p>
<p>Like bone, enamel is hard and heavily mineralized. Unlike bone, mature enamel contains no cells that can repair it, although some remineralization is possible.</p>
<p>Enamel is built from millions of calcified ${T('enamel prisms')}, also called <b>enamel rods</b>. They run from the surface of the tooth to the <b>dentinoenamel junction</b>, grouped in rows roughly perpendicular to the surface. Zoom in on the cut face to see them as fine lines.</p>`,
  check:{q:'Why can’t mature enamel repair itself?',a:'It contains no living cells',d:['It is softer than dentin','It has no enamel prisms','It is covered by cementum'],why:'Mature enamel has no cells capable of rebuilding it. Some minerals can be restored at the surface (remineralization), but lost enamel does not grow back.'}},
 {id:'dentin',sec:'Tissues of the tooth',title:'Dentin',
  scene:{scene:'anat',spec:'lowerMolar',age:'adult',rec:'healthy',tissues:true,aview:'cut',hl:['dentin'],pins:['tubules','dej'],cam:'anat'},
  controls:['spec'],
  body:`<p>${T('Dentin')} makes up most of the tooth and runs almost its entire length. Enamel covers it on the crown and cementum covers it on the root.</p>
<p>In primary teeth dentin is very light yellow. In permanent teeth it is light yellow and somewhat transparent, and it darkens with age.</p>
<p>Dentin is harder than bone and cementum but not as hard as enamel. It is also very porous, full of microscopic canals called ${T('dentinal tubules')} that run from its outer surface, where it meets the enamel or cementum, to the pulp chamber. Each tubule holds a ${T('dentinal fiber')} that carries pain to the pulp. Without enamel protecting it, the tubules become a direct passage for bacteria into the pulp.</p>
<p>Dentin is living and very sensitive, so it has to be protected during treatment from <i>dehydration</i> (excessive drying) and <i>thermal shock</i> (sudden temperature changes). It can repair itself to some degree, so the dentist may use materials that encourage that repair.</p>`,
  check:{q:'What carries pain signals inside a dentinal tubule?',a:'The dentinal fiber',d:['An enamel prism','A Sharpey fiber','The apical foramen'],why:'Each tubule contains a dentinal fiber that transmits pain toward the pulp. That is why exposed dentin feels sensitive.'}},
 {id:'pulp',sec:'Tissues of the tooth',title:'Pulp',
  scene:{scene:'anat',spec:'lowerMolar',age:'adult',rec:'healthy',tissues:true,aview:'cut',hl:['pulp'],pins:['horn','coronal','radicular','foramen','accessory'],cam:'anat'},
  controls:['age','aview'],
  body:`<p>The inner walls of the dentin form the ${T('pulp')} chamber, which follows the outer shape of the tooth.</p>
<ul><li><b>Coronal pulp</b> lies in the crown and includes the ${T('pulp horns')}, which reach toward the cusp tips and incisal edges.</li>
<li><b>Radicular (root) pulp</b> lies in each root. It connects to the periapical tissues through the <b>apical foramen</b>.</li>
<li>An <b>accessory canal</b> is a small side branch running from the root canal to the root surface.</li></ul>
<p>The pulp is made of blood vessels and nerves that enter through the apical foramen. Its blood comes from branches of the dental arteries and from the periodontal ligament. A weak stimulus gets a weak response the patient may not notice; a strong one causes pain.</p>
<p class="try"><b>Try it:</b> set <b>Age</b> to <b>Young</b>: the apical foramen is still wide open and the chamber is large. At <b>Older</b>, the chamber has shrunk because dentin keeps being laid down for life. <b>See-through</b> shows the pulp’s full 3D shape.</p>`,
  check:{q:'Why does the pulp chamber get smaller with age?',a:'Dentin keeps being deposited',d:['Enamel grows inward','Cementum fills the chamber','The pulp horns wear down'],why:'Dentin is laid down continuously throughout life, so the space inside it, the pulp chamber, gradually narrows. The apical foramen also narrows as the tooth matures.'}},
 {id:'cementum',sec:'Tissues of the tooth',title:'Cementum',
  scene:{scene:'anat',spec:'lowerMolar',age:'adult',rec:'receded',tissues:true,aview:'cut',hl:['cementum'],pins:['cementum','cej'],cam:'anat'},
  controls:['rec','aview'],
  body:`<p>${T('Cementum')} covers and protects the root and meets the enamel at the CEJ. It is not as hard as enamel or dentin.</p>
<p>It is light yellow: somewhat lighter than dentin and darker than enamel, without enamel’s luster and translucency.</p>
<p>Normally bone and gingiva cover the cementum. When gingival recession and bone loss expose it, cementum becomes very sensitive and susceptible to decay. The model is set to <b>Recession</b> so you can see cementum above the gumline; switch back to <b>Healthy gums</b> to compare.</p>`,
  check:{q:'Cementum exposed by recession and bone loss is…',a:'Very sensitive and prone to decay',d:['Harder than enamel','Covered by new enamel','Painless because it has no nerves nearby'],why:'Cementum is normally covered by bone and gingiva. Once exposed, it is sensitive and decays easily, which is why recession is a concern.'}},
 {id:'perio',sec:'Tissues of the tooth',title:'Periodontium and periodontal ligament',
  scene:{scene:'anat',spec:'lowerMolar',age:'adult',rec:'healthy',tissues:true,aview:'cut',hl:['periodontium'],pins:['cementum','pdl','bone','sharpey'],cam:'root'},
  controls:['age','spec'],
  body:`<p>The ${T('periodontium')} supports the teeth in the alveolar bone. It is made of three tissues: <b>cementum</b>, <b>alveolar bone</b> and the <b>periodontal ligament</b>. Together they protect and nourish the teeth.</p>
<p>The ${T('periodontal ligament')} (PDL) is dense connective tissue organized into groups of fibers that connect the cementum covering the root to the alveolar bone of the socket wall. The fiber ends are embedded in cementum at one end and in bone at the other; those embedded ends become mineralized and are called <b>Sharpey fibers</b>.</p>
<p>The PDL is only 0.1 to 0.38 mm wide, thinnest around the middle third of the root, and it gradually narrows with age. Compare <b>Young</b> and <b>Older</b> to see it thin out.</p>`,
  check:{q:'Which three tissues make up the periodontium?',a:'Cementum, alveolar bone and periodontal ligament',d:['Enamel, dentin and pulp','Gingiva, enamel and cementum','Pulp, dentin and cementum'],why:'The periodontium is the tooth’s support system: cementum on the root, the alveolar bone of the socket, and the PDL fibers joining the two.'}},
 {id:'types',sec:'Teeth and arches',title:'Types of teeth',
  scene:{scene:'arch',set:'perm',arches:'both',color:'type',labels:false,cam:'front'},
  controls:['arches'],
  body:`<p>People eat meats, vegetables, grains and fruit, so the teeth come in shapes for cutting, shearing (incising), tearing and grinding.</p>
<div class="table-wrap"><table><thead><tr><th>Type</th><th>Characteristics</th><th>Function</th></tr></thead><tbody>
<tr><td class="k"><span class="sw" style="background:#F2B880"></span>Incisors</td><td>Single root; relatively sharp, thin edge; at the front of the mouth</td><td>Cut food without heavy force</td></tr>
<tr><td class="k"><span class="sw" style="background:#E0876A"></span>Canines</td><td>Also called cuspids. At the “corners” of the arch, with a thick crown and one well-developed pointed cusp. Their long roots make them the most stable teeth; usually the last ones lost</td><td>Cut and tear food that needs force</td></tr>
<tr><td class="k"><span class="sw" style="background:#8FA8E0"></span>Premolars</td><td>Also called bicuspids. Points and cusps like canines, but a broader chewing surface. None in the primary dentition</td><td>Grasp and tear; also chew</td></tr>
<tr><td class="k"><span class="sw" style="background:#78C495"></span>Molars</td><td>More cusps than the other teeth; the shorter, blunter cusps form a chewing surface</td><td>Chew and grind solid food with heavy force</td></tr>
</tbody></table></div>`,
  check:{q:'Which teeth are the most stable and usually the last to be lost?',a:'Canines',d:['Central incisors','First premolars','Third molars'],why:'Canines have the longest roots in the mouth, which anchors them firmly. That is why they are usually the last teeth lost.'}},
 {id:'arches',sec:'Teeth and arches',title:'Dental arches',
  scene:{scene:'arch',set:'perm',arches:'both',color:'none',labels:false,cam:'left'},
  controls:['arches','jaw'],
  body:`<p>The mouth has two dental arches. The ${T('maxillary arch')} is what a layperson calls the upper jaw, and the ${T('mandibular arch')} is the lower jaw.</p>
<p>The maxillary arch is actually part of the skull, so it is fixed and cannot move. The mandibular arch moves through the action of the temporomandibular joint (TMJ).</p>
<p class="try"><b>Try it:</b> press <b>Open jaw</b> and watch which arch moves.</p>`,
  check:{q:'Which dental arch is fixed and cannot move?',a:'Maxillary',d:['Mandibular','Both arches','Neither arch'],why:'The maxillary arch is part of the skull. Only the mandible moves, hinging at the temporomandibular joint.'}},
 {id:'quadrants',sec:'Teeth and arches',title:'Quadrants',
  scene:{scene:'arch',set:'perm',arches:'both',color:'quad',labels:false,midline:true,pins:['quad'],cam:'front'},
  controls:['dent2'],
  body:`<p>An imaginary ${T('midline')} divides each arch into mirror-image halves. The two arches split in half make four sections called ${T('quadrants')}:</p>
<ol><li>Maxillary right</li><li>Maxillary left</li><li>Mandibular left</li><li>Mandibular right</li></ol>
<p>Each quadrant of the permanent dentition holds 8 teeth (4 × 8 = 32). Each quadrant of the primary dentition holds 5 (4 × 5 = 20).</p>
<p>When you look into a patient’s mouth, directions are reversed: the patient’s right is on your left, just as when two people face each other to shake hands. The model is shown the way you see it facing the patient.</p>`,
  check:{q:'How many teeth are in one quadrant of the primary dentition?',a:'5',d:['4','8','10'],why:'The primary dentition has 20 teeth, so each quadrant has 5: central incisor, lateral incisor, canine, first molar and second molar.'}},
 {id:'sextants',sec:'Teeth and arches',title:'Sextants',
  scene:{scene:'arch',set:'perm',arches:'both',color:'sext',labels:false,pins:['sext'],cam:'front'},
  controls:['arches'],
  body:`<p>Each arch can also be divided into three ${T('sextants')}, each one sixth of the dentition:</p>
<ol><li>Maxillary right posterior</li><li>Maxillary anterior</li><li>Maxillary left posterior</li><li>Mandibular right posterior</li><li>Mandibular anterior</li><li>Mandibular left posterior</li></ol>
<p>The anterior sextant runs from canine to canine. Each posterior sextant holds the premolars and molars on one side.</p>`,
  check:{q:'Tooth #19, the mandibular left first molar, is in which sextant?',a:'Mandibular left posterior',d:['Mandibular anterior','Maxillary left posterior','Mandibular right posterior'],why:'Molars are posterior teeth, #19 is in the lower (mandibular) arch, and it is on the patient’s left.'}},
 {id:'antpost',sec:'Teeth and arches',title:'Anterior and posterior teeth',
  scene:{scene:'arch',set:'perm',arches:'upper',color:'ap',labels:false,cam:'upper'},
  controls:['arches'],
  body:`<p>To describe where teeth are and what they do, they are grouped as ${T('anterior')} (toward the front) or ${T('posterior')} (toward the back).</p>
<p>The anterior teeth are the incisors and canines. They are usually visible when people smile, and they are aligned in a gentle curve.</p>
<p>The posterior teeth are the premolars and molars. They are aligned with little or no curvature, almost in a straight line. Looking up at the maxillary arch makes the difference easy to see. Remembering this alignment will matter when you begin exposing radiographs.</p>`,
  check:{q:'Which teeth are aligned almost in a straight line?',a:'Premolars and molars',d:['Incisors and canines','Incisors only','Canines and premolars'],why:'The posterior teeth (premolars and molars) sit in a nearly straight line; the anterior teeth curve around the front of the arch.'}},
 {id:'surfaces',sec:'Surfaces and features',title:'Tooth surfaces',
  scene:{scene:'arch',set:'perm',arches:'both',color:'surf',labels:false,cam:'front'},
  controls:['arches'],
  body:`<p>Each tooth has five surfaces: facial, lingual, masticatory, mesial and distal.</p>
<div class="table-wrap"><table><thead><tr><th>Surface</th><th>Description</th></tr></thead><tbody>
<tr><td class="k"><span class="sw" style="background:#2F7BE0"></span>Facial</td><td>Closest to the face. Called <b>labial</b> near the lips and <b>buccal</b> near the inner cheek.</td></tr>
<tr><td class="k"><span class="sw" style="background:#8A5AD6"></span>Lingual</td><td>Closest to the tongue.</td></tr>
<tr><td class="k"><span class="sw" style="background:#23A15A"></span>Masticatory</td><td>The chewing surface: the <b>incisal</b> surface or edge on anterior teeth, the <b>occlusal</b> surface on posterior teeth.</td></tr>
<tr><td class="k"><span class="sw" style="background:#E0603A"></span>Mesial</td><td>Closest to the midline.</td></tr>
<tr><td class="k"><span class="sw" style="background:#E9A92A"></span>Distal</td><td>Farthest from the midline.</td></tr>
<tr><td class="k">Palatal</td><td>Closest to the palate: the lingual surface of maxillary teeth.</td></tr>
</tbody></table></div>
<p class="try"><b>Try it:</b> click any colored surface on the model to see its name for that tooth.</p>`,
  check:{q:'The surface of a mandibular molar that faces the cheek is the…',a:'Buccal surface',d:['Labial surface','Lingual surface','Palatal surface'],why:'The facial surface of a posterior tooth sits against the inner cheek, so it is buccal. Labial is used for anterior teeth, which sit against the lips.'}},
 {id:'contours',sec:'Surfaces and features',title:'Contours',
  scene:{scene:'arch',set:'perm',arches:'lower',color:'none',labels:false,cam:'tooth:19'},
  controls:['arches'],
  body:`<p>Contours, contacts and embrasures help keep teeth in position in the arch and protect the tissues while you chew.</p>
<p>Every tooth surface is curved, unless the tooth is fractured or worn. Some surfaces are <b>convex</b> (curved outward) and some are <b>concave</b> (curved inward). Whatever the shape, the crown always narrows toward the cervical line.</p>
<p>The curves of the facial and lingual surfaces act as natural passageways that steer food past the gingiva. A normal contour gives the gingiva enough stimulation to stay healthy while protecting it from damage. When a tooth is restored, returning it to its normal contour matters:</p>
<div class="contour-fig" aria-label="Three tooth profiles showing how food moves past the gingiva">
${[['Normal','Food glances off the gum'],['Inadequate','Food hits the gum'],['Overcontoured','Gum gets no stimulation']].map((c,i)=>`<figure><svg viewBox="0 0 90 110" role="img" aria-label="${c[0]} contour"><path d="M12 108 L12 70 Q20 62 30 60 L60 60 Q70 62 78 70 L78 108 Z" fill="#E3919A"/><path d="${i===0?'M45 4 C 58 4 66 18 64 36 C 63 48 58 56 56 70 L 34 70 C 32 56 27 48 26 36 C 24 18 32 4 45 4 Z':i===1?'M45 4 C 56 4 60 18 58 36 C 57 48 55 58 55 70 L 35 70 C 35 58 33 48 32 36 C 30 18 34 4 45 4 Z':'M45 4 C 62 4 72 20 70 38 C 68 52 60 58 56 70 L 34 70 C 30 58 22 52 20 38 C 18 20 28 4 45 4 Z'}" fill="#F3F1EA" stroke="#8C8A80" stroke-width="1.2"/><path d="${i===0?'M72 12 C 72 30 70 44 76 58':i===1?'M68 12 C 66 34 64 50 62 64':'M78 14 C 80 32 80 44 82 52'}" fill="none" stroke="#C8322F" stroke-width="2.2" marker-end="url(#ah${i})"/><defs><marker id="ah${i}" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C8322F"/></marker></defs></svg><figcaption><b>${c[0]}</b>${c[1]}</figcaption></figure>`).join('')}
</div>
<p>With <b>inadequate contour</b>, food is pushed against the gingiva and injures it. With <b>overcontouring</b>, the gingiva lacks stimulation and is hard to clean.</p>`,
  check:{q:'A new crown is overcontoured. What is the likely problem?',a:'The gingiva lacks stimulation and is hard to clean',d:['Food is pushed into the gingiva and injures it','The contact point disappears','The tooth becomes more stable'],why:'An overcontoured surface shields the gingiva completely, so it gets no stimulation and plaque collects where it is hard to clean. Too little contour lets food hit the gingiva instead.'}},
 {id:'contacts',sec:'Surfaces and features',title:'Contacts',
  scene:{scene:'arch',set:'perm',arches:'lower',color:'none',labels:true,contacts:true,pins:['contact'],cam:'contact'},
  controls:['arches'],
  body:`<p>The ${T('contact area')} is the part of a tooth’s mesial or distal surface that touches the neighboring tooth in the same arch. The ${T('contact point')} is the exact spot where they touch. In practice the terms contact and contact area are often used to mean the contact point.</p>
<p>The crown of each tooth should touch the tooth or teeth next to it. The red dots mark every contact on the model. Proper contact between neighboring teeth:</p>
<ol><li>Keeps food from getting trapped between the teeth.</li><li>Stabilizes the arches by holding the teeth in each arch in positive contact.</li><li>Protects the interproximal gingiva from trauma during chewing.</li></ol>`,
  check:{q:'Which of these is NOT a purpose of proper contact between neighboring teeth?',a:'Shrinking the pulp chamber',d:['Keeping food from being trapped','Stabilizing the dental arches','Protecting the interproximal gingiva'],why:'Contacts do three jobs: keep food out from between teeth, stabilize the arches, and protect the gingiva between the teeth. They have nothing to do with the pulp.'}},
 {id:'embrasures',sec:'Surfaces and features',title:'Embrasures',
  scene:{scene:'arch',set:'perm',arches:'lower',color:'none',labels:false,contacts:true,embr:true,pins:['embr'],cam:'embr'},
  controls:['arches'],
  body:`<p>An ${T('embrasure')} is a triangular space near the gingiva between the proximal surfaces of two neighboring teeth. Embrasures continue into the interproximal spaces between the teeth.</p>
<p>From the contact point, embrasures open outward (diverge) in four directions: <b>facially</b>, <b>lingually</b>, <b>apically</b> toward the gingiva, and <b>occlusally</b>. The four red wedges on the model point into them from the contact between #19 and #20.</p>
<p>Contours, contact areas and embrasures all work together to keep the oral tissues healthy and functioning.</p>`,
  check:{q:'An embrasure is…',a:'A triangular space between the proximal surfaces of neighboring teeth',d:['The exact spot where two teeth touch','An indentation on the chewing surface','The groove between the gingiva and the tooth'],why:'The contact point is where teeth touch; the embrasures are the V-shaped spaces that open out from it. An indentation on the chewing surface is a fossa, and the groove at the gumline is the sulcus.'}},
 {id:'occlusion',sec:'Surfaces and features',title:'Occlusion',
  scene:{scene:'arch',set:'perm',arches:'both',color:'none',labels:false,pins:['cuspfossa'],cam:'left'},
  controls:['bite','arches'],
  body:`<p>${T('Occlusion')} is the contact between the maxillary and mandibular teeth in every position and movement of the mandible.</p>
<p>Occlusal surfaces are made of ${T('cusps')} (raised areas) and ${T('fossae')} (indentations or grooves). The cusps of the teeth in one arch fit into the fossae of the opposing arch, which makes a very effective grinding action for chewing.</p>
<p class="try"><b>Try it:</b> press <b>Close bite</b> to bring the arches together, then turn the model to see how the back teeth meet.</p>`,
  check:{q:'What are the raised areas on an occlusal surface called?',a:'Cusps',d:['Fossae','Embrasures','Contacts'],why:'Cusps are the raised points; fossae are the indentations they fit into when the teeth close.'}},
 {id:'dentition',sec:'Dentition and numbering',title:'Dentition',
  scene:{scene:'arch',set:'perm',arches:'both',color:'none',labels:false,cam:'front'},
  controls:['dent3'],
  body:`<p>${T('Dentition')} means the natural teeth in the dental arches. ${T('Edentulous')} means without natural teeth, the condition after the permanent teeth have been lost.</p>
<p>A person normally has two complete sets of teeth in a lifetime: the ${T('primary dentition')} and the ${T('permanent dentition')}. The period of changing over from one to the other is the ${T('mixed dentition')}, when both primary and permanent teeth are in the mouth.</p>
<p class="try"><b>Try it:</b> use the <b>Dentition</b> buttons to compare all three.</p>`,
  check:{q:'A patient has lost all of their natural teeth. The term for this is…',a:'Edentulous',d:['Exfoliated','Mixed dentition','Deciduous'],why:'Edentulous means without natural teeth. Exfoliation is the normal shedding of primary teeth, and deciduous is another word for primary teeth.'}},
 {id:'primary',sec:'Dentition and numbering',title:'Primary dentition',
  scene:{scene:'arch',set:'prim',arches:'both',color:'type',labels:true,system:'uni',cam:'front'},
  controls:['arches','numbers'],
  body:`<p>All 20 teeth of the ${T('primary dentition')} should have erupted and be in place shortly after age 2. (<i>Eruption</i> is the movement of a tooth through the bone and gingiva into the mouth.)</p>
<p>Each primary quadrant holds a central incisor, lateral incisor, canine, first molar and second molar. There are no premolars.</p>
<p>Primary teeth, also called <b>deciduous</b> teeth, are eventually shed to make way for their replacements. This normal shedding is ${T('exfoliation')}; during it, the roots of the primary teeth are <b>resorbed</b> (removed by a normal body process).</p>
<h3 style="margin-top:14px">Average eruption and exfoliation</h3>
<div class="table-wrap"><table><thead><tr><th>Tooth</th><th>Erupts (months)</th><th>Shed (years)</th></tr></thead><tbody>
<tr><th colspan="3" style="padding-top:10px">Maxillary</th></tr>
${[['Central incisor','dcentral'],['Lateral incisor','dlateral'],['First molar','dm1'],['Canine','dcanine'],['Second molar','dm2']].map(r=>`<tr><td>${r[0]}</td><td class="m">${PERUPT.upper[r[1]][0]}</td><td class="m">${PERUPT.upper[r[1]][1]}</td></tr>`).join('')}
<tr><th colspan="3" style="padding-top:10px">Mandibular</th></tr>
${[['Central incisor','dcentral'],['Lateral incisor','dlateral'],['First molar','dm1'],['Canine','dcanine'],['Second molar','dm2']].map(r=>`<tr><td>${r[0]}</td><td class="m">${PERUPT.lower[r[1]][0]}</td><td class="m">${PERUPT.lower[r[1]][1]}</td></tr>`).join('')}
</tbody></table></div>
<p class="aka small">Listed in order of eruption. Notice the first molar comes in before the canine.</p>`,
  check:{q:'Which type of tooth is NOT found in the primary dentition?',a:'Premolars',d:['Canines','Molars','Incisors'],why:'Each primary quadrant has incisors, a canine and two molars. Premolars only appear in the permanent dentition, where they replace the primary molars.'}},
 {id:'mixed',sec:'Dentition and numbering',title:'Mixed dentition',
  scene:{scene:'arch',set:'mixed',arches:'both',color:'none',labels:true,system:'uni',cam:'front'},
  controls:['arches','numbers'],
  body:`<p>When primary teeth no longer meet the needs of a growing child, they are lost and replaced by permanent teeth, which are larger, stronger and more numerous.</p>
<p>The shedding of the primary teeth takes place between about ages 5 and 12. During this ${T('mixed dentition')} the child has some primary teeth and some permanent teeth.</p>
<p>The model shows a typical 8-year-old: permanent incisors and first molars (labeled with numbers) alongside primary canines and molars (labeled with letters).</p>`,
  check:{q:'The mixed dentition period usually falls between what ages?',a:'About 5 and 12',d:['Birth and 2','About 2 and 5','About 12 and 18'],why:'Primary teeth are shed between roughly 5 and 12 years of age, and during that time both sets are in the mouth.'}},
 {id:'permanent',sec:'Dentition and numbering',title:'Permanent dentition',
  scene:{scene:'arch',set:'perm',arches:'both',color:'type',labels:true,system:'uni',cam:'front'},
  controls:['arches','numbers'],
  body:`<p>The ${T('permanent dentition')} period begins when the last primary tooth is shed, after about age 12, and includes the eruption of all 32 permanent teeth.</p>
<p>By the time puberty has passed, the jaws have nearly finished growing.</p>
<p>Each permanent quadrant holds 8 teeth: central incisor, lateral incisor, canine, first premolar, second premolar, first molar, second molar and third molar.</p>`,
  check:{q:'How many teeth are in the complete permanent dentition?',a:'32',d:['20','28','24'],why:'4 quadrants × 8 teeth = 32, including the four third molars.'}},
 {id:'universal',sec:'Dentition and numbering',title:'Universal National System',
  scene:{scene:'arch',set:'perm',arches:'both',color:'none',labels:true,system:'uni',cam:'front'},
  controls:['dent2','arches'],
  body:`<p>${T('Numbering systems')} are a simplified way to identify teeth for charting and records. The chapter covers three.</p>
<p>The ${T('Universal National System')} is approved by the American Dental Association and used throughout the United States. Permanent teeth are numbered 1 to 32:</p>
<ol><li>Start with the maxillary right third molar, tooth #1.</li><li>Work around the upper arch to the maxillary left third molar, #16.</li><li>Drop to the mandibular left third molar, #17.</li><li>Work around the lower arch to the mandibular right third molar, #32.</li></ol>
<p>Primary teeth follow the same path using letters: A (maxillary right second molar) through J, then K (mandibular left second molar) through T.</p>`,
  check:{q:'In the Universal system, tooth #17 is the…',a:'Mandibular left third molar',d:['Maxillary left third molar','Mandibular right third molar','Mandibular left second molar'],why:'#16 is the last upper tooth (maxillary left third molar). The count drops straight down to the lower left third molar, #17.'}},
 {id:'fdi',sec:'Dentition and numbering',title:'ISO/FDI System',
  scene:{scene:'arch',set:'perm',arches:'both',color:'quad',labels:true,system:'fdi',midline:true,cam:'front'},
  controls:['dent2','arches'],
  body:`<p>The ${T('International Standards Organization (ISO) System')}, based on the ${T('Fédération Dentaire Internationale (FDI) System')}, gives every tooth a two-digit number. The first digit is the quadrant; the second is the tooth, counted from the midline back.</p>
<div class="table-wrap"><table><thead><tr><th>Quadrant</th><th>Permanent</th><th>Primary</th></tr></thead><tbody>
<tr><td>Maxillary right</td><td class="m">1 (11–18)</td><td class="m">5 (51–55)</td></tr>
<tr><td>Maxillary left</td><td class="m">2 (21–28)</td><td class="m">6 (61–65)</td></tr>
<tr><td>Mandibular left</td><td class="m">3 (31–38)</td><td class="m">7 (71–75)</td></tr>

  genial:{name:'Genial tubercles',grp:'Bones and joint',layer:['mandible'],mesh:'mandible',pin:'genial',cam:'kInside',def:'Small bumps on the inside of the chin (also called mental spines) where tongue and floor-of-mouth muscles attach.',da:null},
  mylohyoid:{name:'Mylohyoid line',grp:'Bones and joint',layer:['mandible'],mesh:'mandible',pin:'mylohyoid',cam:'kInside',def:'A ridge on the inside of the body where the mylohyoid muscle, the floor of the mouth, attaches.',da:'It limits how deep a lower lingual sensor or impression tray can sit.'},
  retromolar:{name:'Retromolar area',grp:'Bones and joint',layer:['mandible'],mesh:'mandible',pin:'retromolar',def:'The area just behind the last mandibular molar.',da:'A landmark for the IA block and for impressions of the lower arch.'},
  sinus:{name:'Maxillary sinus',grp:'Bones and joint',layer:['maxilla','sinus'],ghost:true,mesh:'sinus',pin:'sinus',def:'The largest paranasal sinus: an air space in the maxilla above the maxillary posterior teeth.',da:'Posterior roots can sit against or inside the sinus. A sinus infection can feel like an upper toothache, and an upper molar extraction can open into the sinus.'},
  fossa:{name:'Glenoid (mandibular) fossa',grp:'Bones and joint',layer:['tmj','mandible'],mesh:'fossa',pin:'fossa',cam:'kTMJ',def:'The hollow in the temporal bone where the condyle rests when the mouth is closed.',da:null},
  eminence:{name:'Articular eminence',grp:'Bones and joint',layer:['tmj','mandible'],mesh:'fossa',pin:'eminence',cam:'kTMJ',def:'The rounded ridge in front of the fossa. When the mouth opens wide the condyle glides forward onto it.',da:null},
  disc:{name:'Articular disc (meniscus)',grp:'Bones and joint',layer:['tmj','mandible'],mesh:'disc',pin:'disc',cam:'kTMJ',def:'A cushion between the condyle and the fossa that moves forward with the condyle.',da:'A disc that slips out of position is a common cause of TMJ clicking.'},
  vestibule:{name:'Vestibule',grp:'Oral cavity',layer:['palate','tongue','floor'],pin:'vestibule',def:'The space between the teeth and the inner lining of the lips and cheeks.',da:'Cotton rolls for isolation go here.'},
  proper:{name:'Oral cavity proper',grp:'Oral cavity',layer:['palate','tongue','floor'],pin:'proper',def:'The space on the tongue side, inside the upper and lower dental arches.',da:null},
  hardPalate:{name:'Hard palate',grp:'Oral cavity',layer:['palate'],mesh:'palate',pin:'hardPalate',cam:'kPalate',def:'The bony front part of the roof of the mouth, covered with masticatory mucosa.',da:null},
  rugae:{name:'Palatine rugae',grp:'Oral cavity',layer:['palate'],mesh:'palate',pin:'rugae',cam:'kPalate',def:'Irregular ridges in the palatal mucosa just behind the maxillary central incisors.',da:null},
  papilla:{name:'Incisive papilla',grp:'Oral cavity',layer:['palate'],mesh:'palate',pin:'papilla',cam:'kPalate',def:'A pear-shaped pad of tissue right behind the maxillary central incisors, over the incisive foramen.',da:'The landmark for the nasopalatine injection.'},
  raphe:{name:'Median palatine raphe',grp:'Oral cavity',layer:['palate'],mesh:'palate',pin:'raphe',cam:'kPalate',def:'The ridge running back along the midline of the palate.',da:null},
  gpForamen:{name:'Greater palatine foramen',grp:'Oral cavity',layer:['palate'],mesh:'gpForamen',pin:'gpForamen',cam:'kPalate',def:'The opening in the back of the hard palate, usually across from the maxillary second or third molar. The chapter calls it the posterior palatine foramen.',da:'The landmark for the greater palatine injection.'},
  softPalate:{name:'Soft palate',grp:'Oral cavity',layer:['palate'],mesh:'palate',pin:'softPalate',cam:'kPalate',def:'The flexible back part of the palate. It lifts up and back to block the entrance to the throat during swallowing and speech.',da:'Part of the gag-reflex zone: keep trays and sensors off it.'},
  uvula:{name:'Uvula',grp:'Oral cavity',layer:['palate'],mesh:'uvula',pin:'uvula',cam:'kPalate',def:'The small tag of tissue hanging from the back of the soft palate.',da:'Part of the gag-reflex zone.'},
  tongueDorsum:{name:'Dorsum of the tongue',grp:'Oral cavity',layer:['tongue','floor'],mesh:'tongue',pin:'dorsum',cam:'kTongue',def:'The top of the tongue, covered with papillae: gray, thread-like filiform papillae and bright red, round fungiform papillae. The median sulcus runs down the middle.',da:'Covered with masticatory mucosa. You retract it with the mouth mirror for lingual access.'},
  tongueVentral:{name:'Ventral surface of the tongue',grp:'Oral cavity',layer:['tongue','floor'],mesh:'tongue',pin:'ventral',cam:'kTongue',up:true,def:'The underside of the tongue: thin, smooth, transparent mucosa with lingual veins showing through.',da:'Lining mucosa: delicate and easily injured.'},
  floor:{name:'Floor of the mouth',grp:'Oral cavity',layer:['floor','tongue'],mesh:'floor',pin:'floor',cam:'kTongue',up:true,def:'The tissue under the tongue, inside the mandibular arch.',da:'Saliva pools here. Keep the saliva ejector or a cotton roll under the tongue when working on lower teeth.'},
  lingualFrenum:{name:'Lingual frenum',grp:'Oral cavity',layer:['floor','tongue'],mesh:'lingualFrenum',pin:'lingualFrenum',cam:'kTongue',up:true,def:'The thin fold of mucosa from the floor of the mouth to the midline of the underside of the tongue.',da:null},
  caruncle:{name:'Sublingual caruncle',grp:'Oral cavity',layer:['floor','tongue'],mesh:'caruncle',pin:'caruncle',cam:'kTongue',up:true,def:'A small papilla on each side of the lingual frenum, just behind the central incisors. The submandibular (Wharton) and sublingual ducts open here.',da:'Saliva flows in right here; keep evacuation close when working on lower anterior teeth.'},
  sublingualFold:{name:'Sublingual fold',grp:'Oral cavity',layer:['floor','tongue'],mesh:'sublingualFold',pin:'sublingualFold',cam:'kTongue',up:true,def:'A ridge on each side of the floor of the mouth over the sublingual gland; small ducts open along it.',da:null},
  maxLabialFrenum:{name:'Maxillary labial frenum',grp:'Oral cavity',layer:['frena'],mesh:'maxLabialFrenum',pin:'maxLabialFrenum',cam:'kFront',def:'Runs from the mucosa at the midline of the maxillary arch to the midline of the inner upper lip.',da:'Impression trays and dentures need a notch here so they do not pull on it.'},
  mandLabialFrenum:{name:'Mandibular labial frenum',grp:'Oral cavity',layer:['frena'],mesh:'mandLabialFrenum',pin:'mandLabialFrenum',cam:'kFront',def:'Runs from the mucosa at the midline of the mandibular arch to the midline of the inner lower lip.',da:'Impression tray borders must clear it.'},
  buccalFrenum:{name:'Buccal frenum',grp:'Oral cavity',layer:['frena'],mesh:'buccalFrenum',pin:'buccalFrenum',cam:'kFront',def:'In the area of the maxillary first molar, it passes from the mucosa of the arch to the inner surface of the cheek. A similar band sits on the mandibular arch.',da:'Another spot where tray borders and dentures must be relieved.'},
  parotid:{name:'Parotid gland',grp:'Salivary glands',layer:['glands'],mesh:'parotid',pin:'parotid',cam:'kLeft',def:'The largest salivary gland, under the skin just in front of and below each ear.',da:'You can feel it by gently touching the area in front of the ear.'},
  stensen:{name:'Stensen (parotid) duct',grp:'Salivary glands',layer:['glands'],mesh:'stensen',pin:'stensen',cam:'kLeft',def:'Carries saliva from the parotid gland. It opens inside the cheek opposite the maxillary second molar.',da:'Place a cotton roll in the maxillary vestibule by the molars to catch parotid saliva when isolating upper posterior teeth.'},
  submandibular:{name:'Submandibular gland',grp:'Salivary glands',layer:['glands'],mesh:'submandibular',pin:'submandibular',cam:'kLeft',def:'The second largest salivary gland. It lies under the mandible in the submandibular fossa, behind the sublingual gland.',da:null},
  wharton:{name:'Wharton (submandibular) duct',grp:'Salivary glands',layer:['glands','floor'],mesh:'wharton',pin:'wharton',cam:'kLeft',def:'Carries saliva from the submandibular gland forward along the floor of the mouth to the sublingual caruncle.',da:null},
  sublingualGland:{name:'Sublingual gland',grp:'Salivary glands',layer:['glands','floor'],mesh:'sublingualGland',pin:'sublingualGland',cam:'kLeft',def:'The smallest pair, under the tongue in the floor of the mouth. Drains through the sublingual duct at the caruncle.',da:null},
  ganglion:{name:'Trigeminal (semilunar) ganglion',grp:'Nerves',layer:['nerves-max'],mesh:'ganglion',pin:'ganglion',def:'Where the three divisions of the trigeminal nerve meet.',da:null},
  n_asa:{name:'Anterior superior alveolar (ASA)',grp:'Nerves',layer:['nerves-max'],mesh:'n_asa',pin:'n_asa',color:NERVE_C.asa,def:'Supplies the maxillary central, lateral and canine teeth with their PDL and gingiva, and the maxillary sinus.',da:'Numbed by an infiltration near the canine or an infraorbital injection.'},
  n_msa:{name:'Middle superior alveolar (MSA)',grp:'Nerves',layer:['nerves-max'],mesh:'n_msa',pin:'n_msa',color:NERVE_C.msa,def:'Supplies the maxillary first and second premolars, the mesiobuccal root of the first molar, and the maxillary sinus.',da:'Not everyone has an MSA nerve; when it is missing, the ASA and PSA cover its area.'},
  n_psa:{name:'Posterior superior alveolar (PSA)',grp:'Nerves',layer:['nerves-max'],mesh:'n_psa',pin:'n_psa',color:NERVE_C.psa,def:'Supplies the maxillary second and third molars and the rest of the first molar, and branches to the lateral wall of the maxillary sinus.',da:'The PSA injection is given near the maxillary tuberosity.'},
  n_np:{name:'Nasopalatine',grp:'Nerves',layer:['nerves-max','palate'],mesh:'n_np',pin:'n_np',color:NERVE_C.np,def:'Passes through the incisive foramen to supply the palatal tissue behind the maxillary anterior teeth.',da:'Numbed with an injection beside the incisive papilla. Palatal injections are uncomfortable, so the dentist will want topical anesthetic ready.'},
  n_gp:{name:'Anterior (greater) palatine',grp:'Nerves',layer:['nerves-max','palate'],mesh:'n_gp',pin:'n_gp',color:NERVE_C.gp,def:'Comes out of the posterior (greater) palatine foramen and runs forward over the palate to supply its mucoperiosteum.',da:'Numbed with the greater palatine injection near the second and third molars.'},
  n_ia:{name:'Inferior alveolar (IA)',grp:'Nerves',layer:['nerves-mand'],mesh:'n_ia',pin:'n_ia',color:NERVE_C.ia,def:'Enters the mandibular foramen, runs through the mandible and sends small dental branches to the molars and premolars. Its branches include the mylohyoid, mental and incisive nerves.',da:'An IA nerve block numbs every mandibular tooth on that side up to the midline, plus the lower lip and chin.'},
  n_inc:{name:'Incisive',grp:'Nerves',layer:['nerves-mand'],mesh:'n_inc',pin:'n_inc',color:NERVE_C.inc,def:'The IA nerve’s continuation past the mental foramen; supplies the mandibular canine, lateral and central incisors.',da:null},
  n_mental:{name:'Mental',grp:'Nerves',layer:['nerves-mand'],mesh:'n_mental',pin:'n_mental',color:NERVE_C.mental,def:'Exits the mental foramen to supply the chin and the mucous membrane of the lower lip.',da:'Why the lower lip is numb after an IA block. Remind patients, especially children, not to bite it.'},
  n_lingual:{name:'Lingual',grp:'Nerves',layer:['nerves-mand'],mesh:'n_lingual',pin:'n_lingual',color:NERVE_C.lingual,def:'Supplies the front two thirds of the tongue and the lingual mucous membrane and mucoperiosteum.',da:'Usually numbed along with the IA block, so the tongue on that side tingles too.'},
  n_buccal:{name:'Buccal (long buccal)',grp:'Nerves',layer:['nerves-mand'],mesh:'n_buccal',pin:'n_buccal',color:NERVE_C.buccal,def:'Supplies the buccal mucous membrane and the mucoperiosteum beside the maxillary and mandibular molars.',da:'The IA block does not reach it; a separate buccal injection numbs the cheek-side gingiva of lower molars.'},
  a_carotid:{name:'External carotid artery',grp:'Blood supply',layer:['arteries'],mesh:'a_carotid',pin:'a_carotid',def:'The main artery to the face. It branches into the facial, lingual and maxillary arteries.',da:null},
  a_maxillary:{name:'Maxillary artery',grp:'Blood supply',layer:['arteries'],mesh:'a_maxillary',pin:'a_maxillary',def:'Runs deep behind the ramus and gives off the inferior alveolar and superior alveolar arteries.',da:null},
  a_superior:{name:'Anterior, middle and posterior superior alveolar arteries',grp:'Blood supply',layer:['arteries'],mesh:'a_superior',pin:'a_superior',def:'Supply the maxilla and the maxillary teeth. Same names as the nerves they travel with.',da:null},
  a_ia:{name:'Inferior alveolar artery',grp:'Blood supply',layer:['arteries','mandible'],ghost:true,mesh:'a_ia',pin:'a_ia',def:'Supplies the mandible and the mandibular teeth, running with the IA nerve.',da:'Dental anesthetic syringes are aspirating syringes so the dentist can check the needle is not in a vessel.'},
  a_facial:{name:'Facial artery',grp:'Blood supply',layer:['arteries'],mesh:'a_facial',pin:'a_facial',def:'Crosses the lower border of the mandible in front of the masseter and runs up toward the corner of the mouth.',da:'You can feel its pulse where it crosses the mandible.'},
  a_lingual:{name:'Lingual artery',grp:'Blood supply',layer:['arteries'],mesh:'a_lingual',pin:'a_lingual',def:'Supplies the tongue.',da:null},
  masseter:{name:'Masseter',grp:'Muscles',layer:['muscles-mast','mandible','zyg'],mesh:'masseter',pin:'masseter',def:'Runs from the zygomatic arch to the angle and ramus. Raises the mandible, closes the jaws and brings the teeth together.',da:'Ask the patient to clench: you can feel it bulge over the angle.'},
  temporal:{name:'Temporal',grp:'Muscles',layer:['muscles-mast','mandible','zyg'],mesh:'temporal',pin:'temporal',def:'Fans over the side of the skull and narrows to the coronoid process. Raises the mandible, closes the jaw and brings the teeth together.',da:null},
  medialPterygoid:{name:'Internal (medial) pterygoid',grp:'Muscles',layer:['muscles-mast','mandible'],mesh:'medialPterygoid',pin:'medialPterygoid',def:'On the inside of the ramus. Closes the jaw and helps with sideways movement.',da:'The IA injection needle passes close to it.'},
  lateralPterygoid:{name:'External (lateral) pterygoid',grp:'Muscles',layer:['muscles-mast','mandible'],mesh:'lateralPterygoid',pin:'lateralPterygoid',def:'Runs forward from the condyle. Depresses (opens) and protrudes the mandible and moves it side to side.',da:'The only chewing muscle that opens the jaw.'},
  buccinator:{name:'Buccinator',grp:'Muscles',layer:['muscles-face'],mesh:'buccinator',pin:'buccinator',def:'The cheek muscle. Compresses the cheeks and holds food against the teeth.',da:'The muscle you retract with the mirror; the Stensen duct passes through it.'},
  orbicularis:{name:'Orbicularis oris',grp:'Muscles',layer:['muscles-face'],mesh:'orbicularis',pin:'orbicularis',def:'The ring of muscle in the lips. Closes and puckers the lips and helps chewing by pushing food against the teeth.',da:null},
  mentalis:{name:'Mentalis',grp:'Muscles',layer:['muscles-face'],mesh:'mentalis',pin:'mentalis',def:'The chin muscle. Raises and wrinkles the skin of the chin and pushes up the lower lip.',da:'A tense mentalis can make lower anterior sensors and trays harder to place; ask the patient to relax the lip.'},
  zygomaticMajor:{name:'Zygomatic major',grp:'Muscles',layer:['muscles-face'],mesh:'zygomaticMajor',pin:'zygomaticMajor',def:'Draws the corners of the mouth upward and backward, as in laughing.',da:null}
};
