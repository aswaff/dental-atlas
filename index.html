const LESSON3=[
 {id:'skull',sec:'Bones of the head',title:'Bones you work around',
  scene:{scene:'svg',view:'front',layers:['bones'],pins:['b_frontal','b_nasal','b_zygomatic','b_maxilla','b_mandible']},
  controls:['svgview'],
  body:`<p>The slides name five bones a dental assistant should know on sight:</p>
<ul><li>${T('Maxilla')}: the upper jaw, holding the maxillary teeth. It is part of the skull and cannot move.</li>
<li>${T('Mandible')}: the lower jaw, holding the mandibular teeth. It is the only movable bone of the skull.</li>
<li><b>Nasal bones</b>: the bridge of the nose.</li>
<li><b>Zygomatic bone</b>: the cheekbone.</li>
<li><b>Frontal bone</b>: the forehead.</li></ul>
<p class="try"><b>Try it:</b> click a bone on the face to name it, or switch to the side view.</p>`,
  remember:['Maxilla = upper jaw, fixed. Mandible = lower jaw, the only bone that moves.','The zygomatic bone often shows over the root tips on maxillary molar radiographs.'],
  check:{q:'Which bone of the skull can move?',a:'Mandible',d:['Maxilla','Zygomatic bone','Frontal bone'],why:'The maxilla is fused to the rest of the skull. The mandible hinges and glides at the temporomandibular joints.'}},
 {id:'mandible',sec:'Bones of the head',title:'The mandible',
  scene:{scene:'arch',set:'perm',arches:'lower',kit:{layers:['mandible'],gum:false},pins:['condyle','coronoid','notch','ramus','angle','body','mentalForamen','protuberance','alveolarLow'],cam:'kOblique'},
  controls:['ghost'],
  body:`<p>The mandible is the horseshoe-shaped lower jaw. Learn its parts from the chapter’s figure of the mandible:</p>
<ul><li><b>Body</b>: the horizontal part holding the teeth; its lower edge is the <b>base</b>.</li>
<li><b>Alveolar process</b> (alveolar part): the bone around the tooth roots.</li>
<li><b>Ramus</b>: the vertical back part. Its top ends in the <b>coronoid process</b> in front and the <b>condyle</b> (head) behind, with the <b>mandibular notch</b> between them.</li>
<li><b>Angle</b>: where the ramus meets the body.</li>
<li><b>Mental foramen</b>: an opening below the premolars where the mental nerve exits.</li>
<li><b>Mental protuberance</b>: the chin.</li></ul>
<p class="try"><b>Try it:</b> click any part of the bone. <b>See-through bone</b> shows the tooth roots inside.</p>`,
  remember:['Mental foramen = below the premolars. On a periapical radiograph it can look like an abscess at a premolar root tip.','Ramus = where the IA injection is given (on the inside).'],
  check:{q:'The mental foramen is found near the root tips of the…',a:'Mandibular premolars',d:['Mandibular third molars','Mandibular central incisors','Maxillary premolars'],why:'It sits on the outside of the mandible below the premolars, where the mental nerve exits to the chin and lower lip.'}},
 {id:'mandInner',sec:'Bones of the head',title:'Inside the mandible',
  scene:{scene:'arch',set:'perm',arches:'lower',kit:{layers:['mandible'],gum:false},pins:['mandForamen','lingula','mylohyoid','genial','retromolar'],cam:'kInside'},
  controls:['ghost'],
  body:`<p>Turn the mandible to look at its inner (lingual) surface:</p>
<ul><li><b>Mandibular foramen</b>: the opening in the middle of the inner ramus where the inferior alveolar nerve, artery and vein enter the bone.</li>
<li><b>Lingula</b>: the small tongue of bone that guards the foramen.</li>
<li><b>Mylohyoid line</b>: a ridge where the mylohyoid muscle, the floor of the mouth, attaches.</li>
<li><b>Genial tubercles</b> (mental spines): small bumps inside the chin where tongue muscles attach.</li>
<li><b>Retromolar area</b>: just behind the last molar.</li></ul>`,
  remember:['Mandibular foramen = target of the inferior alveolar nerve block (IANB), the most common lower injection.','Dense mandibular bone is why lower molars usually need a block, not an infiltration.'],
  check:{q:'Where does the inferior alveolar nerve enter the mandible?',a:'The mandibular foramen',d:['The mental foramen','The mandibular notch','The coronoid process'],why:'The nerve enters through the mandibular foramen on the inside of the ramus and leaves through the mental foramen as the mental nerve.'}},
 {id:'maxilla',sec:'Bones of the head',title:'Maxilla and alveolar process',
  scene:{scene:'arch',set:'perm',arches:'upper',kit:{layers:['maxilla','zyg'],gum:false,ghost:true},pins:['alveolarUp','crest','tuberosity','zygArch'],cam:'kLeft'},
  controls:['ghost','gum'],
  body:`<p>The ${T('alveolar process')} is the part of the maxilla and mandible that holds the teeth in place.</p>
<ul><li><b>Cortical plate</b> (the chapter also calls it the cribriform plate): the dense outer layer of bone covering the alveolar process. The mandible’s cortical plate is dense with few openings; the maxilla’s is not as dense.</li>
<li>${T('Alveolar crest')}: the highest point of the alveolar ridge. In an unhealthy mouth it can be destroyed.</li>
<li>${T('Alveolar socket')}: the space in the alveolar process where the periodontal ligament holds the root.</li>
<li><b>Maxillary tuberosity</b>: the bulge of bone behind the last maxillary molar.</li></ul>
<p class="try"><b>Try it:</b> the bone is see-through so you can see the roots sitting in their sockets.</p>`,
  remember:['Maxillary bone is porous, so an infiltration beside the tooth usually works. Mandibular bone is dense, so lower molars need a nerve block.','Alveolar crest = what you check for bone loss on bitewings.','Maxillary tuberosity = PSA injection landmark.'],
  check:{q:'Why do mandibular molars usually need a nerve block instead of an infiltration?',a:'The mandible’s cortical plate is dense with few openings',d:['The mandible has no alveolar process','Mandibular molars have no nerve supply','The maxillary sinus blocks the anesthetic'],why:'Anesthetic has to soak through bone to reach the nerve. The maxilla’s thinner cortical plate lets it through; the mandible’s dense plate does not.'}},
 {id:'sinuses',sec:'Bones of the head',title:'Paranasal sinuses',
  scene:{scene:'svg',view:'profile',layers:['sinuses'],pins:['s_frontal','s_ethmoid','s_sphenoid','s_maxillary']},
  controls:[],
  body:`<p>The paranasal sinuses are air spaces in the bones around the nose. There are four pairs:</p>
<div class="table-wrap"><table><thead><tr><th>Sinus</th><th>Location</th><th>Why it matters</th></tr></thead><tbody>
<tr><td class="k"><span class="sw" style="background:#E57373"></span>Maxillary</td><td>In the maxillary bones; the largest sinuses</td><td>Infection can cause pain in the maxillary teeth. Sinusitis brings headache, foul-smelling discharge, fever and weakness. Infection can spread through the nasal cavity to the other sinuses.</td></tr>
<tr><td class="k"><span class="sw" style="background:#7CB8F0"></span>Frontal</td><td>In the frontal bone, in the forehead just above the eyes</td><td></td></tr>
<tr><td class="k"><span class="sw" style="background:#9AD1A8"></span>Ethmoid</td><td>Irregular air cells in the ethmoid bone, separated from the eye socket by very thin bone</td><td></td></tr>
<tr><td class="k"><span class="sw" style="background:#F6B26B"></span>Sphenoid</td><td>In the sphenoid bone, close to the optic nerves</td><td>Infection here can damage vision, the brain or both.</td></tr>
</tbody></table></div>`,
  remember:['Maxillary sinusitis can feel like an aching upper back tooth. If a patient reports upper posterior pain with congestion, pass that on to the dentist.','Four pairs: frontal, ethmoid, sphenoid, maxillary. The maxillary is the largest.'],
  check:{q:'A patient has aching maxillary molars and a stuffy nose. Which sinus is most likely involved?',a:'Maxillary',d:['Frontal','Ethmoid','Sphenoid'],why:'The maxillary sinus sits right above the maxillary posterior teeth, so infection there can feel like a toothache.'}},
 {id:'maxSinus',sec:'Bones of the head',title:'Maxillary sinus and the upper roots',
  scene:{scene:'arch',set:'perm',arches:'upper',kit:{layers:['maxilla','sinus'],gum:false,ghost:true},pins:['sinus','tuberosity'],cam:'kLeft'},
  controls:['ghost'],
  body:`<p>The ${T('maxillary sinus')} is a cavity on each side of the maxilla, above the maxillary posterior teeth.</p>
<p>Sometimes the roots of the upper molars reach up into the sinus, with only a thin layer of bone or sinus lining over them. Turn the model and look at the molar roots poking into the blue sinus floor.</p>`,
  remember:['Upper molar roots can sit inside the sinus floor, so an upper molar extraction can open into the sinus.','On maxillary posterior radiographs the sinus shows as a large dark area above the roots.'],
  check:{q:'The maxillary sinus lies directly above the…',a:'Maxillary posterior teeth',d:['Maxillary anterior teeth','Mandibular molars','Nasal bones'],why:'It fills the maxilla above the premolars and molars, which is why their roots can reach it.'}},
 {id:'tmj',sec:'Bones of the head',title:'Temporomandibular joint (TMJ)',
  scene:{scene:'arch',set:'perm',arches:'both',kit:{layers:['mandible','maxilla','zyg','tmj'],gum:false},pins:['condyle','fossa','eminence','disc'],cam:'kTMJ'},
  controls:['tmj'],
  body:`<p>The ${T('temporomandibular joint')} is where the mandible meets the skull, just in front of each ear. It is the only movable joint in the head.</p>
<ul><li>The <b>condyle</b> of the mandible rests in the <b>glenoid (mandibular) fossa</b> of the temporal bone.</li>
<li>The <b>articular eminence</b> is the ridge in front of the fossa.</li>
<li>A cushioning <b>meniscus</b> (articular disc) sits between the bones, and a <b>capsular ligament</b> encloses the joint.</li></ul>
<p>The joint works in two actions. Opening slightly is a <b>hinge</b> action: the condyle rotates in the fossa. Opening wide adds a <b>glide</b>: the condyle and disc slide forward onto the eminence. Sliding the mandible forward is <b>protrusion</b>; pulling it back is <b>retrusion</b>.</p>
<p class="try"><b>Try it:</b> use <b>Hinge</b>, <b>Wide open</b> and <b>Protrude</b> and watch the condyle.</p>`,
  remember:['Hinge first, then glide.','TMJ palpation: fingertips just in front of both tragi while the patient opens and closes. Note clicking, popping, pain or uneven movement for the dentist.'],
  check:{q:'When the patient opens very wide, the condyle…',a:'Glides forward onto the articular eminence',d:['Only rotates in the fossa','Moves backward behind the ear','Stays completely still'],why:'Small openings are a hinge (rotation). Wide opening adds a glide, where the condyle and disc slide forward onto the eminence.'}},
 {id:'mastication',sec:'Muscles, blood and lymph',title:'Muscles of mastication',
  scene:{scene:'arch',set:'perm',arches:'both',kit:{layers:['mandible','maxilla','zyg','muscles-mast'],gum:false},pins:['masseter','temporal','medialPterygoid','lateralPterygoid'],cam:'kLeft'},
  controls:['tmj','ghost'],
  body:`<p>The muscles of mastication close the jaws, move the mandible forward and back, and shift it side to side. They work with the TMJ.</p>
<div class="table-wrap"><table><thead><tr><th>Muscle</th><th>What it does</th></tr></thead><tbody>
<tr><td class="k">Masseter</td><td>Raises the mandible, closes the jaws and brings the teeth together</td></tr>
<tr><td class="k">Temporal</td><td>Raises the mandible, closes the jaw and brings the teeth together</td></tr>
<tr><td class="k">Internal (medial) pterygoid</td><td>Closes the jaw and helps sideways movement</td></tr>
<tr><td class="k">External (lateral) pterygoid</td><td>Depresses (opens), protrudes and moves the mandible side to side</td></tr>
</tbody></table></div>`,
  remember:['“Lateral lowers”: the external (lateral) pterygoid is the one that opens and protrudes; the others close.','All four are moved by V3, the mandibular division of the trigeminal nerve.'],
  check:{q:'Which muscle depresses and protrudes the mandible?',a:'External (lateral) pterygoid',d:['Masseter','Temporal','Internal (medial) pterygoid'],why:'The lateral pterygoid pulls the condyle forward, opening and protruding the jaw. The masseter, temporal and medial pterygoid close it.'}},
 {id:'expression',sec:'Muscles, blood and lymph',title:'Muscles of facial expression',
  scene:{scene:'arch',set:'perm',arches:'both',kit:{layers:['mandible','maxilla','muscles-face'],gum:true},pins:['buccinator','orbicularis','mentalis','zygomaticMajor'],cam:'kOblique'},
  controls:[],
  body:`<p>The chapter lists four muscles of facial expression that affect your work in the mouth:</p>
<div class="table-wrap"><table><thead><tr><th>Muscle</th><th>What it does</th></tr></thead><tbody>
<tr><td class="k">Buccinator</td><td>Compresses the cheeks and holds food against the teeth</td></tr>
<tr><td class="k">Orbicularis oris</td><td>Closes and puckers the lips; pushes food against the teeth</td></tr>
<tr><td class="k">Mentalis</td><td>Raises and wrinkles the skin of the chin; pushes up the lower lip</td></tr>
<tr><td class="k">Zygomatic major</td><td>Draws the corners of the mouth up and back, as in laughing</td></tr>
</tbody></table></div>`,
  remember:['Buccinator = the cheek muscle you retract with the mirror.','A tense mentalis or orbicularis oris makes lower anterior sensors and trays harder to place; ask the patient to relax their lips.'],
  check:{q:'Which muscle holds food against the teeth from the cheek side?',a:'Buccinator',d:['Masseter','Mentalis','Zygomatic major'],why:'The buccinator forms the cheek wall and presses food back onto the chewing surfaces.'}},
 {id:'blood',sec:'Muscles, blood and lymph',title:'Blood supply',
  scene:{scene:'arch',set:'perm',arches:'both',kit:{layers:['arteries','mandible','maxilla'],gum:false,ghost:true},pins:['a_carotid','a_maxillary','a_superior','a_ia','a_facial','a_lingual'],cam:'kLeft'},
  controls:['ghost'],
  body:`<p><b>Arteries</b> carry oxygenated blood away from the heart with a pulsing motion. <b>Veins</b> carry blood back to the heart.</p>
<div class="table-wrap"><table><thead><tr><th>Structure</th><th>Blood supply</th></tr></thead><tbody>
<tr><td>Muscles of facial expression</td><td>Branches of the maxillary, facial and ophthalmic arteries</td></tr>
<tr><td>Maxilla and maxillary teeth</td><td>Anterior, middle and posterior superior alveolar arteries</td></tr>
<tr><td>Mandible and mandibular teeth</td><td>Inferior alveolar arteries</td></tr>
<tr><td>Tongue</td><td>Lingual artery</td></tr>
<tr><td>Muscles of mastication</td><td>Facial arteries</td></tr>
</tbody></table></div>
<p>Veins with matching names drain the same areas, including the facial, lingual and inferior alveolar veins and the pterygoid plexus behind the maxilla.</p>`,
  remember:['The arteries to the teeth have the same names as the nerves: ASA, MSA, PSA and inferior alveolar. Learn one list, get both.','Dental anesthetic syringes are aspirating syringes so the dentist can check the needle is not in a blood vessel.'],
  check:{q:'Which arteries supply the mandibular teeth?',a:'Inferior alveolar arteries',d:['Posterior superior alveolar arteries','Lingual arteries','Facial arteries'],why:'The inferior alveolar artery travels with the IA nerve through the mandibular canal.'}},
 {id:'lymph',sec:'Muscles, blood and lymph',title:'Lymph nodes',
  scene:{scene:'svg',view:'profile',layers:['nodes'],pins:['n_pre','n_post','n_occ','n_subm','n_subment','n_cerv']},
  controls:[],
  body:`<p><b>Lymph nodes</b> are small round or oval structures along the lymph vessels. With some infections and immune disorders they become swollen and tender.</p>
<p>During the examination the dentist feels (palpates) the nodes of the neck for swelling or tenderness. The main groups of the head and neck are shown on the diagram.</p>`,
  remember:['Swollen, tender nodes under the jaw often point to a tooth or gum infection.','Nodes are checked on both sides and compared; record what the dentist reports.'],
  check:{q:'Why does the dentist palpate the lymph nodes of the neck?',a:'To detect swelling or tenderness',d:['To find the mandibular foramen','To check the patient’s pulse','To locate the salivary ducts'],why:'Infection and some immune disorders make nodes swollen and tender, so the exam feels for those signs.'}},
 {id:'trigeminal',sec:'Nerve supply',title:'The trigeminal nerve',
  scene:{scene:'svg',view:'profile',layers:['nerves'],pins:['v1','v2','v3']},
  controls:['svgview'],
  body:`<p>The ${T('trigeminal nerve')} is the fifth of the 12 cranial nerves (cranial nerve V) and the largest. It carries sensation from the face and powers biting and chewing. It is the main nerve supply of the mouth. (${T('Innervation')} is another word for nerve supply.)</p>
<p>It divides into three branches:</p>
<ul><li><b>V1 · Ophthalmic</b>: the forehead and eye area.</li>
<li><b>V2 · Maxillary</b>: the maxilla and all upper teeth.</li>
<li><b>V3 · Mandibular</b>: all lower teeth and half the tongue, plus the chewing muscles.</li></ul>`,
  remember:['Cranial nerve five = “V” = the dental nerve.','V2 upper teeth, V3 lower teeth. V1 has no teeth.'],
  check:{q:'Which trigeminal branch supplies all the mandibular teeth?',a:'V3, the mandibular branch',d:['V1, the ophthalmic branch','V2, the maxillary branch','The facial nerve'],why:'V3 supplies the lower teeth, half the tongue and the muscles of mastication.'}},
 {id:'maxNerves',sec:'Nerve supply',title:'Maxillary innervation',
  scene:{scene:'arch',set:'perm',arches:'upper',kit:{layers:['nerves-max','maxilla','palate'],gum:false,ghost:true,map:'nerve'},pins:['n_asa','n_msa','n_psa','n_np','n_gp'],cam:'kUpperOblique'},
  controls:['map','ghost','gum'],
  body:`<p>The maxillary division (V2) supplies the maxillary teeth, periosteum, mucous membrane, maxillary sinuses and soft palate. The ${T('mucous membrane')} is the tissue lining the inside of the mouth. It branches into:</p>
<ul><li><b style="color:${NERVE_C.asa}">Anterior superior alveolar (ASA)</b>: central, lateral and canine teeth, their PDL and gingivae, and the sinus.</li>
<li><b style="color:${NERVE_C.msa}">Middle superior alveolar (MSA)</b>: first and second premolars and the mesiobuccal root of the first molar, and the sinus.</li>
<li><b style="color:${NERVE_C.psa}">Posterior superior alveolar (PSA)</b>: the other roots of the first molar, plus the second and third molars, and the sinus wall.</li>
<li><b style="color:${NERVE_C.np}">Nasopalatine</b>: through the incisive foramen to the palatal tissue behind the anterior teeth.</li>
<li><b style="color:${NERVE_C.gp}">Anterior palatine</b> (greater palatine): through the posterior palatine foramen and forward over the palate to the ${T('mucoperiosteum')} (periosteum with a mucous membrane surface).</li></ul>
<p class="try"><b>Try it:</b> the teeth, gingiva and palate are colored by the nerve that supplies them. Notice the first molar is split between MSA and PSA.</p>`,
  remember:['Upper nerves run A-M-P, front to back: Anterior (incisors, canine), Middle (premolars), Posterior (molars).','The palate needs its own injections: nasopalatine in front, greater palatine in back.'],
  check:{q:'Which nerve supplies the maxillary premolars?',a:'Middle superior alveolar',d:['Anterior superior alveolar','Posterior superior alveolar','Nasopalatine'],why:'The MSA supplies the first and second premolars and the mesiobuccal root of the first molar.'}},
 {id:'mandNerves',sec:'Nerve supply',title:'Mandibular innervation',
  scene:{scene:'arch',set:'perm',arches:'lower',kit:{layers:['nerves-mand','mandible','tongue','floor'],gum:false,ghost:true,map:'nerve'},pins:['n_ia','n_inc','n_mental','n_lingual','n_buccal'],cam:'kLeft'},
  controls:['map','ghost','gum'],
  body:`<p>The mandibular division (V3) divides into the <b>buccal</b>, <b>lingual</b> and <b>inferior alveolar</b> nerves.</p>
<ul><li><b style="color:${NERVE_C.buccal}">Buccal</b>: the buccal mucous membrane and mucoperiosteum of the maxillary and mandibular molars.</li>
<li><b style="color:${NERVE_C.lingual}">Lingual</b>: the front two thirds of the tongue and the lingual mucous membrane and mucoperiosteum.</li>
<li><b style="color:${NERVE_C.ia}">Inferior alveolar</b>: enters the mandibular foramen and subdivides into:
<ul><li><b>Mylohyoid</b>: the mylohyoid muscle and the front of the digastric muscle.</li>
<li><b>Small dental nerves</b>: the molars and premolars, alveolar process and periosteum.</li>
<li><b style="color:${NERVE_C.mental}">Mental</b>: exits the mental foramen to the chin and lower lip.</li>
<li><b style="color:${NERVE_C.inc}">Incisive</b>: continues forward to the canine, lateral and central incisors.</li></ul></li></ul>`,
  remember:['IANB (inferior alveolar nerve block) numbs all mandibular teeth on that side to the midline, plus the lower lip and chin through the mental nerve.','The lingual nerve is usually numbed with it: the tongue tingles on that side.','The buccal gingiva of lower molars needs a separate buccal injection.'],
  check:{q:'After an inferior alveolar nerve block, why is the patient’s lower lip numb?',a:'The mental nerve is a branch of the inferior alveolar nerve',d:['The lingual nerve supplies the lip','The buccal nerve supplies the lip','The anesthetic spread to V2'],why:'The IA nerve continues through the mandible and exits the mental foramen as the mental nerve, which supplies the chin and lower lip.'}},
 {id:'anesthesia',sec:'Nerve supply',title:'Anesthesia map',
  scene:{scene:'arch',set:'perm',arches:'both',jaw:'wide',kit:{layers:['palate','floor','tongue'],gum:true,map:'nerve'},pins:[],cam:'kMouth'},
  controls:['arches','map','tmj'],
  body:`<p>Putting it together: when the dentist names an injection, you should know what it numbs, so you can set up and talk the patient through it.</p>
<div class="table-wrap"><table><thead><tr><th>Injection</th><th>What goes numb</th></tr></thead><tbody>
<tr><td class="k" style="color:${NERVE_C.ia}">Inferior alveolar (IANB)</td><td>All mandibular teeth on that side to the midline; lower lip and chin (mental)</td></tr>
<tr><td class="k" style="color:${NERVE_C.lingual}">Lingual</td><td>Front two thirds of the tongue, lingual gingiva (usually with the IANB)</td></tr>
<tr><td class="k" style="color:${NERVE_C.buccal}">Buccal</td><td>Buccal gingiva of the mandibular molars</td></tr>
<tr><td class="k" style="color:${NERVE_C.mental}">Mental</td><td>Lower lip, chin and facial gingiva of the lower front teeth</td></tr>
<tr><td class="k" style="color:${NERVE_C.psa}">PSA</td><td>Maxillary molars (except, in some people, the first molar’s mesiobuccal root)</td></tr>
<tr><td class="k" style="color:${NERVE_C.msa}">MSA</td><td>Maxillary premolars and the first molar’s mesiobuccal root</td></tr>
<tr><td class="k" style="color:${NERVE_C.asa}">ASA</td><td>Maxillary central, lateral and canine</td></tr>
<tr><td class="k" style="color:${NERVE_C.np}">Nasopalatine</td><td>Palatal tissue behind the maxillary anterior teeth</td></tr>
<tr><td class="k" style="color:${NERVE_C.gp}">Greater palatine</td><td>Palatal tissue behind the canines to the back of the hard palate</td></tr>
</tbody></table></div>
<p class="aka small">Injection names follow standard dental anesthesia terms; the chapter itself names the nerves.</p>`,
  remember:['Lower teeth: one block (IANB) does the whole side. Upper teeth: separate injections by region, A-M-P.','Palatal tissue always needs its own injection.'],
  check:{q:'The dentist gives an IANB on the patient’s right. What will NOT be numb?',a:'The right maxillary molars',d:['The right mandibular central incisor','The right side of the lower lip','The right mandibular first molar'],why:'The IANB covers the mandibular teeth on that side to the midline and, through the mental nerve, the lip and chin. Maxillary teeth are supplied by V2.'}},
 {id:'regions',sec:'Landmarks of the face',title:'Regions of the face',
  scene:{scene:'svg',view:'front',layers:['regions'],pins:[]},
  controls:[],
  body:`<p>Before advanced procedures such as exposing radiographs or assisting intraorally, you need the terms for the face. The <b>face</b> is the part of the head visible from the front, in front of the ears, between the hairline and the chin.</p>
<p>It divides into nine regions:</p>
<ol><li>Forehead, from the eyebrows to the hairline</li><li>Temples, the temporal area behind the eyes</li><li>Orbital area, holding the eye and covered by the eyelids</li><li>External nose</li><li>Zygomatic (malar) area, the prominence of the cheek</li><li>Mouth and lips</li><li>Cheeks</li><li>Chin</li><li>External ear</li></ol>
<p class="try"><b>Try it:</b> click a colored region to name it.</p>`,
  remember:['Use region names when the dentist dictates where a lesion or swelling is.'],
  check:{q:'The zygomatic (malar) region is…',a:'The prominence of the cheek',d:['The area behind the eyes','The chin','The area around the ear'],why:'The zygomatic region lies over the cheekbone. The temples are behind the eyes.'}},
 {id:'features',sec:'Landmarks of the face',title:'Features of the face',
  scene:{scene:'svg',view:'front',layers:['landmarks'],pins:['outerCanthus','innerCanthus','ala','philtrum','nasion','glabella','root','mentalProt','zygArchF','angleMand']},
  controls:['svgview'],
  body:`<p>A dental assistant should be able to identify these landmarks:</p>
<ol><li><b>Outer ${T('canthus')}</b>: fold of tissue at the outer corner of the eyelids.</li>
<li><b>Inner canthus</b>: fold at the inner corner of the eyelids.</li>
<li><b>${T('Ala')} of the nose</b>: the winglike tip on the outer side of each nostril.</li>
<li><b>${T('Philtrum')}</b>: the rectangular area between the two ridges running from under the nose to the middle of the upper lip.</li>
<li><b>${T('Tragus')}</b>: the cartilage flap in front of the ear opening (see the side view).</li>
<li><b>${T('Nasion')}</b>: the midpoint between the eyes just below the eyebrows.</li>
<li><b>${T('Glabella')}</b>: the smooth surface of the frontal bone just above the root of the nose.</li>
<li><b>Root</b>: the bridge of the nose.</li>
<li><b>Septum</b>: the tissue dividing the nasal cavity into two nasal fossae.</li>
<li><b>Anterior naris</b>: the nostril.</li>
<li><b>Mental protuberance</b>: the part of the mandible that forms the chin.</li>
<li><b>Angle of the mandible</b>: the lower back corner of the ramus.</li>
<li><b>Zygomatic arch</b>: the prominence of the cheek.</li></ol>`,
  remember:['Ala and tragus are the two you will use most: they set head position for radiographs.'],
  check:{q:'The philtrum is…',a:'The area between the two ridges from under the nose to the upper lip',d:['The fold at the corner of the eye','The winglike tip of the nostril','The flap in front of the ear'],why:'The philtrum is the groove above the upper lip. The canthus is the eye corner, the ala is the nostril wing and the tragus is the ear flap.'}},
 {id:'lines',sec:'Landmarks of the face',title:'Landmarks you will use chairside',
  scene:{scene:'svg',view:'profile',layers:['landmarks','lines','tmj'],pins:['l_ala','l_comm','tmjSpot','angleMand']},
  controls:[],
  body:`<p>Several facial landmarks come straight into daily work:</p>
<ul><li><b>Ala–tragus line</b> (blue): for maxillary radiographs taken with the bisecting technique, the patient’s head is positioned so this line is parallel to the floor.</li>
<li><b>Tragus–corner of the mouth line</b> (red): for mandibular bisecting radiographs, this line is positioned parallel to the floor.</li>
<li><b>TMJ</b>: palpated just in front of the tragus.</li>
<li><b>Angle of the mandible</b>: the submandibular nodes and gland sit just in front of and under it.</li></ul>
<p class="aka small">Radiograph positioning is covered in detail later in your program; these lines are the standard landmarks.</p>`,
  remember:['Upper films: ala to tragus. Lower films: corner of the mouth to tragus.','TMJ: in front of the tragus.'],
  check:{q:'For maxillary bisecting radiographs, which line is positioned parallel to the floor?',a:'Ala–tragus line',d:['Tragus–corner of the mouth line','Nasion–glabella line','Canthus–tragus line'],why:'The ala–tragus line is used for maxillary views; the tragus–corner of the mouth line is used for mandibular views.'}},
 {id:'oral',sec:'The oral cavity',title:'Oral cavity',
  scene:{scene:'arch',set:'perm',arches:'both',jaw:'wide',kit:{layers:['palate','tongue','floor','frena'],gum:true},pins:['vestibule','proper'],cam:'kMouth'},
  controls:['tmj'],
  body:`<p>The whole oral cavity is lined with <b>mucous membrane</b>, moist tissue adapted to the area it covers. The slides list the structures to know: upper and lower lips, labial and lingual frena, tongue, cheeks, uvula, hard and soft palates, vestibules and gingivae.</p>
<p>The oral cavity has two areas:</p>
<ul><li>${T('Vestibule')}: the space between the teeth and the inner lining of the lips and cheeks.</li>
<li><b>Oral cavity proper</b>: the space on the tongue side, within the upper and lower arches.</li></ul>`,
  remember:['Cotton rolls for isolation go in the vestibule.','Mirror and suction positions are described by these areas: facial (vestibule) or lingual (oral cavity proper).'],
  check:{q:'The space between the teeth and the inside of the cheeks is the…',a:'Vestibule',d:['Oral cavity proper','Floor of the mouth','Sulcus'],why:'The vestibule lies outside the arches; the oral cavity proper lies inside them, on the tongue side.'}},
 {id:'tongue',sec:'The oral cavity',title:'The tongue',
  scene:{scene:'arch',set:'perm',arches:'lower',tongueUp:false,kit:{layers:['tongue','floor','frena'],gum:true},pins:['dorsum','sulcusT','ventral','lingualFrenum','caruncle'],cam:'kTongue'},
  controls:['tongue'],
  body:`<p>The tongue is mostly muscle, covered on top by a thick mucous membrane with thousands of tiny <b>${T('papillae')}</b>, which hold the sensory organs and nerves for taste and touch. A healthy tongue is pinkish-white and velvety smooth.</p>
<ul><li><b>Body</b>: the front two thirds, in the oral cavity. The <b>root</b> is the back part that turns down toward the pharynx.</li>
<li><b>Dorsum</b>: the top and back surfaces, with <b>filiform</b> papillae (gray, thread-like) and <b>fungiform</b> papillae (bright red, round). The <b>median sulcus</b> runs down the middle.</li>
<li><b>Sublingual (ventral) surface</b>: thin, smooth, transparent mucosa over visible lingual veins, with the <b>lingual frenum</b> in the middle, the <b>sublingual caruncles</b> on either side of it, and the <b>fimbriated folds</b> farther out.</li></ul>
<p>The tongue does five jobs: speaking, positioning food, tasting and touch, swallowing, and cleansing the mouth.</p>
<p class="try"><b>Try it:</b> press <b>Lift tongue</b> to see the underside and the floor of the mouth.</p>`,
  remember:['Saliva from the submandibular and sublingual glands enters at the caruncles under the tongue, so saliva pools there.','The tongue is your biggest obstacle for lower lingual access; retract it with the mirror.'],
  check:{q:'The front two thirds of the tongue is called the…',a:'Body',d:['Root','Dorsum','Frenum'],why:'The body is the front two thirds in the mouth; the root is the back part turning down to the throat. The dorsum is the top surface.'}},
 {id:'frena',sec:'The oral cavity',title:'Frena',
  scene:{scene:'arch',set:'perm',arches:'both',jaw:'wide',kit:{layers:['frena','palate','tongue','floor'],gum:true},pins:['maxLabialFrenum','mandLabialFrenum','buccalFrenum'],cam:'kFront'},
  controls:['tmj'],
  body:`<p>A ${T('frenum')} is a narrow band of tissue connecting two structures.</p>
<ul><li><b>Maxillary labial frenum</b>: from the mucosa at the midline of the maxillary arch to the midline of the inner upper lip.</li>
<li><b>Mandibular labial frenum</b>: the same on the lower arch and lower lip.</li>
<li><b>Buccal frenum</b>: in the area of the maxillary first molar, from the mucosa of the arch to the inner cheek.</li>
<li><b>Lingual frenum</b>: from the floor of the mouth to the underside of the tongue.</li></ul>`,
  remember:['Impression trays, dentures and wax borders must clear every frenum. Watch for them when seating a tray.'],
  check:{q:'The buccal frenum on the maxillary arch is near the…',a:'Maxillary first molar',d:['Maxillary central incisors','Maxillary third molar','Incisive papilla'],why:'The chapter places the maxillary buccal frenum in the area of the first permanent molar.'}},
 {id:'glands',sec:'The oral cavity',title:'Salivary glands',
  scene:{scene:'arch',set:'perm',arches:'both',kit:{layers:['glands','mandible','maxilla','floor','tongue'],gum:true,ghost:true},pins:['parotid','stensen','submandibular','wharton','sublingualGland'],cam:'kGlands'},
  controls:['ghost'],
  body:`<p>The salivary glands make saliva, which lubricates and cleans the mouth and helps digestion. The nervous system controls them. Disease can make them enlarged, tender or firm, and some medications or diseases decrease or increase saliva.</p>
<div class="table-wrap"><table><thead><tr><th>Gland</th><th>Location</th><th>Duct</th></tr></thead><tbody>
<tr><td class="k">Parotid</td><td>The largest; under the skin just in front of and below each ear</td><td><b>Stensen duct</b>, in the cheek opposite the maxillary second molar</td></tr>
<tr><td class="k">Submandibular</td><td>Second largest; under the mandible in the submandibular fossa, behind the sublingual gland</td><td><b>Wharton duct</b>, at the sublingual caruncle</td></tr>
<tr><td class="k">Sublingual</td><td>Under the tongue on each side</td><td><b>Sublingual duct</b>, through the sublingual caruncle</td></tr>
</tbody></table></div>`,
  remember:['Stensen = cheek, opposite the upper second molar. Place a cotton roll in the maxillary vestibule by the molars to catch it.','Wharton and sublingual ducts = under the tongue. Place a cotton roll or saliva ejector there for lower work.','Patients on many medications may have a dry mouth.'],
  check:{q:'Where does the Stensen duct open?',a:'In the cheek opposite the maxillary second molar',d:['At the sublingual caruncle','Along the sublingual fold','Behind the incisive papilla'],why:'Stensen carries parotid saliva to the cheek beside the upper second molar. The Wharton and sublingual ducts open under the tongue.'}},
 {id:'palate',sec:'The oral cavity',title:'Hard and soft palates',
  scene:{scene:'arch',set:'perm',arches:'upper',kit:{layers:['palate'],gum:true},pins:['papilla','rugae','raphe','hardPalate','softPalate','uvula','gpForamen'],cam:'kPalate'},
  controls:[],
  body:`<p>The hard and soft palates form the roof of the mouth and separate it from the nasal cavity.</p>
<div class="table-wrap"><table><thead><tr><th>Structure</th><th>Location</th></tr></thead><tbody>
<tr><td class="k">Hard palate</td><td>The bony front portion, covered with masticatory mucosa</td></tr>
<tr><td class="k">Palatine rugae</td><td>Irregular ridges or folds in the mucosa just behind the maxillary central incisors</td></tr>
<tr><td class="k">Incisive papilla</td><td>A pear-shaped pad of tissue directly behind the maxillary central incisors</td></tr>
<tr><td class="k">Soft palate</td><td>The flexible back portion; lifts up and back to block the throat during swallowing and speech</td></tr>
<tr><td class="k">Uvula</td><td>Hangs from the back of the soft palate</td></tr>
</tbody></table></div>
<p>The chapter’s photo also shows the <b>median palatine raphe</b> down the midline, and the tonsils and faucial pillars at the back of the throat.</p>`,
  remember:['Incisive papilla = nasopalatine injection landmark.','Greater palatine foramen (across from the 2nd–3rd molars) = greater palatine injection landmark.'],
  check:{q:'The pear-shaped pad of tissue directly behind the maxillary central incisors is the…',a:'Incisive papilla',d:['Palatine rugae','Uvula','Median palatine raphe'],why:'The incisive papilla sits over the incisive foramen. The rugae are the ridges beside and behind it.'}},
 {id:'gag',sec:'The oral cavity',title:'Gag reflex',
  scene:{scene:'arch',set:'perm',arches:'both',jaw:'wide',kit:{layers:['palate','tongue','floor'],gum:true,map:'gag'},pins:['softPalate','uvula'],cam:'kMouthIn'},
  controls:[],
  body:`<p>The ${T('gag reflex')} is an involuntary protective reflex in the back of the mouth. The sensitive area includes the <b>soft palate</b>, the <b>uvula</b>, the surrounding tissue and the <b>back of the tongue</b>, shown in red.</p>
<p>When something touches these tissues it can cause gagging, retching or vomiting. That makes it extremely important not to stimulate the gag reflex when placing impression trays or working in the mouth.</p>`,
  remember:['Keep trays, sensors and instruments off the red zone.','Common chairside habits: don’t overload an impression tray, seat the back of the tray first so material flows forward, and have the patient sit upright, lean slightly forward and breathe through the nose.'],
  check:{q:'Which area is NOT part of the gag-reflex zone?',a:'The incisive papilla',d:['The soft palate','The uvula','The posterior tongue'],why:'The gag reflex is triggered at the back of the mouth: soft palate, uvula, surrounding tissue and posterior tongue. The incisive papilla is right behind the front teeth.'}},
 {id:'mucosa',sec:'The oral cavity',title:'Oral mucosa',
  scene:{scene:'arch',set:'perm',arches:'both',jaw:'wide',kit:{layers:['palate','tongue','floor','frena'],gum:true,map:'mucosa'},pins:[],cam:'kMouth'},
  controls:['tongue'],
  body:`<p>There are two types of oral mucosa:</p>
<ul><li><b>Lining mucosa</b> covers the inside of the cheeks, the vestibule, lips, underside of the tongue and soft palate. It is delicate, thin and easily injured.</li>
<li>${T('Masticatory mucosa')} covers the gingivae, hard palate and top (dorsum) of the tongue. It is firmly attached to bone, very dense, and built to withstand chewing and swallowing.</li></ul>
<p class="try"><b>Try it:</b> <b>Lift tongue</b> to see the lining mucosa underneath.</p>`,
  remember:['Lining mucosa tears easily: moisten dry cotton rolls before removing them, and be careful with instrument tips in the vestibule and floor of the mouth.'],
  check:{q:'Which area is covered with masticatory mucosa?',a:'The hard palate',d:['The soft palate','The inside of the cheeks','The underside of the tongue'],why:'Masticatory mucosa covers the gingivae, hard palate and dorsum of the tongue. The others are lining mucosa.'}},
 {id:'gingiva',sec:'The oral cavity',title:'Gingivae',
  scene:{scene:'arch',set:'perm',arches:'lower',kit:{layers:[],gum:true,map:'gingiva'},pins:['g_free','g_papilla','g_attached','g_mgj','g_alv'],cam:'kGingiva'},
  controls:['arches'],
  body:`<p>The ${T('gingivae')} (singular gingiva), commonly called the gums, are masticatory mucosa covering the alveolar processes and surrounding the necks of the teeth.</p>
<ul><li><b>Epithelial attachment</b>: where healthy gingiva attaches to the enamel just above the neck of the tooth.</li>
<li><b>Free gingiva</b>: the part above the epithelial attachment, from the gingival margin to the base of the sulcus. Normally light pink or coral; pigmentation varies with skin tone.</li>
<li><b>Gingival sulcus</b>: the space between the free gingiva and the tooth.</li>
<li><b>Interdental gingiva</b>: the papilla filling the space between two teeth.</li>
<li><b>Attached gingiva</b>: bound firmly to the bone below the free gingiva.</li>
<li><b>Mucogingival junction</b>: the line where attached gingiva meets the looser, redder <b>alveolar mucosa</b>.</li></ul>
<p class="aka small">The Tooth anatomy tab shows the sulcus and epithelial attachment in cross-section.</p>`,
  remember:['Healthy gingiva is firm, pink or coral, with pointed papillae between the teeth.','Attached gingiva is masticatory mucosa; alveolar mucosa below the mucogingival junction is lining mucosa.'],
  check:{q:'The line where attached gingiva meets alveolar mucosa is the…',a:'Mucogingival junction',d:['Epithelial attachment','Gingival margin','Cementoenamel junction'],why:'The mucogingival junction separates firm attached gingiva from the looser alveolar mucosa below it.'}},

function opCanvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;}
function opBio(g,x,y,r,col){ // simple biohazard trefoil
  g.save();g.translate(x,y);g.strokeStyle=col;g.fillStyle=col;g.lineWidth=r*0.16;
  for(let i=0;i<3;i++){const a=-Math.PI/2+i*2*Math.PI/3;g.beginPath();g.arc(Math.cos(a)*r*0.42,Math.sin(a)*r*0.42,r*0.5,0,Math.PI*2);g.stroke();}
  g.beginPath();g.arc(0,0,r*0.2,0,Math.PI*2);g.stroke();g.restore();
}
function opSprite(text,bg,fg,w,h){
  const tex=opCanvasTex(512,256,(g,W,H)=>{g.fillStyle=bg;const r=40;g.beginPath();g.moveTo(r,8);g.arcTo(W-8,8,W-8,H-8,r);g.arcTo(W-8,H-8,8,H-8,r);g.arcTo(8,H-8,8,8,r);g.arcTo(8,8,W-8,8,r);g.fill();
    g.fillStyle=fg;g.textAlign='center';g.textBaseline='middle';const L=text.split('\n');const fs=L.length>1?78:104;g.font=`700 ${fs}px "Public Sans",system-ui,sans-serif`;L.forEach((s,i)=>g.fillText(s,W/2,H/2+(i-(L.length-1)/2)*fs*1.05));});
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false}));sp.scale.set(w,h,1);sp.renderOrder=12;return sp;
}
function buildOp(){
  const T3=THREE, P=(x,y,z)=>new T3.Vector3(x,y,z);
  const root=new T3.Group(); OP.root=root;
  const mat=(c,o)=>new T3.MeshStandardMaterial(Object.assign({color:c,roughness:0.6,metalness:0},o||{}));
  const steel=()=>mat('#B7C0C8',{metalness:0.55,roughness:0.3});
  let curKey=null, curPart=null, par=root;
  const within=(k,fn)=>{const a=curKey;curKey=k;fn();curKey=a;};
  const ipart=(p,fn)=>{const a=curPart;curPart=p;fn();curPart=a;};
  const inGroup=(g,fn)=>{const a=par;par=g;fn();par=a;};
  function add(geo,m,pos,rot){
    const tag=(curKey||'')+'|'+(curPart||'');
    if(m.userData.tag!==undefined&&m.userData.tag!==tag){m=m.clone();m.userData={};}
    m.userData.tag=tag;
    const me=new T3.Mesh(geo,m);
    if(pos)me.position.copy(pos); if(rot)me.rotation.set(rot[0]||0,rot[1]||0,rot[2]||0);
    par.add(me);
    if(!(m.userData.base&&m.userData.base.isColor))m.userData.base=m.color.clone();
    if(curKey){me.userData.op=curKey;if(curPart)me.userData.ipart=curPart;(OP.parts[curKey]=OP.parts[curKey]||[]).push(me);OP.pick.push(me);}

/* Anchor for a part key: bounding-box center of its meshes (world space) */
function opAnchor(key){
  if(OP.pinAt[key])return OP.pinAt[key].clone();
  let ms;
  if(key&&key.startsWith('ip_')){const ip=key.slice(3);ms=(OP.parts.explorer||[]).filter(m=>m.userData.ipart===ip);}
  else ms=OP.parts[key]||[];
  if(!ms.length)return null;
  const b=new THREE.Box3(); ms.forEach(m=>{m.updateWorldMatrix(true,false);b.expandByObject(m);});
  return b.getCenter(new THREE.Vector3());
}
function opBox(key){const ms=key.startsWith('ip_')?(OP.parts.explorer||[]):(OP.parts[key]||[]);const b=new THREE.Box3();ms.forEach(m=>{m.updateWorldMatrix(true,false);b.expandByObject(m);});return b;}

/* ================= Session 2 · Dental practice, operatory and instruments ================= */
const OPP={
  // operatory
  chair:{v:'room',grp:'Operatory',name:'Patient chair',def:'Reclines and raises to fit the patient and the procedure. It has adjustment controls on both the doctor’s and the assistant’s side, a foot control, and an adjustable headrest.',da:'Seat the patient with the chair low, back upright and the armrest out of the way. Tell the patient before you move the chair, then recline them slowly.'},
  headrest:{v:'room',grp:'Operatory',name:'Headrest',def:'The adjustable support for the back of the patient’s head.',da:'Maxillary work: tip the head back. Mandibular work: chin down, so the lower occlusal plane is about parallel to the floor when the mouth is open.'},
  footctl:{v:'room',grp:'Operatory',name:'Chair foot control',def:'A floor pedal that raises, lowers and reclines the chair so your gloved hands stay clean.',da:'Use your foot, not your gloved hand, to move the chair once you are gowned and gloved for the procedure.'},
  patient:{v:'room',grp:'Operatory',name:'Patient (in position)',def:'The patient wears a bib (patient napkin) and protective eyewear for every procedure.',da:'Supine: head, chest and knees at about the same level. Protective eyewear goes on before the light comes on and stays on until the patient is dismissed.'},
  opstool:{v:'room',grp:'Operatory',name:'Doctor’s chair (operator’s stool)',def:'Adjustable height and lumbar support, on wheels for easy movement. Sits in the operator’s zone (7 to 12 o’clock).',da:'The operator sits with thighs about parallel to the floor and the patient’s mouth at elbow height.'},
  aststool:{v:'room',grp:'Operatory',name:'Assistant’s chair',def:'Always has an arm rest (abdominal bar) and a foot ring so the assistant can transfer instruments and materials steadily and securely.',da:'Sit 4 to 6 inches (10 to 15 cm) higher than the operator, feet on the ring, hips level with the patient’s shoulder, facing the patient’s head.'},
  docunit:{v:'room',grp:'Operatory',name:'Doctor delivery unit',def:'Holds the treatment tray, the chair adjustment controls, an air-water syringe and several handpiece lines so the high-speed and slow-speed handpieces are connected at the same time.',da:'Place barriers on the touchpad, handles and syringe. Run each handpiece line and the syringe for 20 to 30 seconds after every patient to flush the waterlines.'},
  rheostat:{v:'room',grp:'Operatory',name:'Rheostat (handpiece foot control)',def:'The operator’s foot pedal that runs the handpieces and controls their speed.',da:'Keep it where the operator’s foot finds it without looking, and keep cords out of the walkway.'},
  asstunit:{v:'room',grp:'Operatory',name:'Assistant delivery unit',def:'On the assistant’s side, on an adjustable arm: air-water syringe, saliva ejector and high-speed suction (HVE), usually with a chair control pad.',da:'Swing it in close before you sit down so everything is within reach without twisting.'},
  hve:{v:'room',side:'left',grp:'Operatory',name:'High-volume evacuator (HVE)',def:'High-speed suction with a large-bore tip. Removes water, debris and aerosol quickly.',da:'Place the HVE before the doctor starts the handpiece. Anterior teeth: pen or modified pen grasp. Posterior teeth: modified palm (thumb-to-nose) grasp.'},
  se:{v:'room',grp:'Operatory',name:'Saliva ejector (SE)',def:'Low-volume suction with a thin, bendable tip. Removes small amounts of saliva and water.',da:'Bend it to hook over the lower teeth on the side not being worked on. Don’t let the patient close their lips around it, which can pull fluid back into the mouth.'},
  aws:{v:'room',side:'right',grp:'Operatory',name:'Air-water syringe',def:'Delivers air, water or a spray of both to rinse and dry. There is one on each delivery unit.',da:'Test it into the sink or HVE before it enters the mouth, and never aim air at an open wound or into the ear.'},
  light:{v:'room',grp:'Operatory',name:'Overhead light',def:'Can be on a stationary pole, a movable track or attached to the dental unit. Halogen or LED, often with adjustable intensity. The doctor may also wear a headlight.',da:'Turn it on low and aimed at the chest, then bring it up to the mouth so you never shine it in the patient’s eyes. The handles get barriers.'},
  xray:{v:'room',grp:'Operatory',name:'X-ray machine (tube head)',def:'The tube head is on an adjustable arm for easy positioning. Some offices share one unit between two operatories, and some use a handheld tube that moves between rooms.',da:'Lead apron with thyroid collar on the patient. Fold the arm back after use so the tube head doesn’t drift.'},
  xctl:{v:'room',grp:'Operatory',name:'X-ray control panel',def:'Where exposure time is set and the exposure button is pressed. It is always located outside the operatory.',da:'Step out of the room to expose. Never hold the sensor or film in the patient’s mouth yourself.'},
  sink:{v:'room',grp:'Operatory',name:'Operatory sink',def:'Operated by foot to prevent cross-contamination, with a metal mesh strainer so instruments that fall in don’t go down the pipe.',da:'Wash your hands before gloving and after removing gloves. Check the mesh for anything that dropped in.'},
  sinkpedal:{v:'room',grp:'Operatory',name:'Sink foot pedal',def:'Turns the water on and off without touching the faucet.',da:'Hands-free means no contaminated handles. Rinse and dry without touching anything else.'},
  console:{v:'room',grp:'Operatory',name:'Side and back consoles',def:'Cabinets used for storage and organization of dental materials.',da:'Restock at the end of the day and keep drawers closed during treatment so aerosol doesn’t reach clean supplies.'},
  computer:{v:'room',grp:'Operatory',name:'Computer',def:'Used for the patient chart, radiographs, notes and scheduling in the operatory.',da:'Barrier the keyboard and mouse, never type with contaminated gloves, and lock or turn the screen away when you step out (HIPAA).'},
  ioc:{v:'room',grp:'Operatory',name:'Intraoral camera',def:'A small camera wand that shows the inside of the mouth on the monitor.',da:'New barrier sleeve for every patient. Show the patient the image to explain what the doctor sees.'},
  sharps:{v:'room',grp:'Safety and waste',name:'Sharps container',def:'Often in each operatory, sometimes only in a central location such as the sterilization room. All sharps go inside it.',da:'Needles, blades, broken glass, burs and endo files go here. Replace it at the fill line (about three-quarters full) and never reach into it.'},
  trash:{v:'room',grp:'Safety and waste',name:'Regular trash',def:'For items that are not contaminated.',da:'Paper wrappers, packaging and lightly used items that won’t release blood or saliva go here, following your office’s rules.'},
  biotrash:{v:'room',grp:'Safety and waste',name:'Biohazard trash (red bag)',def:'Identified by a red bag. Reserved for trash contaminated with bloodborne pathogens.',da:'Items soaked or caked with blood or saliva go in the red bag. Sharps never do; they go in the sharps container.'},
  n2o:{v:'room',grp:'Safety and waste',name:'N2O delivery system (flowmeter)',def:'Centralized nitrous oxide delivery with separate oxygen and nitrous oxide lines to a flowmeter and reservoir bag. Not all offices have it.',da:'In the U.S., oxygen is green and nitrous oxide is blue. Oxygen always flows with nitrous oxide, and the patient breathes 100% oxygen at the end.'},
  jbox:{v:'room',grp:'Behind the scenes',name:'J-box (junction box)',def:'The box at the base of the chair where the air, water, vacuum and electrical lines come up from the floor to the chair and units.',da:'Know where it is. It is where the chair suction trap and utility connections are checked.'},
  trap:{v:'room',grp:'Behind the scenes',name:'Chair suction trap',def:'A screen that catches solids from the chair’s suction lines before they reach the vacuum.',da:'Clean it on schedule wearing utility gloves, mask and eyewear. Amalgam scrap from the trap is recycled as amalgam waste, not thrown in the trash or red bag.'},
  z_static:{v:'room',grp:'Clock zones',name:'Static zone (12 to 2 o’clock)',def:'Behind the patient’s head. Holds equipment that isn’t passed during the procedure, such as the rear cart.',da:'Nothing is passed through this zone. It is also out of the patient’s view.'},
  z_asst:{v:'room',grp:'Clock zones',name:'Assistant’s zone (2 to 4 o’clock)',def:'Where the dental assistant sits for a right-handed operator.',da:'Your chair is here, close to the patient, facing the patient’s head.'},
  z_trans:{v:'room',grp:'Clock zones',name:'Transfer zone (4 to 7 o’clock)',def:'The area over the patient’s chest, below the chin, where instruments and materials are passed.',da:'Pass instruments here, never over the patient’s face or eyes.'},
  z_oper:{v:'room',grp:'Clock zones',name:'Operator’s zone (7 to 12 o’clock)',def:'Where the dentist or hygienist sits and moves for a right-handed operator.',da:'For a left-handed operator the zones flip: operator 12 to 5, transfer 5 to 8, assistant 8 to 10, static 10 to 12.'},
  // mechanical room
  compressor:{v:'mech',grp:'Mechanical room',name:'Office air compressor',def:'Makes the compressed air that drives the air-driven handpieces and the air-water syringes. The attached dryer removes moisture from the air.',da:'Usually turned on at opening and off at closing. Moisture is drained from the tank on the maker’s schedule.'},
  vacuum:{v:'mech',grp:'Mechanical room',name:'Office vacuum',def:'The pump that creates suction for the HVE and saliva ejectors in every operatory.',da:'If suction is weak in every room, the problem is here or at the vacuum trap. If it is weak in one room, check that chair’s trap.'},
  vactrap:{v:'mech',grp:'Mechanical room',name:'Vacuum suction trap',def:'The central trap on the vacuum line that collects solids from all operatories before they reach the pump.',da:'Change it (where the system uses one) with utility gloves, mask and eyewear, and log the date.'},
  waterfilter:{v:'mech',grp:'Mechanical room',name:'Water line filtration',def:'Filters on the incoming water line that help keep the water delivered to the units clean.',da:'Follow the office’s replacement protocol: change filters on schedule and record the date on the log.'},
  shutoffs:{v:'mech',grp:'Mechanical room',name:'Master shut-off switches (Air, Vac, H2O)',def:'Turn the office air, vacuum and water supply on and off.',da:'Learn where they are on your first day. Turning them on in the morning and off at night is often the assistant’s job.'},
  o2:{v:'mech',grp:'Mechanical room',name:'O2 tanks (oxygen)',def:'Oxygen cylinders, green in the U.S. Supply oxygen for nitrous oxide sedation and emergencies.',da:'Check the tank pressure and keep a full spare. The emergency oxygen tank must always be ready.'},
  n2otank:{v:'mech',grp:'Mechanical room',name:'N2O tanks (nitrous oxide)',def:'Nitrous oxide cylinders, blue in the U.S., feeding the centralized N2O system.',da:'Tanks are chained upright. Know how to switch to the spare.'},
  n2:{v:'mech',grp:'Mechanical room',name:'N2 tanks (nitrogen)',def:'Nitrogen cylinders, black in the U.S. Some offices use nitrogen to drive surgical handpieces or certain equipment.',da:'Never confuse nitrogen with oxygen. Read the label, not just the color.'},
  // instruments
  tray:{v:'inst',grp:'Trays and cassettes',name:'Color-coded tray',def:'Trays and instruments are often color-coded by procedure, treatment room, operator or sequence, and arranged in order of use or by function.',da:'Lay the basic setup left to right in the order it will be used: mirror, explorer, cotton pliers, then probe.'},
  cassette:{v:'inst',grp:'Trays and cassettes',name:'Cassette',def:'A preassembled, perforated tray that is wrapped in paper and color-coded. Instruments stay in it through cleaning and sterilization.',da:'Less handling of sharp, dirty instruments means fewer injuries. Check the color tab to match the cassette to the procedure.'},
  mirror:{v:'inst',grp:'Exam instruments',name:'Mouth mirror',def:'Indirect vision, retraction of the cheek and tongue, reflecting light, and protecting soft tissue.',da:'The first instrument on the tray and the first one handed to the doctor.'},
  explorer:{v:'inst',grp:'Exam instruments',name:'Explorer',def:'A sharp, pointed working end used to detect decay, calculus and rough margins by feel. The shepherd’s hook (#23) is shown.',da:'It is a sharp. Transfer it with the point toward the arch being treated and check the tip for bends.'},
  pliers:{v:'inst',grp:'Exam instruments',name:'Cotton pliers',def:'Tweezer-like pliers used to carry small items such as cotton pellets into and out of the mouth.',da:'Pass them with the beaks closed. Locking cotton pliers hold items without pressure.'},
  probe:{v:'inst',grp:'Exam instruments',name:'Periodontal probe',def:'A blunt, marked working end that measures pocket depth in millimeters.',da:'You record the readings while the doctor or hygienist calls them out, usually six per tooth.'},
  spatula:{v:'inst',grp:'Accessory instruments',name:'Spatula',def:'Mixes cements, liners and impression materials.',da:'Pick the stiffness for the material: flexible for cements on a pad, stiff for thicker pastes.'},
  composite:{v:'inst',grp:'Accessory instruments',name:'Composite placement instrument',def:'Plastic or coated (often gold-colored) instruments that place and shape composite without sticking or scratching it.',da:'Keep them separate from amalgam instruments; metal can discolor composite.'},
  scissors:{v:'inst',grp:'Accessory instruments',name:'Scissors',def:'Crown and bridge scissors trim matrix bands, retraction cord and temporary crowns. Surgical scissors cut tissue and sutures.',da:'Pass them with the blades closed, handles toward the operator.'},
  artic:{v:'inst',grp:'Accessory instruments',name:'Articulating paper holder',def:'Holds articulating paper so the dentist can mark and check the patient’s bite.',da:'Load the paper before the adjustment step so it is ready when the doctor asks “check the bite.”'},
  dappen:{v:'inst',grp:'Accessory instruments',name:'Dappen dish',def:'A small glass or plastic dish that holds small amounts of material, such as bonding agent.',da:'Dispense just before use; many materials evaporate or set in the light.'},
  brush:{v:'inst',grp:'Accessory instruments',name:'Applicators and brushes',def:'Disposable microbrushes and applicators that apply etch, primer, bond, varnish and medicaments.',da:'Single use. Bend the neck to reach the tooth before you dip it.'},
  hs:{v:'inst',grp:'Handpieces',name:'High-speed handpiece (friction grip)',def:'Runs at very high speed to cut enamel and remove decay and old fillings. Holds friction-grip (FG) burs, which have a short smooth shank.',da:'Heat-sterilize after every patient. Run it 20 to 30 seconds to flush the line, and never run it without a bur.'},
  slowspeed:{v:'inst',grp:'Handpieces',name:'Slow-speed handpiece (motor)',def:'The motor that attachments snap onto: the contra-angle (latch type) or the straight nose cone. Used for finishing, polishing, removing soft decay and lab work.',da:'Match the attachment to the bur: latch-type burs go in the contra-angle, long straight burs in the nose cone.'},
  latch:{v:'inst',grp:'Handpieces',name:'Latch-type contra-angle',def:'A slow-speed attachment that holds latch-type (RA) burs with a notch at the end of the shank.',da:'Open the latch door, seat the bur until the notch engages, then close it. Tug gently to check.'},
  straightnose:{v:'inst',grp:'Handpieces',name:'Straight nose cone (twist lock)',def:'A straight slow-speed attachment that holds long HP (straight) burs. Twisting the collar locks the bur.',da:'Mostly for lab work and adjusting appliances or temporaries outside the mouth.'},
  prophy:{v:'inst',grp:'Handpieces',name:'Hygiene (prophy) handpiece',def:'A slow handpiece with no bur lock. A disposable prophy angle with a rubber cup snaps on to polish teeth.',da:'The prophy angle is single use. Load paste into the cup before you pass it.'},
  bur_fg:{v:'inst',grp:'Burs',name:'Friction-grip (FG) bur',def:'Short, smooth shank that is held by friction in the high-speed handpiece. Shown 3× life size.',da:'Diamonds have a colored ring on the neck that shows the grit.'},

  burblock:{v:'inst',grp:'Burs',name:'Bur block',def:'Holds burs by type and shape: round, pear, fissure, inverted cone and flame, cutting and diamond.',da:'Burs are sharps. Use the block, not your fingers, and sterilize burs between patients.'},
  sickle:{v:'inst',grp:'Hygiene instruments',name:'Sickle scaler',def:'A pointed tip and triangular blade for removing supragingival calculus (above the gumline).',da:'Hygiene cassettes are usually arranged mirror, explorer, probe, then scalers and curettes.'},
  curette:{v:'inst',grp:'Hygiene instruments',name:'Curette',def:'A spoon-shaped, rounded toe that can go below the gumline to remove subgingival calculus.',da:'Rounded toe = curette; pointed tip = scaler.'},
  implantprobe:{v:'inst',grp:'Hygiene instruments',name:'Implant probe / scaler',def:'Plastic (or titanium) instruments that won’t scratch the surface of a dental implant.',da:'Never use steel scalers on implants. Set out the implant kit when the chart shows an implant.'},
  cavitron:{v:'inst',grp:'Hygiene instruments',name:'Ultrasonic scaler insert (Cavitron)',def:'Vibrates at ultrasonic speed with a water spray to break up calculus. Tips come in different shapes.',da:'It makes heavy aerosol, so the HVE and full PPE matter. Run water through the handpiece before seating the insert.'}
};
const OP_GROUPS={room:['Operatory','Clock zones','Safety and waste','Behind the scenes'],mech:['Mechanical room'],inst:['Exam instruments','Accessory instruments','Handpieces','Burs','Hygiene instruments','Trays and cassettes']};
const OP_IP={ip_work:{name:'Working end',def:'Accomplishes the instrument’s unique function: blades cut, points probe and explore, nibs condense restorative material.'},ip_shank:{name:'Shank',def:'Connects the working end to the handle. Often angled so the working end can reach the tooth.'},ip_shaft:{name:'Shaft (handle)',def:'The part the user holds. Often serrated for grip, and may carry a color-code ring.'}};
