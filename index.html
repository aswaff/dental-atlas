const RMX=(o)=>Object.assign({scene:'op',view:'room',hl:[],pins:[],cam:'room',chair:'upright',zones:false,patient:true,parts:false,room:'clean',apron:false},o);
const LESSON_W4=[
  /* ---- The dental patient (Ch 11) ---- */
  {id:'w4-record',sec:'The dental patient',title:'The patient record',scene:SV('record',[]),controls:[],
   body:`<p>The ${T('patient record')} is an important ${T('legal document')}. Each patient has their own, and it holds personal and clinical information, radiographs, lab prescriptions and correspondence.</p>
   <p>New patients fill out the printed forms at the first visit. If a patient can’t (a language barrier, can’t read, visually impaired), help them complete the forms and answer their questions.</p>
   <p>Click each part of the record.</p>`,
   remember:['The record is a legal document: accurate, complete and legible.','Review records in a private area, never where others can see or hear.'],
   check:{q:'Where does a medical alert sticker go?',a:'Inside the cover of the record',d:['On the outside of the folder','On the patient’s bib','On the operatory door'],why:'An alert on the outside would let others see private health information, violating confidentiality.'}},
  {id:'w4-reg',sec:'The dental patient',title:'Registration',scene:SV('record',['r_reg']),controls:[],
   body:`<p>The ${T('registration form')} is used mainly by the business office to manage the account. It must be complete and accurate:</p>
   <p><b>Demographics:</b> full name, address, phone, employment and spouse information.<br><b>${T('Responsible party')}:</b> the person paying, who may not be the patient. They sign the ${T('release of information')} and the ${T('assignment of benefits')}.<br><b>Insurance:</b> the subscriber’s group or policy number. Copy the insurance card.</p>`,
   remember:['Check that every section is legible and complete before filing it.','The responsible party is usually also the insurance subscriber.'],
   check:{q:'Who signs the assignment of benefits?',a:'The responsible party',d:['The dentist','The insurance company','The dental assistant'],why:'The responsible party accepts payment responsibility and signs the release of information and assignment of benefits.'}},
  {id:'w4-medhx',sec:'The dental patient',title:'Medical history, medications and allergies',scene:SV('record',['r_med','r_alert']),controls:[],
   body:`<p>Every new patient completes a ${T('medical history')} before treatment, and signs it to confirm it’s accurate. Returning patients update and sign it at every visit.</p>
   <p>It matters because it alerts the dentist to conditions and medications that affect treatment, identifies special needs, and flags allergies that could cause an emergency. A ${T('medically compromised')} patient has an illness or condition that changes how treatment is provided; the dentist may consult their physician (with a signed release).</p>
   <p>The ${T('medication history')} lists every prescription, over-the-counter drug and vitamin, which is especially important for older patients. Ask about known and suspected ${T('allergies')}: reactions can get worse with each exposure. In dentistry, watch for latex, antibiotics, pain medications and local anesthetics.</p>`,
   remember:['Review the medical history before the patient arrives, and update it with them at the chair.','Ask “any changes in your health or medications since your last visit?”, then have them sign.','Latex allergy: non-latex gloves and dam, and an alert inside the chart.'],
   check:{q:'How often should a returning patient’s medical history be updated?',a:'At every visit',d:['Once a year','Only if they mention a change','Every 5 years'],why:'Health and medications change. The patient updates and signs it at each visit.'}},
  {id:'w4-hipaa',sec:'The dental patient',title:'Dental history and HIPAA privacy',scene:SV('record',['r_dent','r_hipaa']),controls:[],
   body:`<p>The ${T('dental history')} covers recent and past dental care, how often the patient visits, their attitude about their teeth, previous treatment and any fears or bad experiences. It helps the team recognize and calm dental fear.</p>
   <p>${T('HIPAA')} requires a written ${T('privacy policy')}: the office won’t use or share ${T('protected health information (PHI)')} for anything other than treatment, diagnosis and billing without additional authorization. Every patient signs an acknowledgment that they received the Notice of Privacy Practices, kept in the record at least 6 years.</p>`,
   remember:['Review histories in a private or semiprivate area.','HIPAA acknowledgment: every patient, kept 6 years.'],
   check:{q:'How long is the signed HIPAA acknowledgment kept?',a:'At least 6 years',d:['1 year','Until the next visit','30 years'],why:'The acknowledgment of the privacy practices is kept in the patient record for a minimum of 6 years.'}},
  {id:'w4-forms',sec:'The dental patient',title:'Exam, treatment plan and progress notes',scene:SV('record',['r_exam','r_tx','r_notes']),controls:[],
   body:`<p>The ${T('clinical examination form')} is the most comprehensive document in the record: existing restorations, missing teeth, perio findings, soft tissue, TMJ and occlusion, the chief complaint and images. It’s updated every visit.</p>
   <p>The ${T('treatment plan')} lists the problems found and the treatment needed, planned for the patient’s best interest, not around insurance. The patient sees the full case, then may choose alternatives.</p>
   <p>${T('Progress notes')} record what was discussed, diagnosed or done at every visit, plus phone calls, missed appointments, prescriptions and contact with insurance or other providers. Ink (preferably black), a single line through any error, legible and complete.</p>`,
   remember:['If it isn’t written down, it didn’t happen.','Good treatment notes: date, tooth, procedure, materials, anesthetic, how the patient did, post-op instructions given, initials.','Never erase or white-out; one line, initial and date.'],
   check:{q:'How do you correct an error in the progress notes?',a:'Draw a single line through it',d:['Use correction fluid','Erase it','Tear out the page'],why:'Progress notes are legal documents. A single line keeps the original visible.'}},
  {id:'w4-vitals',sec:'The dental patient',title:'Vital signs and temperature',scene:SV('vitals',['v_temp']),controls:[],
   body:`<p>${T('Vital signs')} are temperature, pulse, respiration and blood pressure. Take them at the first visit as a ${T('baseline')}, then at later visits, and monitor them in any emergency.</p>
   <p>Always be accurate: never estimate. If you’re unsure, repeat it or ask someone to check. Record it right away; never rely on memory.</p>
   <p>Average ${T('temperature')} is 98.6°F (37°C), with a normal range of about 97°F to 99°F. Usually taken orally with a digital thermometer. If the patient had something hot or cold to drink, exercised or smoked in the last 10 minutes, wait.</p>`,
   remember:['Never estimate. Record immediately.','Wait 10 minutes after hot or cold drinks, exercise or smoking.'],
   check:{q:'What is the average normal body temperature?',a:'98.6°F (37°C)',d:['96.0°F (35.6°C)','100.4°F (38°C)','101°F (38.3°C)'],why:'98.6°F is the accepted average; normal ranges from about 97°F to 99°F.'}},
  {id:'w4-pulse',sec:'The dental patient',title:'Pulse and respiration',scene:SV('vitals',['v_pulse','v_resp']),controls:[],
   body:`<p>The ${T('pulse')} is the beat of the heart. Place your index and middle fingers over a pulse point (most often the radial pulse at the thumb side of the wrist) and count the beats per minute. Normal at rest: adults 60 to 100 ${T('bpm')}, children 70 to 110.</p>
   <p>${T('Respiration')} is breathing in and out. Normal for a relaxed adult: 10 to 20 breaths per minute; children and teens 18 to 30. Note the rhythm and depth too.</p>`,
   remember:['Use two fingers, never your thumb.','Count respirations while you still seem to be taking the pulse, so the patient breathes normally.'],
   check:{q:'What is a normal resting pulse for an adult?',a:'60 to 100 beats per minute',d:['40 to 60','100 to 140','10 to 20'],why:'Adults at rest: 60–100 bpm. 10–20 is the adult respiration rate.'}},
  {id:'w4-bp',sec:'The dental patient',title:'Blood pressure',scene:SV('vitals',['v_bp']),controls:[],
   body:`<p>${T('Blood pressure')} is written as ${T('systolic')} (the heart pumping, the higher number) over ${T('diastolic')} (the heart at rest, the lower number): 129/78 mm Hg.</p>
   <p>The manual method uses a ${T('sphygmomanometer')} (cuff, bladder, bulb and gauge) and a ${T('stethoscope')} to hear the ${T('Korotkoff sounds')} of blood rushing back into the artery. Many offices use an automated electronic cuff. It’s the hardest vital sign, so practice.</p>
   <p>Your textbook’s Figure 11-10 classifies readings as normal or stages of hypertension. Commonly used American Heart Association categories: normal below 120/80; elevated 120–129 over below 80; stage 1 hypertension 130–139 or 80–89; stage 2 140 or higher or 90 or higher; above 180/120 is a crisis. Check the cutoffs your instructor uses.</p>`,
   remember:['Systolic on top, diastolic on the bottom.','A high reading: retake it, record it and tell the dentist before treatment starts.'],
   check:{q:'In 129/78, what is 129?',a:'The systolic pressure',d:['The diastolic pressure','The pulse','The respiration rate'],why:'The top, higher number is systolic, when the heart pumps. The bottom number is diastolic.'}},
  {id:'w4-visit',sec:'The dental patient',title:'The patient visit, start to finish',scene:RMX({room:'barriers',chair:'upright',pins:['chair','computer','aststool'],cam:'room'}),controls:['opview','roomstate','chair','zones','patient'],
   body:`<p>Your Session 4 patient competency follows a whole visit:</p>
   <p><b>Before the patient arrives:</b> review the medical history and planned treatment, pull up the most recent x-rays, check the room is clean, apply barriers, pull any lab cases or models, and set up the tray and sterile pack.</p>
   <p><b>Seating:</b> greet the patient by name and walk them to the room, chair upright and low. Explain the treatment, update the medical history and have it signed, and give and explain the consent form.</p>
   <p><b>Chairside:</b> sit correctly in the assistant’s chair in your zone (2 to 4 o’clock), transfer in the transfer zone, hold the HVE correctly, keep the field clean and dry with the HVE and air-water syringe, and know your instruments.</p>
   <p><b>After:</b> give post-op instructions, update the record and write good treatment notes, dismiss the patient, then break down and disinfect the room.</p>`,
   remember:['Ready before they walk in: chart reviewed, x-rays up, barriers on, tray set.','Explain before you do anything.','Treatment notes and records before the next patient.'],
   check:{q:'Which happens before the patient arrives?',a:'Reviewing the medical history and treatment plan',d:['Giving post-op instructions','Writing treatment notes','Disinfecting the room after treatment'],why:'Pre-arrival: review the chart, pull x-rays, check the room, apply barriers, pull lab work, set the tray.'}},
  /* ---- Radiography (Ch 16) ---- */
  {id:'w4-views',sec:'Dental radiography',title:'Three intraoral views',scene:SV('fmx',['m_bw','m_maxant','m_mandpost']),controls:[],
   body:`<p><b>${T('Periapical (PA)')}:</b> the whole tooth plus 3 to 4 mm beyond the apex. Used for abscesses and other problems around the root, and unerupted teeth.<br>
   <b>${T('Bitewing (BW)')}:</b> the crowns of both arches on one image. A bitewing survey (${T('BWX')}) is two or four images, for interproximal and recurrent decay, pulp problems and crestal bone.<br>
   <b>${T('Occlusal')}:</b> large areas of the upper or lower jaw on a size 4 film, for impactions, extra teeth, pathology and jaw fractures.</p>
   <p>With digital systems the result is called a ${T('digital image')}; a ${T('radiograph')} is an image on film.</p>`,
   remember:['PA = whole tooth + apex. BW = crowns of both arches. Occlusal = big area, #4 film.','Your competency: every PA must show the full tooth and periapical area without distortion.'],
   check:{q:'Which view is best for finding decay between the back teeth?',a:'Bitewing',d:['Periapical','Occlusal','Panoramic'],why:'Bitewings show the crowns of both arches and the contacts, where interproximal decay starts.'}},
  {id:'w4-film',sec:'Dental radiography',title:'The film packet, sizes and storage',scene:SV('film',[]),controls:[],
   body:`<p>A film packet has an outer wrap, black paper, the film and a ${T('lead foil')}. The plain white front always faces the PID; the colored back with the opening tab faces away. A small circle marks the ${T('embossed dot')}. Double-film packets make an instant duplicate for insurance or a referral.</p>
   <p>Store film by the manufacturer’s instructions away from light, heat, moisture, chemicals and scatter radiation, and watch the expiration date. Dispense films before you start onto a clean towel outside the room. Never leave films, exposed or not, in the room during other exposures; scatter radiation will fog them.</p>`,
   remember:['White side to the tube.','Dot toward the occlusal or incisal edge: “dot in the slot.”','Size 2 for adult BWs and posterior PAs, size 1 for anterior, size 4 occlusal.'],
   check:{q:'Which side of the film packet faces the tube?',a:'The plain white front',d:['The colored back with the tab','Either side','The side with the lead foil'],why:'The white side always faces the PID. A backward film shows a herringbone pattern.'}},
  {id:'w4-ic',sec:'Dental radiography',title:'Infection control for x-rays',scene:RMX({room:'barriers',apron:true,hl:['xray','apron'],pins:['xray','apron','xctl'],cam:'xray'}),controls:['opview','roomstate','patient'],
   body:`<p>You touch saliva placing and removing receptors, then touch the tubehead, PID, control panel, exposure button, keyboard, sensors and cables, PSPs, lead apron, chair controls and counters.</p>
   <p><b>Before seating:</b> place barriers; set out the sterile holders, receptors, a cup labeled with the patient’s name (outside the room), paper towels and cotton rolls so you never leave once gloved. Turn on the machine and check the settings.</p>
   <p><b>Seat the patient</b> upright, remove glasses, earrings and appliances, and place the lead apron and thyroid collar. Then wash, glove and open the sterile holders in front of the patient.</p>
   <p><b>During:</b> wipe saliva off each receptor and drop it in the cup without touching the outside of the cup.<br><b>After:</b> remove the apron (overgloves or clean hands; if gloved, disinfect it), take off barriers with gloves on, send holders to sterilization, wash your hands, then carry the films to processing.</p>`,
   remember:['Heat-sterilize holders; barrier the sensors (they can’t be sterilized).','Open sterile holders where the patient can see.','Your competency asks if the patient was comfortable and if you followed x-ray safety.'],
   check:{q:'You take off the lead apron while still wearing contaminated gloves. What now?',a:'Disinfect the lead apron',d:['Nothing, it’s noncritical','Throw it away','Put it through the autoclave'],why:'A lead apron touched with contaminated gloves must be disinfected. Use overgloves or clean hands to avoid that.'}},
  {id:'w4-parallel',sec:'Dental radiography',title:'The paralleling technique',scene:SV('technique',['t_para','t_xcp']),controls:[],
   body:`<p>Two rules: (1) the receptor is ${T('parallel')} to the long axis of the tooth, and (2) the beam is aimed ${T('perpendicular')} to the receptor and the tooth. It’s preferred because the image is the most accurate.</p>
   <p>Parallel means to the whole tooth, not just the crown: upper roots tilt toward the palate. So the receptor goes away from the teeth, toward the middle of the mouth, with the patient biting near the front edge of the bite-block.</p>
   <p>${T('XCP')} holders keep the receptor in place and have an ${T('aiming ring')} that lines up the PID: blue for anterior, yellow for posterior, red for bitewings. Seat the patient upright with the head straight and the occlusal plane of the arch being imaged parallel to the floor. Anterior receptors go vertical, posterior horizontal.</p>`,
   remember:['Receptor parallel to the tooth, beam perpendicular to both.','Holder away from the teeth, toward the midline.','Blue anterior, yellow posterior, red bitewing.'],
   check:{q:'In the paralleling technique, where does the receptor go?',a:'Parallel to the long axis of the tooth, away from the tooth',d:['Pressed against the crown','Perpendicular to the tooth','Under the tongue at any angle'],why:'It must be parallel to the whole tooth, which means placing it toward the middle of the mouth.'}},
  {id:'w4-angle',sec:'Dental radiography',title:'Vertical and horizontal angulation',scene:SV('angulation',[]),controls:[],
   body:`<p>${T('Vertical angulation')} is moving the tubehead up and down, like nodding “yes.” Too steep makes teeth ${T('foreshortened')}; too flat makes them ${T('elongated')}.</p>
   <p>${T('Horizontal angulation')} is moving it side to side, like shaking “no.” The beam has to pass straight through the contacts, or the contacts ${T('overlap')}. On a bitewing, even a little overlap can hide decay.</p>
   <p>The ${T('point of entry')} is where on the face the central ray is aimed; the beam must cover the whole receptor or you get a ${T('cone cut')}.</p>`,
   remember:['Vertical errors change the length: short = too steep, long = too flat.','Horizontal errors overlap contacts.','Look along the PID: no part of the receptor should show.'],
   check:{q:'The teeth on the image look too long. What happened?',a:'Vertical angulation was too flat',d:['Vertical angulation was too steep','Horizontal angulation was wrong','The film was backward'],why:'Elongation comes from too little vertical angulation. Too much makes teeth foreshortened.'}},
  {id:'w4-bisect',sec:'Dental radiography',title:'The bisecting angle technique',scene:SV('technique',['t_bisect']),controls:[],
   body:`<p>Used when paralleling won’t work: a shallow palate, short lingual frenum, tori, small children and some endodontic views.</p>
   <p>The receptor rests against the crowns and angles into the palate or floor of the mouth. The angle between the tooth and the receptor is bisected by an imaginary line, and the beam is aimed perpendicular to that line. Horizontally, the beam still goes through the contacts. Usually a size 2 receptor; only three are needed for the upper anteriors.</p>
   <div class="table-wrap"><table><thead><tr><th>Teeth</th><th>Maxillary</th><th>Mandibular</th></tr></thead><tbody>
   <tr><td class="k">Incisors</td><td class="m">+40 to +50°</td><td class="m">−15 to −25°</td></tr><tr><td class="k">Canines</td><td class="m">+45 to +55°</td><td class="m">−20 to −30°</td></tr>
   <tr><td class="k">Premolars</td><td class="m">+30 to +40°</td><td class="m">−10 to −15°</td></tr><tr><td class="k">Molars</td><td class="m">+20 to +30°</td><td class="m">−5 to 0°</td></tr></tbody></table></div>
   <p class="aka small">Your textbook’s Table 16-3 prints every value with a minus sign. In most references, maxillary angles are positive (PID tipped down) and mandibular angles negative (PID tipped up), as shown here. Ask your instructor which they’ll test.</p>`,
   remember:['Bisecting: receptor against the crown; beam perpendicular to the bisector.','Patient’s head upright for the upper arch, tipped slightly back for the lower.'],
   check:{q:'When might you use the bisecting angle technique?',a:'For a patient with a very shallow palate',d:['For every adult FMX','Only for bitewings','For panoramic images'],why:'Bisecting is a backup for anatomy that won’t allow paralleling, such as a shallow palate, short frenum or tori.'}},
  {id:'w4-fmx',sec:'Dental radiography',title:'The full-mouth survey',scene:SV('fmx',[]),controls:[],
   body:`<p>An ${T('FMX')} has 10 to 18 periapicals plus the bitewings the dentist wants. The number depends on the dentist, the teeth present, mouth size, anatomy, age and cooperation.</p>
   <p><b>Maxillary canine:</b> size 1 vertical, canine and first premolar centered, as far back as possible.<br><b>Maxillary incisors:</b> centered between the central and lateral.<br><b>Mandibular canine and incisors:</b> as far lingual as anatomy allows; a cotton roll stops the bite-block rocking.<br><b>Maxillary premolar:</b> horizontal, centered on the second premolar, midpalatal.<br><b>Maxillary molar:</b> centered on the second molar.<br><b>Mandibular premolar:</b> centered on the contact between the second premolar and first molar.<br><b>Mandibular molar:</b> centered on the second molar, as far lingual as the tongue allows.</p>
   <p>Click each group on the mount.</p>`,
   remember:['Anteriors vertical, posteriors horizontal.','Have the patient close slowly but firmly on the bite-block.','Your competency: 2 of each PA area, bitewing sets, 2 panos and a full FMX, graded by the dentist.'],
   check:{q:'The mandibular premolar periapical is centered on…',a:'The contact between the second premolar and first molar',d:['The canine','The second molar','The central incisors'],why:'That centers both premolars and the first molar on the image.'}},
  {id:'w4-bw',sec:'Dental radiography',title:'Bitewings',scene:SV('fmx',['m_bw']),controls:[],
   body:`<p>Bitewings are always taken parallel. The receptor (on a tab or holder) is parallel to the crowns of both arches, and the central ray is perpendicular to it.</p>
   <p><b>Premolar bitewing:</b> the front edge at the middle of the canine. It shows the distal halves of the canines, both premolars and often the first molars.<br><b>Molar bitewing:</b> centered on the second molar, the front edge at the middle of the mandibular second premolar.</p>
   <p>Place the lower half between the tongue and lower teeth, press the tab onto the lower teeth, and have the patient close slowly (watch your fingertip). Don’t pull it tight against the lower teeth. Set the vertical angle at about +10°. Stand in front, lay your finger along the arch and line the PID up with it, aim through the contacts, and check for a cone cut.</p>
   <p class="aka small">The textbook procedure prints −10°, but its own explanation describes a positive angle with the PID pointing down, which is the usual +10°.</p>`,
   remember:['Bitewings: equal amounts of upper and lower teeth, contacts open.','Horizontal angulation is everything on a bitewing.','Premolar BW: front edge at the middle of the canine.'],
   check:{q:'What makes a bitewing nondiagnostic most often?',a:'Overlapped contacts from wrong horizontal angulation',d:['Too many teeth showing','Using a size 2 receptor','Tipping the PID slightly down'],why:'Overlap hides the interproximal surfaces, which is the whole point of a bitewing.'}},
  {id:'w4-occlusal',sec:'Dental radiography',title:'Occlusal images',scene:SV('film',['f_sizes']),controls:[],
   body:`<p>The patient bites on the whole film, which is why it’s called ${T('occlusal')}. Adults use size 4 film; children, size 2. Uses: retained roots, extra or impacted teeth, salivary stones in the submandibular duct, jaw fractures, cleft palate, and changes in jaw size or shape.</p>
   <p>The white side faces the arch being imaged, the long edge goes side to side, and it sits as far back as possible. Vertical angulation runs 35 to 65°.</p>
   <p><b>Maxillary:</b> film plane and midsagittal plane set; central ray about 65° through the center of the film, with the top of the PID at the bridge of the nose.<br><b>Mandibular:</b> recline the patient; central ray at 90° to the film, centered about 1 inch below the chin.</p>`,
   remember:['Size 4 film for adults.','Maxillary ≈ 65°; mandibular 90° from under the chin.','Lead apron and thyroid collar every time.'],
   check:{q:'Which film size is used for an adult occlusal image?',a:'Size 4',d:['Size 0','Size 1','Size 2'],why:'Size 4 is the occlusal film. Size 2 is used for children.'}},
  {id:'w4-errors',sec:'Dental radiography',title:'Exposure and technique errors',scene:SV('errors',[]),controls:[],
   body:`<p>Only a ${T('diagnostic quality image')} helps the dentist, and every retake means more radiation for the patient. Learn to recognize each error, its cause and the fix. Click each one.</p>
   <p>Processing errors include overdevelopment, developer and fixer spots, scratches, water spots, low solution, roller marks, fingerprints, overlapped films, reticulation, air bubbles, static and fog.</p>`,
   remember:['Clear = never exposed. Black = light exposure.','Short = too steep. Long = too flat. Overlap = horizontal.','Herringbone = film backward.','Blur = movement. Double = exposed twice.'],
   check:{q:'An image shows a herringbone pattern. What happened?',a:'The film was placed backward',d:['The patient moved','The film was exposed twice','The vertical angle was too steep'],why:'With the back toward the tube, the lead foil pattern shows on the light image.'}},
  {id:'w4-process',sec:'Dental radiography',title:'Processing film',scene:SV('darkroom',[]),controls:[],
   body:`<p>Processing turns the invisible ${T('latent image')} into a visible one: ${T('developer')}, rinse, ${T('fixer')}, wash, dry. Developer and fixer are hazardous chemicals. Wear PPE and follow your state’s disposal rules.</p>
   <p>Replenish developer and fixer daily. Change manual solutions every 3 to 4 weeks and automatic ones every 2 to 6 weeks. Old solutions make films too light.</p>
   <p><b>${T('Manual processing')}</b> depends on time and temperature. The darkroom must be light-tight, clean, dry and ventilated, with a ${T('safelight')} (a red bulb is not a safelight), a timer, a floating thermometer, a stirring paddle, film hangers, a drying rack and a lead foil recycling container. Usually developer is on the left, water in the center, fixer on the right; always check. Keep the tanks covered.</p>
   <p><b>${T('Automatic processing')}</b> takes 4 to 6 minutes instead of about an hour. A ${T('daylight loader')} has light-tight sleeves, so no darkroom is needed. Clean the rollers and replenish chemicals; those are the two most common causes of breakdown.</p>`,
   remember:['Develop → rinse → fix → wash → dry.','Replenish daily.','Contaminated packets: remove gloves and wash before carrying films; handle packets as contaminated.'],
   check:{q:'What does the fixer do?',a:'Removes the unexposed silver halide crystals',d:['Brings out the latent image first','Softens the emulsion','Dries the film'],why:'Fixer clears unexposed crystals, leaving clear and white areas. Developer comes first.'}},
  {id:'w4-mount',sec:'Dental radiography',title:'Duplicating and mounting',scene:SV('fmx',['m_dot']),controls:[],
   body:`<p>${T('Duplicates')} are needed for referrals, insurance claims or when a patient changes dentists. Duplicating film is never exposed to x-rays. Under the safelight, put the radiographs on the duplicator glass, then the film with its emulsion (darker) side against them, and turn on the light. Longer light exposure makes duplicates lighter, the opposite of x-ray film.</p>
   <p>${T('Mounting')}: arrange processed films in anatomic order and label the mount with the patient’s name, the exposure date and the dentist. The ADA method is dots up, “a pimple, not a dimple,” viewed as if you’re facing the patient. Normal anatomy, restorations and missing teeth help you place each film. Know your dentist’s preference; a mounting mistake can lead to treating the wrong side.</p>`,
   remember:['Dot up = patient’s right on your left.','Label every mount.','Send duplicates; originals stay in the record.'],
   check:{q:'With the ADA dot-up method, where is the patient’s right side?',a:'On the viewer’s left',d:['On the viewer’s right','At the top','It depends on the film size'],why:'Dot up means you’re viewing as if facing the patient, so their right is on your left.'}},
  {id:'w4-digital',sec:'Dental radiography',title:'Digital imaging',scene:SV('digital',[]),controls:[],
   body:`<p><b>Advantages:</b> no chemical processing or lead foil, 50 to 80% less radiation, images in seconds, electronic transfer without distortion, enhancement and measurement, and great patient education.<br><b>Disadvantages:</b> setup cost, bulky sensors that make some patients gag, and sensors that can’t be heat sterilized.</p>
   <p><b>Solid-state sensors</b> (${T('CCD')} or CMOS) send the image straight to the computer, wired or wireless. Each gets an FDA-cleared barrier for every patient.</p>
   <p><b>${T('Phosphor storage plates (PSPs)')}</b> go in sealed barrier envelopes and must be ${T('scanned')} as soon as possible (they hold the image 12 to 24 hours). Erase them with bright light before reuse or you’ll get double images. Red safelights are not safe for PSPs.</p>
   <p>Digital doesn’t fix operator errors: foreshortening, elongation, overlap and cone cuts still happen.</p>`,
   remember:['New barrier for every sensor, every patient; don’t tear it between exposures.','Scan PSPs promptly, then erase.','Same placement rules as film; paralleling is preferred.'],
   check:{q:'Why must digital sensors have a barrier?',a:'They can’t be heat sterilized',d:['To make them warmer','The barrier improves the image','So the patient can’t see them'],why:'Sensors are semicritical but can’t take heat, so they’re barrier-protected and cleaned as the maker directs.'}},
  {id:'w4-safety',sec:'Dental radiography',title:'Radiation safety',scene:SV('safety',[]),controls:[],
   body:`<p>Follow ${T('ALARA')}: As Low As Reasonably Achievable. Even digital imaging is ionizing radiation.</p>
   <p>Protect the patient with a ${T('lead apron')} and ${T('thyroid collar')} for intraoral images. Protect yourself: stand behind an adequate barrier, or at least 6 feet away at a 90- to 135-degree angle to the beam. The exposure control is outside the room or behind the barrier. Never hold the receptor for the patient.</p>
   <p>Good technique is radiation safety: every retake doubles the dose for that image.</p>`,
   remember:['Apron and thyroid collar on every intraoral exposure.','Behind the barrier, or 6 feet at 90–135°.','Know your state’s rules and certification for taking x-rays.'],
   check:{q:'Where should the operator stand during an exposure if there’s no barrier?',a:'At least 6 feet away, at 90 to 135 degrees to the beam',d:['Right next to the patient holding the film','Directly behind the tubehead','In the path of the beam, 3 feet away'],why:'Distance and angle keep you out of the primary beam and away from most scatter.'}},
  {id:'w4-pano',sec:'Dental radiography',title:'Panoramic imaging',scene:SV('pano',[]),controls:[],
   body:`<p>A ${T('panoramic')} image shows both jaws on one film as the tubehead and receptor rotate around the patient. It’s used to locate impacted teeth, check eruption, find jaw lesions and see the overall jaws. It does not replace intraoral images and isn’t used to diagnose decay, periodontal disease or periapical lesions; bitewings supplement it.</p>
   <p><b>Pros:</b> whole jaws at once, quick to learn, comfortable, and less radiation than an FMX. <b>Cons:</b> less sharp, structures outside the ${T('focal trough')} blur, some distortion and overlap, and expensive equipment.</p>
   <p><b>Steps:</b> barrier on the bite-block; set exposure factors; explain it; place the pano lead apron; remove glasses, earrings, appliances and anything else that will show on the image; sit or stand straight; front teeth in the groove; ${T('midsagittal plane')} perpendicular and ${T('Frankfort plane')} parallel to the floor; lips closed, swallow, tongue on the palate; hold still.</p>`,
   remember:['Front teeth in the bite-block groove.','Midsagittal straight up, Frankfort level.','Tongue to the roof of the mouth.','The book’s thyroid collar is for intraoral images; a pano uses the pano apron.'],
   check:{q:'What should the patient do with the tongue for a pano?',a:'Press it against the roof of the mouth',d:['Stick it out','Rest it on the floor of the mouth','Bite on it'],why:'With the tongue on the palate, its air space won’t create a dark shadow over the upper teeth.'}},
  {id:'w4-consent',sec:'Dental radiography',title:'Consent, documentation and ownership',scene:SV('record',['r_consent','r_xray']),controls:[],
   body:`<p><b>${T('Informed consent')}:</b> explain why the images are needed, and the risks and benefits, including what could go undetected without them. For a minor or legally incompetent adult, the parent or guardian consents. Your competency checks that you get verbal consent.</p>
   <p><b>Documentation</b> in the record: the consent, the number and type of images, why they were taken, and what they showed.</p>
   <p><b>Ownership:</b> the dentist owns the radiographs, even though the patient or insurance paid. They are part of the permanent record. Patients may request copies in writing; duplicates go to the new dentist and originals stay.</p>`,
   remember:['Ask before you expose.','Document the number and type of images.','Originals stay; duplicates go.'],
   check:{q:'Who owns the patient’s dental radiographs?',a:'The dentist',d:['The patient','The insurance company','The dental assistant who took them'],why:'Radiographs are part of the dentist’s permanent record; the patient has a right to copies.'}},
  /* ---- Wrap-up ---- */
  {id:'w4-comp',sec:'Wrap-up',title:'Your Week 4 competency checklists',scene:RMX({room:'barriers',apron:true,cam:'xray'}),controls:['opview','roomstate','patient'],comp:'w4',
   body:`<p>Session 4 has two competencies. <b>The Dental Patient</b> is watched by the lead assistant or dentist and graded S or U; if you’re corrected, you repeat it on another patient. <b>Dental Radiology</b> x-rays are graded by the dentist: every PA must show the full tooth and periapical area without distortion, and bitewings need equal amounts of upper and lower teeth with the least overlapping. The lead assistant also answers yes or no on comfort, consent, safety and running the machine.</p>
   <p>Use “Show” to review each item, and check off what you can do on your own. Your checks are saved on this device only.</p>`},
  {id:'w4-best',sec:'Wrap-up',title:'Things best to remember',scene:SV('fmx',[]),controls:[],
   body:`<div class="remember"><h3>The dental patient</h3><ul>
   <li>The record is a legal document. Alerts go inside the cover, never outside.</li><li>Medical history before any treatment; update and sign every visit. Ask about medications and allergies (latex, antibiotics, pain meds, anesthetics).</li>
   <li>HIPAA acknowledgment signed by every patient, kept 6 years.</li><li>Progress notes in ink; one-line corrections.</li>
   <li>Temp 98.6°F (97–99). Pulse 60–100 adult, 70–110 child. Respiration 10–20 adult, 18–30 child/teen. BP systolic/diastolic.</li><li>Never estimate vitals; record them right away.</li></ul></div>
   <div class="remember"><h3>Taking x-rays</h3><ul>
   <li>PA = whole tooth + 3–4 mm past the apex. BW = crowns of both arches. Occlusal = #4 film.</li><li>White side to the tube; dot in the slot.</li>
   <li>Paralleling: receptor ∥ tooth, beam ⟂ both, holder away from the teeth. Blue anterior, yellow posterior, red bitewing.</li><li>Too steep = short; too flat = long; horizontal = overlap; off-center = cone cut.</li>
   <li>Bitewings: always parallel, about +10°, aim through the contacts.</li><li>Pano: groove, midsagittal ⟂, Frankfort level, tongue up, hold still.</li></ul></div>
   <div class="remember"><h3>Safety, processing and records</h3><ul>
   <li>ALARA. Apron and thyroid collar (intraoral). Barrier, or 6 feet at 90–135°.</li><li>Heat-sterilize holders; barrier sensors; scan and erase PSPs.</li>
   <li>Develop → rinse → fix → wash → dry. Replenish daily. Red bulb ≠ safelight. Recycle lead foil.</li><li>Mount dot up (ADA): patient’s right on your left. Label the mount.</li>
   <li>Get consent, document the images, and remember the dentist owns them.</li></ul></div>`}
];

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function pick(e){
  const r=canvas.getBoundingClientRect(); ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);

    const B=curBuild; if(!B||B.state!=='ready')return null;
    const objs=[B.plane,B.tooth,B.pulp,B.bone,B.gum].filter(o=>o.visible);
    const hits=ray.intersectObjects(objs,false);
    for(const h of hits){
      const p=h.point, kind=h.object.userData.kind;
      if(V.aview==='cut'&&kind!=='section'&&p.z>0.02)continue;
      if(V.aview==='xray'&&kind==='tooth'){continue;}
      let info;
      if(kind==='section'){

      } else {
        const n=h.face?h.face.normal.clone():V3(0,0,1);
        const q=p.clone().addScaledVector(n,kind==='tooth'||kind==='pulp'?-0.06:0);
        info=shellInfo(B,q.x,q.y,q.z,kind);
      }
      return {part:partAt(B,info),info};
    }
    if(V.aview==='xray'){const h=hits.find(h=>h.object.userData.kind==='tooth');if(h){const info=shellInfo(B,h.point.x,h.point.y,h.point.z,'tooth');return {part:partAt(B,info),info};}}
    return null;
  }
  const hits=ray.intersectObjects(pickables,false).filter(h=>{const t=h.object.userData.tooth;if(t.set!==V.set)return false;const set=SETS[t.set];return (t.arch==='upper'?set.up.visible:set.low.visible)&&(!V.isolate||t===V.isolate);});

  const firstK=kh[0], firstT=hits[0];
  if(firstK&&(!firstT||firstK.distance<firstT.distance)){const k=refineKit(firstK);return k?{kpart:k}:null;}
  if(!hits.length)return null;
  const h=hits[0],t=h.object.userData.tooth;
  let surf=null; if(h.object.userData.kind==='crown'&&h.face){const s=h.object.geometry.userData.surf[h.face.a]; surf=s<5?s:null;}
  return {tooth:t,surf};
}

  switch(part){
    case 'mandible':{const f=SETS.perm.curve.lower.getPointAt(0.5);if(lp.y>-16.2)return 'alveolarLow';if(Math.abs(lp.x)<8&&lp.z>f.z+2&&lp.y<-27)return 'protuberance';return 'mandible';}

  const d=OPP[k]||OP_IP[k]; if(!d)return;
  showChip(`<b>${esc(d.name)}</b><span>${esc(d.def)}</span>${d.da?`<span class="da"><b>Chairside:</b> ${esc(d.da)}</span>`:''}`);
}
function svgChip(k){const d=SVGP[k];if(d)showChip(`<b>${esc(d.name)}</b><span>${esc(d.def)}</span>`);}
const SVG_DEF_LAYERS={ppe:['don'],office:['clinical','business']};
/* Show any target: an op part key, 'mech', 'steri', 'room:<state>', 'chair:<pose>' or 'svg:<view>:<part>' */
function showTarget(k,fly){
  const tab=mode==='op', p=prefs.op; chip.hidden=true;
  if(k.startsWith('svg:')){
    const [,view,key]=k.split(':');
    Object.assign(V,{svgView:view,svgLayers:new Set(SVG_DEF_LAYERS[view]||[]),svgHl:key?[key]:[],svgPins:[]});
    if(tab){p.svg=true;p.svgView=view;p.svgPart=key||null;if(view==='office')p.office=key||null;}
    showScene('svg'); sync(); renderPanel(); if(key)svgChip(key); return;
  }
  let key=k, view=null; const extra={};
  if(k.startsWith('room:')){extra.roomState=k.slice(5);key=null;view='room';}
  else if(k==='mech'||k==='steri'){view=k;key=null;}
  else if(k.startsWith('chair:')){extra.chair=k.slice(6);key='chair';}
  if(key==='barrier')extra.roomState='barriers';
  if(key==='apron'){extra.apron=true;extra.patient=true;extra.chair='upright';}
  if(key){view=key.startsWith('ip_')?'inst':OPP[key].v;if(key.startsWith('z_'))extra.zones=true;if(key.startsWith('ip_'))extra.opParts=true;if(fly!==false&&(key==='jbox'||key==='trap'))extra.patient=false;}
  Object.assign(V,{opView:view},extra,{opHl:key?[key]:[],opPins:key?[key]:[]});
  if(tab){p.svg=false;p.opView=view;p.part=key;['chair','zones','patient','opParts','roomState','apron'].forEach(x=>p[x]=V[x]);}
  if(V.scene!=='op')showScene('op');
  if(fly!==false)camOp(key?(key.startsWith('z_')?'top':key==='xctl'||key==='apron'?'xray':key==='barrier'?'units':key):view==='room'?(extra.roomState?'units':'room'):view);
  sync(); renderPanel(); if(key)opChip(key);
}
function selectOP(k,fly,ip){showTarget(k,fly);if(ip)opChip(k,ip);}
const focusOp=k=>showTarget(k);
function applyOpTab(){
  const p=prefs.op;
  if(p.svg){const view=p.svgView||'office';Object.assign(V,{svgView:view,svgLayers:new Set(view==='ppe'?[p.ppeLayer||'don']:(SVG_DEF_LAYERS[view]||[])),svgHl:view==='office'?(p.office?[p.office]:[]):(p.svgPart?[p.svgPart]:[]),svgPins:[]});showScene('svg');return;}
  Object.assign(V,{opView:p.opView,chair:p.chair,zones:p.zones,patient:p.patient,opParts:p.opParts,roomState:p.roomState||'clean',apron:!!p.apron,opHl:p.part?[p.part]:[],opPins:p.part?[p.part]:[]});
  const cam=p.part?(p.part.startsWith('z_')?'top':p.part==='xctl'?'xray':p.part):p.opView;
  showScene('op',cam); p.first=false;
}
function zoneLegend(){return `<div class="surfchips" style="margin:4px 0 12px">${[['Operator 7–12','#2F6BE0'],['Transfer 4–7','#E0A11B'],['Assistant 2–4','#12A38A'],['Static 12–2','#8A96A0']].map(i=>`<span class="sc"><i style="background:${i[1]}"></i>${i[0]}</span>`).join('')}</div>`;}
function roomLegend(){return V.roomState==='dirty'?`<div class="surfchips" style="margin:4px 0 12px"><span class="sc"><i style="background:#E0584A"></i>Touched with gloved hands: barrier or disinfect</span></div>`:V.roomState==='barriers'?`<div class="surfchips" style="margin:4px 0 12px"><span class="sc"><i style="background:#8FD0F7"></i>Surface barriers in place</span></div>`:'';}
const compDone=new Set((()=>{try{return JSON.parse(store.get('dta-s2comp')||'[]');}catch(_){return [];}})());
const COMPS={s2:{list:COMP_S2,pre:'',title:'Week 2 competency checklist'},w3:{list:COMP_W3,pre:'w3:',title:'Week 3 competency checklist'},w4:{list:COMP_W4,pre:'w4:',title:'Week 4 competency checklists'}};
function compList(which){
  const C=COMPS[which]||COMPS.s2, N=C.list.reduce((a,s)=>a+s[1].length,0);
  let n=0; C.list.forEach((s,i)=>s[1].forEach((_,j)=>{if(compDone.has(C.pre+i+'-'+j))n++;}));
  return `<div class="comp"><div class="comphead"><b>${n} of ${N}</b> checked<div class="bar"><i style="width:${n/N*100}%"></i></div></div>
  ${C.list.map(([t,items],i)=>`<h3>${esc(t)}</h3><ul class="complist">${items.map(([txt,k],j)=>{const id=C.pre+i+'-'+j,on=compDone.has(id);return `<li><button class="cbox" data-comp="${id}" aria-pressed="${on}" aria-label="Checked: ${esc(txt)}">${on?'✓':''}</button><span>${esc(txt)}</span><button class="cshow" data-show="${k}">Show</button></li>`;}).join('')}</ul>`).join('')}</div>`;
}
const ppeToggle=()=>`<div class="seg" role="group" aria-label="PPE sequence" style="display:inline-flex;margin:4px 0 12px">${['don','doff'].map(l=>`<button data-ppe="${l}" aria-pressed="${V.svgLayers.has(l)}">${l==='don'?'Putting on':'Taking off'}</button>`).join('')}</div>`;
function opPanel(){
  const p=prefs.op;
  if(p.svg&&(p.svgView||'office')==='office'){
    const k=p.office, d=k?SVGP[k]:null, ks=Object.keys(SVGP).filter(x=>SVGP[x].v==='office');
    return `<section><p class="eyebrow">DENTAL OFFICE · FLOOR PLAN</p>${d?`<h2>${esc(d.name)}</h2><p class="callout">${esc(d.def)}</p>`:`<h2>The dental office</h2><p>Two sections: clinical (blue) and business (tan). Click a room on the plan or below.</p>`}</section>
    ${[['clinical','Clinical section'],['business','Business section']].map(([l,n])=>`<section><h3>${n}</h3><div class="parts">${ks.filter(x=>SVGP[x].layer===l).map(x=>`<button data-offk="${x}" aria-pressed="${x===k}">${esc(SVGP[x].name)}</button>`).join('')}</div></section>`).join('')}
    <section><h3>The dental team</h3><p class="small"><b>Clinical department:</b> dentist, dental hygienist, dental assistant (chairside and circulating), dental lab technician.<br><b>Business department:</b> office manager, receptionist, treatment coordinator, insurance coordinator, appointment coordinator.</p></section>`;
  }
  if(p.svg){
    const view=p.svgView, k=p.svgPart, d=k?SVGP[k]:null, ks=Object.keys(SVGP).filter(x=>SVGP[x].v===view), nm=(SVG_DIAGRAMS.find(x=>x[0]===view)||[,''])[1];
    return `<section><p class="eyebrow">INFECTION CONTROL · DIAGRAMS</p><div class="chips" style="margin-bottom:12px">${SVG_DIAGRAMS.map(([v,n])=>`<button data-diag="${v}" aria-pressed="${v===view}">${esc(n)}</button>`).join('')}</div>
    ${d?`<h2>${esc(d.name)}</h2><p class="callout">${esc(d.def)}</p>`:`<h2>${esc(nm)}</h2><p>Click any part of the diagram to learn about it.</p>`}${view==='ppe'?ppeToggle():''}</section>
    <section><h3>Parts</h3><div class="parts">${ks.map(x=>`<button data-svgpart="${x}" aria-pressed="${x===k}">${esc(SVGP[x].name)}</button>`).join('')}</div></section>`;
  }
  const k=p.part, d=k?(OPP[k]||OP_IP[k]):null, VN={room:'OPERATORY',mech:'MECHANICAL ROOM',inst:'INSTRUMENTS',steri:'STERILIZATION CENTER'}[V.opView];
  const intro={room:'Click anything in the room to name it. Turn on the clock zones, try the chair positions, or switch the room to “In use” or “Barriers on.”',mech:'The equipment behind the scenes that feeds every operatory.',inst:'Exam and accessory instruments on the color-coded tray, handpieces and burs on the mat, and a hygiene cassette. Turn on “Instrument parts” to color the working end, shank and shaft.',steri:'Instruments move one way only: from the contaminated area on the left, through the clean packaging area, to sterilization and storage on the right.'}[V.opView];
  const groups=OP_GROUPS[V.opView]||[];
  const partsBtns=V.opView==='inst'?`<h3 style="margin-top:12px">Instrument parts</h3><div class="parts">${Object.keys(OP_IP).map(x=>`<button data-opk="${x}" aria-pressed="${x===k}"><i style="background:${OP_PARTC[x.slice(3)]}"></i>${esc(OP_IP[x].name)}</button>`).join('')}</div>`:'';
  const title={room:'The dental operatory',mech:'The mechanical room',inst:'Dental instruments',steri:'The sterilization center'}[V.opView];
  return `<section><p class="eyebrow">CLINIC · ${VN}</p>${d?`<h2>${esc(d.name)}</h2><p class="callout">${esc(d.def)}</p>${d.da?`<p class="da-box"><b>Chairside:</b> ${esc(d.da)}</p>`:''}`:`<h2>${title}</h2><p>${intro}</p>`}${V.zones&&V.opView==='room'?zoneLegend():''}${V.opView==='room'?roomLegend():''}</section>
  <section>${partsBtns}${groups.map(g=>`<h3 style="margin-top:12px">${esc(g)}</h3><div class="parts">${Object.keys(OPP).filter(x=>OPP[x].grp===g&&OPP[x].v===V.opView).map(x=>`<button data-opk="${x}" aria-pressed="${x===k}">${esc(OPP[x].name)}</button>`).join('')}</div>`).join('')}</section>
  <section><details class="compwrap" data-c="s2"${p.compOpen_s2?' open':''}><summary>Week 2 competency checklist</summary>${compList('s2')}</details>
  <details class="compwrap" data-c="w3" style="margin-top:10px"${p.compOpen_w3?' open':''}><summary>Week 3 competency checklist</summary>${compList('w3')}</details>
  <details class="compwrap" data-c="w4" style="margin-top:10px"${p.compOpen_w4?' open':''}><summary>Week 4 competency checklists</summary>${compList('w4')}</details></section>`;
}
panel.addEventListener('toggle',e=>{const t=e.target;if(t.classList&&t.classList.contains('compwrap'))prefs.op['compOpen_'+t.dataset.c]=t.open;},true);

/* ================= Resize + loop ================= */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage); resize();
const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
let biteNow=0, jawNow=0, tongueNow=0, lastT=performance.now();
const jawT=V3(0,0,0), JAW={closed:[0,0,0,0],hinge:[0.22,0,0,0],wide:[0.42,0,-3,6],protrude:[0.04,0,-1.2,5.5]};
let PIV=V3(0,30,-58);
function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  if(camAnim){const k=Math.min(1,(now-camAnim.t0)/650),e=ease(k);camera.position.lerpVectors(camAnim.p0,camAnim.p1,e);controls.target.lerpVectors(camAnim.q0,camAnim.q1,e);if(k>=1)camAnim=null;}
  const bt=V.bite, J=JAW[V.jaw]||JAW.closed, sp=reduced?1:dt*3.5;
  biteNow+=Math.max(-sp,Math.min(sp,bt-biteNow)); jawNow+=Math.max(-sp*0.35,Math.min(sp*0.35,J[0]-jawNow));
  const st3=reduced?99:dt*12; jawT.x+=Math.max(-st3,Math.min(st3,J[1]-jawT.x)); jawT.y+=Math.max(-st3,Math.min(st3,J[2]-jawT.y)); jawT.z+=Math.max(-st3,Math.min(st3,J[3]-jawT.z));
  const tt=V.tongueUp?-0.62:0; tongueNow+=Math.max(-sp*0.5,Math.min(sp*0.5,tt-tongueNow)); if(KIT.tonguePivot)KIT.tonguePivot.rotation.x=tongueNow;
  (KIT.discs||[]).forEach(d=>{d.position.z=jawT.z*0.85+jawNow*3;d.position.y=jawT.y*0.5;});
  const set=SETS[V.set], bo=set.cfg.bite*biteNow;
  set.up.position.set(0,-bo,0);
  set.low.position.set(0,bo,-1.2*biteNow);
  const c=Math.cos(jawNow),s=Math.sin(jawNow);
  set.lowWrap.rotation.x=jawNow;
  set.lowWrap.position.set(jawT.x,PIV.y-(PIV.y*c-PIV.z*s)+jawT.y,PIV.z-(PIV.y*s+PIV.z*c)+jawT.z);
  controls.update();
  if(OP.chair){const T=CHAIR_POSE[V.chair]||CHAIR_POSE.supine,p=OP.chair.pose,k=reduced?1:Math.min(1,dt*2.6);p.L+=(T.L-p.L)*k;p.b+=(T.b-p.b)*k;p.l+=(T.l-p.l)*k;applyChair();}
  if(curScene!=='svg')renderer.render(curScene==='anat'?anatScene:curScene==='op'?opScene:archScene,camera);
  updatePins();
  requestAnimationFrame(loop);
}

/* ================= Boot ================= */
buildKit(); PIV=KIT.condyle.clone();
buildOp(); opScene.add(OP.root); applyChair();
camArch('front',true);
requestBuild('lowerMolar|adult|healthy');
const start=(location.hash||'').slice(1);
enterMode(['lesson','op','chart','anatomy','headneck','surfaces','quiz'].includes(start)?start:'chart');
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{allTeeth().forEach(drawLabel);});
requestAnimationFrame(loop);


})();
